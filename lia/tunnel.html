 showStage(step);var fl=document.getElementById('lqFlash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
 var c=CAPS[k],ch=chunks(words(c)),done=false,last='';
 function fin(){if(done)return;done=true;cancelAnimationFrame(RAF);capEl.innerHTML='';prog.style.width='100%';res()}
 if(V.dataset.k!==k){V.src=srcOf(k);V.dataset.k=k;V.muted=snd.hidden?false:true;V.play().catch(function(){V.muted=true;V.play().catch(function(){});snd.hidden=false})}
 else if(V.ended){V.currentTime=0;V.play()}
 V.onended=fin;var guard=setTimeout(fin,12000);V.onplaying=function(){clearTimeout(guard);guard=setTimeout(fin,(V.duration||8)*1000+2500)};
 function tick(){var t=V.currentTime;prog.style.width=(t/(V.duration||8)*100)+'%';
  var ci=-1,wi=-1;ch.forEach(function(g,gi){g.forEach(function(o,oi){if(o.t<=t){ci=gi;wi=oi}})});
  var g=ch[ci],lastW=g&&g[g.length-1],key=ci+':'+wi;
  if(ci>=0&&t>c.s[c.s.length-1][1]+0.6)key='x';
  if(key!==last){last=key;if(key==='x'||ci<0){capEl.innerHTML=''}else{capEl.innerHTML=g.slice(0,wi+1).map(function(o,i){return '<span'+(i===wi?' class="on"':'')+'>'+o.w+'</span>'}).join(' ')}}
  if(!done)RAF=requestAnimationFrame(tick)}
 RAF=requestAnimationFrame(tick)})}
