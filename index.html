<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" id="tc">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ws_theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta name="description" content="WillShop : commandes, relances, livraisons et pilotage.">
<script>
// Lien « ?simple » : pas d'installation, juste un raccourci qui ouvre l'app dans Chrome (vieux téléphones Android)
if (!/[?&]simple/.test(location.search)) { var l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l); }
</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WillShop">
<title>WillShop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : app téléphone à une colonne. En-tête collant avec le choix d'espace (Direction / Commercial / Livreur), barre d'onglets en bas ; colonne centrée de 760px sur ordinateur. Palette WillShop : crème, bordeaux, or, noir. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F6F3EE; --ink:#1F1917; --mut:#6B625B; --faint:#A0958C; --line:#ECE6DC;
  --bx:#800020; --bx-fill:#800020; --bx-soft:#F5E6E9; --on-bx:#FFF8EC; --hero:#800020; --hero-mut:#E9C9CF;
  --gold:#9A7220; --gold-fill:#D4A843; --gold-soft:#FDF5E2;
  --ok:#2E7D4F; --ok-soft:#E5F1E9; --bad:#B3261E; --bad-soft:#FBE8E6; --info:#3F5C7A; --info-soft:#E8EEF4; --warn:#C46A12; --warn-soft:#FCEEDD;
  --shadow:0 4px 16px rgba(31,25,23,.06);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14100F; --surface:#1D1715; --sunk:#251E1B; --ink:#F3ECE4; --mut:#ACA096; --faint:#7D726A; --line:#342A26;
  --bx:#E89AA8; --bx-fill:#9C2640; --bx-soft:#3A1B22; --on-bx:#FFF8EC; --hero:#4E1222; --hero-mut:#D9AEB7;
  --gold:#E2BC62; --gold-fill:#D4A843; --gold-soft:#2C2416;
  --ok:#74C595; --ok-soft:#172A1F; --bad:#F2908A; --bad-soft:#3A1C1A; --info:#9DB8D6; --info-soft:#1B2530; --warn:#F0A35A; --warn-soft:#33220F;
  --shadow:0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14100F; --surface:#1D1715; --sunk:#251E1B; --ink:#F3ECE4; --mut:#ACA096; --faint:#7D726A; --line:#342A26;
  --bx:#E89AA8; --bx-fill:#9C2640; --bx-soft:#3A1B22; --on-bx:#FFF8EC; --hero:#4E1222; --hero-mut:#D9AEB7;
  --gold:#E2BC62; --gold-fill:#D4A843; --gold-soft:#2C2416;
  --ok:#74C595; --ok-soft:#172A1F; --bad:#F2908A; --bad-soft:#3A1C1A; --info:#9DB8D6; --info-soft:#1B2530; --warn:#F0A35A; --warn-soft:#33220F;
  --shadow:0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.brand{font:800 22px/1 var(--serif);letter-spacing:-.01em;color:var(--bx)}
.brand small{font:700 10px/1 var(--sans);letter-spacing:.14em;color:var(--gold);margin-left:4px;vertical-align:3px}
.sync{margin-left:auto;font-size:12px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--mut);font:600 13px var(--sans);padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--bx);box-shadow:var(--shadow)}
:is(button,a,select,input,textarea):focus-visible{outline:2px solid var(--gold-fill);outline-offset:2px}
h1{font:700 26px/1.15 var(--serif);margin:18px 0 2px;text-wrap:balance}
h2{font:700 19px/1.25 var(--serif);margin:26px 0 10px;text-wrap:balance;display:flex;align-items:baseline;gap:8px}
h2 .count{font:600 13px var(--sans);color:var(--mut)}
.sub{color:var(--mut);font-size:13.5px;margin:0}
.eyebrow{font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.num{font-variant-numeric:tabular-nums}
/* Carte héro */
.hero{background:var(--hero);color:var(--on-bx);border-radius:20px;padding:18px 18px 16px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:var(--gold-fill)}
.hero .big{font:800 36px/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .row2{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--hero-mut);font-size:13.5px}
.hero .row2 b{color:var(--on-bx);font-variant-numeric:tabular-nums}
/* Tuiles */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi b{font:700 26px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--faint)}
/* Points d'attention */
.alerts{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:500 14px var(--sans);width:100%;text-align:left;cursor:pointer}
.alert:first-child{border-top:0}
.alert .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
.alert.hot .dot{background:var(--bad)} .alert.warm .dot{background:var(--gold-fill)}
.alert .n{margin-left:auto;font:700 16px var(--serif);font-variant-numeric:tabular-nums}
.alert .chev{color:var(--faint)}
.calm{padding:14px;color:var(--mut);font-size:14px}
/* Tunnel */
.funnel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px}
.fstep{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 4.5em;align-items:center;gap:10px;font-size:13px}
.ftrack{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.ftrack span{display:block;height:100%;background:var(--gold-fill);border-radius:6px}
.fstep:last-child .ftrack span{background:var(--bx-fill)}
.fstep b{text-align:right;font-variant-numeric:tabular-nums}
.fstep b i{font-style:normal;color:var(--faint);font-weight:500}
/* Trésorerie */
.cash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cash div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.cash span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.cash b{display:block;font:700 17px/1.3 var(--serif);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cash small{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
/* Barres 7 jours */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;padding:18px 14px 26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%;background-origin:content-box}
.bar{background:var(--gold-fill);border-radius:6px 6px 2px 2px;position:relative;min-height:3px;opacity:.75}
.bar.today{background:var(--bx-fill);opacity:1}
.bar i{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--mut)}
.bar em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
/* Listes et cartes commandes */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.c-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.c-top>div{min-width:0}
.who{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.place{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.amt{font:700 18px/1.2 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;margin-top:6px}
.s-pro{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-fill)}
.s-new{background:var(--bx-soft);color:var(--bx)}
.s-conf{background:var(--gold-soft);color:var(--gold)}
.s-road{background:var(--info-soft);color:var(--info)}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-bad{background:var(--bad-soft);color:var(--bad)}
.s-mut{background:var(--sunk);color:var(--mut)}
.msg-box{background:var(--sunk);border-radius:12px;padding:9px 11px;font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg-box .eyebrow{display:block;margin-bottom:4px;font-size:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--sans);cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn.pri{background:var(--bx-fill);border-color:var(--bx-fill);color:var(--on-bx)}
.btn.gold{background:var(--gold-fill);border-color:var(--gold-fill);color:#1F1917}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.small{min-height:36px;padding:0 11px;font-size:13px}
.btn.ghost{background:none}
.btn.wide{flex:1 1 0;min-width:0}
.btn[disabled]{opacity:.5;cursor:default}
select.sel{min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--sans);padding:0 8px;max-width:100%}
.panel{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.panel .opts{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:4px 0 12px;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 13px;font:600 13px var(--sans);cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .c{color:var(--bg);opacity:.7}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mut)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;white-space:pre-wrap;line-height:1.6}
.banner{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.banner.err{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--gold-soft);color:var(--ink)}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:15px var(--sans);background:var(--surface);color:var(--ink);margin-bottom:6px}
.field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:15px var(--sans);background:var(--surface);color:var(--ink)}
/* Routine commerciale */
.steps{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
.stp{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--mut);border-radius:12px;padding:8px 12px;font:600 12.5px var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.stp b{font:700 17px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.stp[aria-current="step"]{border-color:var(--bx-fill);box-shadow:inset 0 0 0 1px var(--bx-fill);color:var(--bx)}
.stp.done b{color:var(--ok)}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:12px}
.progress span{display:block;height:100%;background:var(--gold-fill);transition:width .3s}
.step-head{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.next{margin-top:14px;display:flex;justify-content:flex-end}
/* Livreur */
.me{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 14px}
.me label{font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
.me select{flex:1;min-width:0}
.drive .place{font-size:17px}
.collect{display:flex;justify-content:space-between;align-items:center;background:var(--gold-soft);border-radius:12px;padding:8px 12px}
.collect span{font-size:12.5px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.collect b{font:800 20px var(--serif);font-variant-numeric:tabular-nums}
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.contact .btn{padding:0 6px;font-size:12.5px;gap:4px}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-actions .btn{min-height:48px}
/* Équipe */
.team-row{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--bx-soft);color:var(--bx);display:grid;place-items:center;font:700 15px var(--serif);flex:none}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:600px){.form{grid-template-columns:1.3fr 1fr 1fr 1fr auto}}
/* Assistant */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--bx-fill);color:var(--on-bx);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.composer{display:flex;gap:8px;margin-top:12px}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:15px var(--sans);background:var(--surface);color:var(--ink);min-height:46px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* Rappel et revue du matin */
.remind{margin-top:14px;background:var(--gold-soft);border:1px solid var(--gold-fill);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.remind b{font:700 16px var(--serif)}
.remind ul{margin:0;padding-left:18px;font-size:13.5px}
.review{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.dots i.on{background:var(--gold-fill)}
.review .q{font:700 15px var(--sans);color:var(--mut)}
.review .big{font:800 44px/1 var(--serif);color:var(--bx);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.review .facts{display:flex;flex-direction:column;gap:8px}
.fact{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.fact:first-child{border-top:0}
.fact b{font:700 16px var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.review .say{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.review .nav{display:flex;gap:8px;justify-content:space-between;align-items:center}
[hidden]{display:none!important}
/* Connexion */
html{padding-top:env(safe-area-inset-top,0px)}
.login{max-width:380px;margin:9vh auto 0;display:flex;flex-direction:column;gap:12px}
.login-logo{display:block;margin:0 auto;border-radius:50%;box-shadow:0 10px 30px rgba(128,0,32,.25)}
.pin{letter-spacing:.5em;text-align:center;font:700 24px var(--sans)}
.field{min-height:48px;font-size:16px}
/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;width:100%;max-width:760px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;color:var(--faint);font:600 11px var(--sans);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--bx)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--gold-fill);border-radius:0 0 2px 2px}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bx-fill);color:var(--on-bx);font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:8;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.kpi,.hero{animation:up .22s ease both}@keyframes up{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* Commandes : à faire aujourd'hui */
.oswitch{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:14px}
.oswitch button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 8px;font:inherit;font-weight:700;font-size:14px;color:var(--muted,#777);cursor:pointer}
.oswitch button[aria-pressed="true"]{background:var(--ink,#1d1d1b);color:var(--bg,#fff)}
.oswitch b{display:inline-block;min-width:20px;padding:1px 6px;border-radius:99px;background:#C8102E;color:#fff;font-size:12px;margin-left:4px}
.tgroup{margin-top:22px}
.tg-head{display:flex;align-items:center;gap:10px}
.tg-head h2{margin:0;font-size:18px;flex:1}
.tg-head .dot{width:12px;height:12px;border-radius:50%;flex:none}
.tg-n{font-weight:800;font-size:15px;min-width:28px;text-align:center;padding:2px 8px;border-radius:99px;color:#fff}
.tg-d{margin:4px 0 10px 22px;font-size:13.5px;opacity:.75}
.g-red .dot,.g-red .tg-n,.b-red{background:#C8102E}
.g-orange .dot,.g-orange .tg-n,.b-orange{background:#E07A00}
.g-green .dot,.g-green .tg-n,.b-green{background:#1E8E4E}
.g-blue .dot,.g-blue .tg-n,.b-blue{background:#2F6FD6}
.g-grey .dot,.g-grey .tg-n,.b-grey{background:#6B6B6B}

function deliveryDate(o) {

async function api(action, p, tries = 2) {
  let r;
  try {
    const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const tm = ctl ? setTimeout(() => ctl.abort(), 25000) : 0;
    r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, cred, p: p || {} }), signal: ctl ? ctl.signal : undefined });
    clearTimeout(tm);
  } catch (e) {
    if (tries > 1) { await new Promise(ok => setTimeout(ok, 1500)); return api(action, p, tries - 1); }
    const err = new Error("Pas de connexion"); err.net = true; throw err;
  }
  let j; try { j = await r.json(); } catch (e) { const err = new Error("Pas de connexion"); err.net = true; throw err; }
  if (!j.ok) throw new Error(j.error || "Erreur");
  return j.data;
}
let loading = false;
async function load(quiet) {
  if (!cred || loading) return;
  loading = true;
  if (!quiet) document.getElementById("sync").textContent = "Actualisation…";
  try {
    const d = await api("data");
    applyData(d);
    try { store("ws_cache", JSON.stringify(d)); } catch (e) {}
    lastSync = new Date();
    document.getElementById("sync").textContent = myName + " · " + lastSync.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    banner(""); render();
    if ((realRole || role) !== "driver") loadSv(true);
  } catch (e) {
    if (!e.net && /PIN|essais/i.test(e.message)) { logout("Ton code a changé. Reconnecte-toi."); }
    else { banner("Pas de connexion pour le moment. Les dernières données restent affichées."); document.getElementById("sync").textContent = "Hors ligne"; }
  } finally { loading = false; }
}
function applyData(d) {
    const fetched = d.rows.map(x => rowFrom(x.v, x.row - 2)).filter(o => o.produit || o.tel);
    const nowTime = Date.now();
    const pending = orders.filter(o => o.row >= 100000 && (nowTime - (o.date ? o.date.getTime() : 0)) < 1800000);
    const stillPending = pending.filter(po => !fetched.some(fo => fo.tel === po.tel && fo.produit === po.produit && Math.abs((fo.date || 0) - (po.date || 0)) < 120000));
    orders = [...stillPending, ...fetched];
    drivers = d.drivers || [];
    if (d.visits) { visits = d.visits.map(v => ({ date: parseDate(v[0]), produit: v[1] || "", step: v[3] || "Arrivée" })); visitsLoaded = true; }
    if (d.team) { team = d.team; teamLoaded = true; }
    if (d.stock) stock = d.stock;
    if (d.moves) moves = d.moves;
    if (d.remises) remises = d.remises;
    if (d.journal) journal = d.journal;

    if (d.pub) { pubRows = d.pub.map(r => ({ date: parseDate(r[0]), montant: Number(String(r[2]).replace(/\D/g, "")) || 0 })).filter(r => r.date); pubLoaded = true; }
    loaded = true;
}

/* ---------- Calculs ---------- */
const livreurs = () => drivers.slice();
let dirSourceFilter = "all";

function channelStats() {
  const sources = ["WhatsApp direct", "Tunnel", "Appel", "Bouche-à-oreille", "Autre"];
  const realOrders = orders.filter(o => !isProspect(o) && !isPromise(o));
  const totalDelivered = realOrders.filter(o => is(o, /^livr/i));
  const totalDeliveredCA = totalDelivered.reduce((s, o) => s + (o.prix || 0), 0);
  const totalOrdersCA = realOrders.reduce((s, o) => s + (o.prix || 0), 0);

  return sources.map(src => {
    const list = realOrders.filter(o => (o.source || "Tunnel") === src);
    const delivered = list.filter(o => is(o, /^livr/i));
    const ca = delivered.reduce((s, o) => s + (o.prix || 0), 0);
    const potential = list.reduce((s, o) => s + (o.prix || 0), 0);
    const delivRate = list.length ? Math.round((delivered.length / list.length) * 100) : 0;
    const share = totalDeliveredCA > 0 ? Math.round((ca / totalDeliveredCA) * 100) : (totalOrdersCA > 0 ? Math.round((potential / totalOrdersCA) * 100) : 0);
    const avgBasket = delivered.length ? Math.round(ca / delivered.length) : (list.length ? Math.round(potential / list.length) : 0);

    return {
      source: src,
      count: list.length,
      deliveredCount: delivered.length,
      ca,
      potential,
      delivRate,
      share,
      avgBasket
    };
  }).filter(c => c.count > 0 || c.source === "Tunnel" || c.source === "WhatsApp direct");
}

function promiseStats() {
  const isOrWasPromesse = o => isPromise(o) || o.etape === "Promesse d'achat" || /\[Convertie en commande/i.test(o.note || "") || /\[Annulée:.*\]/i.test(o.note || "") || o.statut === "Promesse";
  const all = orders.filter(isOrWasPromesse);
  const active = all.filter(o => isPromise(o) && !is(o, /^annul/i));
  const due = active.filter(o => isPromiseDue(o));
  const converted = all.filter(o => !isPromise(o) && !is(o, /^annul/i) && (o.statut === "Confirmée" || o.statut === "En livraison" || is(o, /^livr/i) || /\[Convertie/i.test(o.note || "")));
  const cancelled = all.filter(o => is(o, /^annul/i));
  const convRate = all.length ? Math.round((converted.length / all.length) * 100) : 0;
  const convertedCA = converted.reduce((s, o) => s + (o.prix || 0), 0);
  const convertedDeliveredCA = converted.filter(o => is(o, /^livr/i)).reduce((s, o) => s + (o.prix || 0), 0);

  return {
    total: all.length,
    active: active.length,
    due: due.length,
    converted: converted.length,
    cancelled: cancelled.length,
    convRate,
    convertedCA,
    convertedDeliveredCA
  };
}

function stats(srcFilter = dirSourceFilter) {
  const now = new Date(), t0 = today();
  const baseOrders = (srcFilter && srcFilter !== "all")
    ? orders.filter(o => (o.source || "Tunnel") === srcFilter)
    : orders;
  const real = baseOrders.filter(o => !isProspect(o) && !isPromise(o));
  const tOrders = real.filter(o => sameDay(o.date, t0));
  const deliveredToday = baseOrders.filter(o => is(o, /^livr/i) && sameDay(o.livreeLe, t0));
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(t0.getTime() - i * DAY);
    days.push({ d, n: real.filter(o => sameDay(o.date, d)).length, today: i === 0 });
  }
  const paidToday = baseOrders.filter(o => o.payeLe && sameDay(o.payeLe, t0) && !is(o, /^annul/i));
  const cash = mode => {
    const all = baseOrders.filter(o => o.payeLe && o.paiement === mode && !is(o, /^annul/i));
    return { today: all.filter(o => sameDay(o.payeLe, t0)).reduce((s, o) => s + o.prix, 0), week: all.filter(o => daysBetween(o.payeLe, now) < 7).reduce((s, o) => s + o.prix, 0) };
  };
  const delivered = real.filter(o => is(o, /^livr/i));
  return {
    real, tOrders, todayValue: tOrders.reduce((s, o) => s + o.prix, 0),
    collected: paidToday.reduce((s, o) => s + o.prix, 0), paidCount: paidToday.length, deliveredToday: deliveredToday.length,
    prospectsToday: baseOrders.filter(o => isProspect(o) && sameDay(o.date, t0)).length,
    promessesToday: baseOrders.filter(o => isPromise(o) && sameDay(o.date, t0)).length,
    promessesDueCount: baseOrders.filter(o => isPromiseDue(o, now)).length,
    toCall: baseOrders.filter(o => is(o, /^nouv/i)).length,
    onRoad: baseOrders.filter(o => is(o, /^en livr/i)).length,
    rate: real.length ? Math.round(delivered.length / real.length * 100) : 0,
    days, cash: Object.fromEntries(PAIEMENTS.map(m => [m, cash(m)])),
    due: baseOrders.map(o => ({ o, step: dueStep(o, now) })).filter(x => x.step)
  };
}
// Caisse : avances, argent chez les livreurs, remises à valider
function caisse() {
  const pendingLines = new Set(remises.filter(r => /attente/i.test(r.statut)).flatMap(r => String(r.lignes).split(/[,\s]+/).filter(Boolean).map(Number)));
  const avances = orders.filter(o => o.payeLe && !is(o, /^(livr|annul)/i));
  const enMain = {};
  orders.filter(o => o.payeLe && /esp/i.test(o.paiement) && o.payePar && drivers.includes(o.payePar) && !o.remisLe && !is(o, /^annul/i))
    .forEach(o => { const k = o.payePar; enMain[k] = enMain[k] || { total: 0, n: 0, declare: 0 }; enMain[k].total += o.prix; enMain[k].n++; if (pendingLines.has(o.row)) enMain[k].declare += o.prix; });
  return { avances, avTotal: avances.reduce((s, o) => s + o.prix, 0), enMain, aValider: remises.filter(r => /attente/i.test(r.statut)) };

function funnel(day = today()) {

  const reach = s => list.filter(v => STEPS_ORDER.indexOf(v.step) >= STEPS_ORDER.indexOf(s)).length;

}
let clientFilter = "all"; // "all" | "fidele" | "fid_due" | "wa" | "tunnel" | "promesse"
function clients() {
  const map = new Map();
  for (const o of orders) {
    const k = waNumber(o.tel) || ("x" + o.row);
    if (!map.has(k)) {
      map.set(k, {
        k,
        tel: o.tel,
        cleanTel: waNumber(o.tel) || ("x" + o.row),
        nom: o.nom || "",
        lieu: o.lieu || "",
        orders: [],
        spent: 0,
        livrees: 0,
        last: null,
        products: new Set(),
        sources: new Set(),
        promesses: []
      });
    }
    const c = map.get(k);
    c.orders.push(o);
    if (o.produit) c.products.add(o.produit);
    if (o.source) c.sources.add(o.source);
    if (isPromise(o)) c.promesses.push(o);
    if (!c.nom && o.nom) c.nom = o.nom;
    if (is(o, /^livr/i)) { c.spent += (o.prix || 0); c.livrees++; }
    if (o.date && (!c.last || o.date > c.last)) {
      c.last = o.date;
      if (o.lieu) c.lieu = o.lieu;
      if (o.nom) c.nom = o.nom;
    }
  }

  const now = new Date();
  for (const c of map.values()) {

const dayKey = () => today().toISOString().slice(0, 10);
let reviewStep = store("ws_review") === dayKey() ? -1 : 0;
function reviewSteps() {
  const t0 = today(), y0 = new Date(t0.getTime() - DAY), real = orders.filter(o => !isProspect(o));
  const delY = orders.filter(o => o.payeLe && sameDay(o.payeLe, y0) && !is(o, /^annul/i));
  const ordY = real.filter(o => sameDay(o.date, y0)), proY = orders.filter(o => isProspect(o) && sameDay(o.date, y0));
  const sum = l => l.reduce((s, o) => s + o.prix, 0);
  const byMode = PAIEMENTS.map(m => [m, sum(delY.filter(o => o.paiement === m))]).filter(x => x[1]);
  const prod = {}; ordY.forEach(o => { prod[o.produit] = (prod[o.produit] || 0) + 1; });
  const top = Object.entries(prod).sort((a, b) => b[1] - a[1])[0];
  const fu = funnel(y0), fmax = Math.max(1, fu.total), worst = fu.steps.slice(1).map((x, i) => ({ l: x.l, lost: fu.steps[i].n - x.n })).sort((a, b) => b.lost - a.lost)[0];
  const al = alerts();
  const toDay = orders.filter(o => isToDeliver(o) && (deliveryDate(o) || 0) <= t0);
  const tomorrow = orders.filter(o => isToDeliver(o) && sameDay(deliveryDate(o), new Date(t0.getTime() + DAY)));
  const b = salesBuckets();
  const fact = (l, v) => `<div class="fact"><span>${l}</span><b>${v}</b></div>`;
  return [
    { q: "Hier, on a encaissé", big: F(sum(delY)), body: `<div class="facts">${fact("Paiements reçus", delY.length)}${byMode.map(([m, v]) => fact(m, F(v))).join("")}${fact("Échecs de livraison hier", orders.filter(o => is(o, /^(échec|echec)/i) && /Échec/.test(o.note) && o.note.includes(y0.toLocaleDateString("fr-FR"))).length)}</div>`,
      say: delY.length ? "" : "Aucune livraison marquée « Livrée » hier. Si des colis sont partis, demande aux livreurs de les valider dans leur app." },
    { q: "Hier, on a reçu", big: ordY.length + " commande" + (ordY.length > 1 ? "s" : ""), body: `<div class="facts">${fact("Valeur des commandes", F(sum(ordY)))}${fact("Prospects (numéro laissé)", proY.length)}${top ? fact("Produit le plus demandé", esc(top[0])) : ""}${fact("Déjà livrées sur ces commandes", ordY.filter(o => is(o, /^livr/i)).length)}</div>` },
    { q: "Le tunnel hier", big: fu.total + " visiteur" + (fu.total > 1 ? "s" : ""), body: fu.total ? `<div class="funnel" style="border:0;padding:0">${fu.steps.map(x => `<div class="fstep"><span>${esc(x.l)}</span><div class="ftrack"><span style="width:${Math.round(x.n / fmax * 100)}%"></span></div><b>${x.n} <i>${Math.round(x.n / fmax * 100)}%</i></b></div>`).join("")}</div>` : empty("Pas de visite enregistrée hier."),
      say: worst && worst.lost > 0 ? `C'est avant « ${worst.l} » qu'on perd le plus de monde (${worst.lost} personne${worst.lost > 1 ? "s" : ""}).` : "" },
    { q: "Ce qui bloque ce matin", big: al.length ? al.reduce((n, a) => n + a.n, 0) + " point" + (al.length > 1 ? "s" : "") : "Rien 👍", body: al.length ? `<div class="facts">${al.map(a => fact(esc(a.t), a.n)).join("")}</div>` : "" },
    { q: "Au programme aujourd'hui", big: toDay.length + " livraison" + (toDay.length > 1 ? "s" : ""), body: `<div class="facts">${fact("À encaisser si tout est livré", F(sum(toDay)))}${fact("Dont sans livreur", toDay.filter(o => !o.livreur).length)}${fact("Commandes à confirmer", b.call.length)}${fact("Relances à envoyer", b.relance.length)}${fact("Livraisons prévues demain", tomorrow.length)}</div>` },
    { q: "L'équipe aujourd'hui", big: livreurs().length + " livreur" + (livreurs().length > 1 ? "s" : ""), body: livreurs().length ? `<div class="facts">${livreurs().map(n => fact(esc(n), toDay.filter(o => o.livreur === n).length + " à livrer")).join("")}</div>` : empty("Ajoute tes livreurs dans l'onglet Équipe pour leur attribuer des commandes."),
      say: toDay.filter(o => !o.livreur).length ? "Attribue les livraisons sans livreur avant 9 h pour qu'ils partent tôt." : "" }
  ];
}

const CR_HOURS = [10, 12, 14, 16, 18];
const TODAY_STR = () => new Date().toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
let jumpGroup = null;
function myTasks(who, dateStr) { return tasks.filter(t => t.qui === who && t.date === (dateStr || TODAY_STR())); }
function newClients(day = today()) {
  const seen = new Set();
  return orders.filter(o => !isProspect(o) && !is(o, /^annul/i) && sameDay(o.date, day) && o.tel).filter(o => { const k = waNumber(o.tel); if (seen.has(k)) return false; seen.add(k); return true; });
}
function teamDay(who, day = today()) {
  const ds = day.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
  const tk = myTasks(who, ds), nc = newClients(day);
  const done = k => tk.find(t => t.type === k);
  const crs = CR_HOURS.map(h => ({ h, t: tk.find(t => t.type === "cr" && Number(t.cle) === h) }));
  const contacts = nc.filter(o => tk.some(t => t.type === "contact" && t.cle === waNumber(o.tel)));
  const libres = tasks.filter(t => t.qui === who && t.type === "libre" && (t.date === ds || !t.faite));
  const now = new Date(), isToday = sameDay(day, now);
  const dueCr = crs.filter(c => !isToday || now.getHours() * 60 + now.getMinutes() >= c.h * 60);
  const items = [!!done("statuts"), ...nc.map(o => contacts.includes(o)), ...dueCr.map(c => !!c.t), ...libres.map(t => !!t.faite)];
  return { tk, nc, statuts: done("statuts"), crs, contacts, libres, dueCr, score: items.filter(Boolean).length, total: items.length };
}

// « Green Mask Stick x2 » × 1 = 2 unités du produit « Green Mask Stick »
function unitsFor(o, produit) {
  const name = (o.produit || "").toLowerCase();
  const best = stock.map(x => x.produit).filter(k => name.startsWith(k.toLowerCase())).sort((a, b) => b.length - a.length)[0];
  if (best !== produit) return 0;
  const m = /x\s*(\d+)\s*$/i.exec(o.produit || "");
  return (o.qte || 1) * (m ? +m[1] : 1);
}
function stockStats() {
  const now = new Date();
  return stock.map(x => {
    const reserve = orders.filter(isToDeliver).reduce((n, o) => n + unitsFor(o, x.produit), 0);
    const sold7 = orders.filter(o => is(o, /^livr/i) && o.livreeLe && daysBetween(o.livreeLe, now) < 7).reduce((n, o) => n + unitsFor(o, x.produit), 0);
    const dispo = x.stock - reserve, perDay = sold7 / 7;
    return Object.assign({}, x, { reserve, sold7, dispo, days: perDay > 0 ? Math.floor(Math.max(0, dispo) / perDay) : null });
  });
}

// Onglet « Pub » du Sheet : Date · Campagne · Dépense (F) · Saisi par · Le · Note
const CAMP = {
  nom: "Relance Kit Minceur", produit: /minceur/i, start: new Date(2026, 9, 29),
  plan: [[10000, 5, "5"], [10000, 5, "5"], [15000, 7.5, "7-8"], [20000, 10, "10"], [25000, 12.5, "12-13"], [30000, 15, "15"], [35000, 17.5, "17-18"]],
  seuil: 2000, achat: 2400, livraison: 1000, capacite: 15, objectifSemaine: 58

let pubRows = [], pubLoaded = false, pubEdit = false, pubDay = null;
const campDayIndex = d => daysBetween(CAMP.start, d);           // 0 = J1
const campLabel = i => "J" + (i + 1);
function pubFor(d) {
  const k = startOfDay(d).getTime(), r = pubRows.find(x => x.date && startOfDay(x.date).getTime() === k);
  return r ? r.montant : null;
}
function achatKit() { const s = stock.find(x => CAMP.produit.test(x.produit)); return (s && s.achat) || CAMP.achat; }
// Chiffres d'une journée de campagne
function campDay(d) {
  const t0 = startOfDay(d).getTime(), on = x => x && startOfDay(x).getTime() === t0, kit = o => CAMP.produit.test(o.produit);
  const vis = visits.filter(v => on(v.date) && CAMP.produit.test(v.produit)).length;

  const livr = orders.filter(o => kit(o) && is(o, /^livr/i) && on(o.livreeLe));

  const cash = orders.filter(o => kit(o) && on(o.payeLe)).reduce((n, o) => n + o.prix, 0);
  const ca = livr.reduce((n, o) => n + o.prix, 0);

// Conseil du budget de demain selon les règles du plan
function campAdvice(i, day, week) {
  const next = i + 1, planNext = CAMP.plan[Math.min(next, CAMP.plan.length - 1)][0];
  const spent = day.pub || CAMP.plan[Math.min(i, 6)][0];
  const aLivrer = orders.filter(o => CAMP.produit.test(o.produit) && isToDeliver(o)).length;
  const cpk = week.kits ? week.pub / week.kits : null;
  if (i >= 6) return { lvl: "info", n: spent, t: "Fin des 7 jours", d: "La semaine du plan est finie. Garde le même budget demain et fais le bilan : on continue la même logique sur le mois." };
  if (day.pub === null) return { lvl: "info", n: CAMP.plan[Math.min(i, 6)][0], t: "Rentre d'abord la dépense du jour", d: "Le conseil se calcule avec la dépense pub de ce soir. En attendant, le plan prévoit " + F(planNext) + " pour " + campLabel(next) + "." };
  if (aLivrer > CAMP.capacite) return { lvl: "bad", n: spent, t: "On bloque le budget", d: aLivrer + " commandes attendent encore la livraison (≈ " + CAMP.capacite + " livraisons par jour avec 2 livreurs). On garde " + F(spent) + " tant que les livreurs ne suivent pas." };
  if (week.pub >= 5000 && !week.kits && !week.kitsCmd) return { lvl: "bad", n: Math.min(spent, CAMP.plan[0][0]), t: "Couper et remplacer les pubs", d: F(week.pub) + " dépensés sans aucune commande. Coupe les pubs qui ont dépensé 5 000 F sans 2 commandes, remplace-les, et ne monte pas le budget." };
  if (cpk === null) {
    if (i === 0) return { lvl: "ok", n: CAMP.plan[1][0], t: "Garder " + F(CAMP.plan[1][0]), d: "Comme prévu au plan : l'argent de J1 n'est pas encore rentré, on reste à " + F(CAMP.plan[1][0]) + ". Ce soir, coupe une pub qui a dépensé 5 000 F sans au moins 2 commandes." };

  if (cpk > CAMP.seuil) return { lvl: "bad", n: spent, t: "Ne pas monter : rester à " + F(spent), d: "Le coût par kit livré de la semaine est de " + F(Math.round(cpk)) + ", au-dessus de " + F(CAMP.seuil) + ". Coupe la pub la plus chère, remplace-la, et on remonte quand on repasse sous " + F(CAMP.seuil) + "." };
  if (i === 0) return { lvl: "ok", n: CAMP.plan[1][0], t: "Garder " + F(CAMP.plan[1][0]), d: "Bon départ (" + F(Math.round(cpk)) + " par kit livré). Le plan garde " + F(CAMP.plan[1][0]) + " demain : l'argent de J1 n'est pas encore rentré." };
  const max = Math.round(spent * 1.5 / 1000) * 1000, n = Math.min(planNext, max);

}

async function savePub(i, montant) {
  const d = new Date(CAMP.start.getFullYear(), CAMP.start.getMonth(), CAMP.start.getDate() + i);
  const key = d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
  const prev = pubRows.slice();
  pubRows = pubRows.filter(x => !sameDay(x.date, d)).concat([{ date: d, montant }]); pubEdit = false; render();
  try { await api("pubSet", { date: key, montant, campagne: CAMP.nom }); toast("Dépense enregistrée : " + F(montant)); }
  catch (e) {
    pubRows = prev; render();
    banner(/inconnue/i.test(e.message) ? "Le pont Google Sheet n'est pas encore à jour : recolle <b>apps-script/Code.gs</b> dans Apps Script et déploie une nouvelle version." : "Pas enregistré : " + esc(e.message));
  }
}
function bindCamp() {
  view.querySelectorAll("[data-cday]").forEach(b => b.onclick = () => { pubDay = +b.dataset.cday; pubEdit = false; render(); });
  view.querySelectorAll("[data-pubedit]").forEach(b => b.onclick = () => { pubEdit = b.dataset.pubedit === "1"; render(); const i = document.getElementById("pubAmt"); if (i && pubEdit) i.focus(); });
  view.querySelectorAll("[data-pubquick]").forEach(b => b.onclick = () => { const i = document.getElementById("pubAmt"); if (i) i.value = b.dataset.pubquick; });
  view.querySelectorAll("[data-pubform]").forEach(f => f.onsubmit = e => {
    e.preventDefault();
    const m = Math.round(Number(String(f.m.value).replace(/\D/g, "")));
    if (!(m >= 0) || String(f.m.value).trim() === "") { f.m.focus(); return; }
    savePub(+f.dataset.pubform, m);
  });
}

async function stockMove(produit, type, qte, note) {
  const x = stock.find(s => s.produit === produit); if (!x) return;
  const prev = x.stock;
  x.stock = type === "entree" ? x.stock + qte : type === "perte" ? x.stock - qte : qte;
  stockPanel = null; render();
  try { await api("stockMove", { produit, type, qte, note }); toast("Stock de " + produit + " : " + x.stock); load(true); }
  catch (e) { x.stock = prev; render(); banner("Stock pas enregistré : " + esc(e.message)); }
}

function getTomorrowDateStr() {
  const d = new Date(Date.now() + 86400000);
  return d.toISOString().slice(0, 10);

function existingProducts() {
  const map = new Map();
  stock.forEach(s => {
    if (s.produit) map.set(s.produit, { nom: s.produit, prix: s.vente || 0, stock: s.stock });
  });
  orders.forEach(o => {
    if (o.produit && !map.has(o.produit)) {
      const pUnit = o.prix && o.qte ? Math.round(o.prix / o.qte) : (o.prix || 0);
      map.set(o.produit, { nom: o.produit, prix: pUnit, stock: 0 });
    }
  });
  return Array.from(map.values());
}

function cleanTel226(val) {
  let s = String(val || "").trim().replace(/[\s\.\-\(\)]/g, "");
  if (s.startsWith("+226")) s = s.slice(4);
  else if (s.startsWith("00226")) s = s.slice(5);
  else if (s.startsWith("226") && s.length > 8) s = s.slice(3);
  s = s.replace(/\D/g, "");
  return "+226" + s;
}

async function handleOrderModalSubmit(e) {
  e.preventDefault();
  const f = e.target;
  const nom = (f.nom.value || "").trim();
  let tel = cleanTel226(f.tel.value);
  let produit = f.produit.value;
  if (produit === "__autre__") {
    produit = (f.autre_produit ? f.autre_produit.value : "").trim();
  }
  const qte = Math.max(1, Math.round(+f.qte.value || 1));
  const prix = Math.max(0, Math.round(+f.prix.value || 0));
  const lieu = (f.lieu.value || "").trim();
  const source = orderModalState.source || "WhatsApp direct";
  const isProm = orderModalState.type === "promesse";
  const type = isProm ? "promesse" : "commande";
  const dateRelance = isProm ? ((f.dateRelance && f.dateRelance.value) ? f.dateRelance.value : getTomorrowDateStr()) : "";
  const promNote = isProm && f.promNote ? f.promNote.value.trim() : "";
  const extraNote = f.note ? f.note.value.trim() : "";
  const noteParts = [];
  if (promNote) noteParts.push(promNote);
  if (extraNote) noteParts.push(extraNote);
  const note = noteParts.join(" · ");

  const btn = document.getElementById("moSubmit");

  if (!nom) {
    alert("Le nom du client est obligatoire.");
    if (f.nom) f.nom.focus();
    return;
  }
  if (!tel || tel === "+226" || tel.replace(/\D/g, "").length < 8) {
    alert("Le numéro de téléphone est obligatoire (8 chiffres minimum).");
    if (f.tel) f.tel.focus();
    return;
  }
  if (!produit) {
    alert("Veuillez choisir un produit.");
    if (f.produit) f.produit.focus();
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = "Enregistrement…"; }

  const zone = (f.ville ? f.ville.value : "Ouagadougou").trim();

  try {
    await createManualOrder({
      nom,
      tel,
      produit,
      qte,
      prix,
      zone,
      lieu,
      source,
      type,
      dateRelance,
      note
    });
  } catch (err) {
    if (btn) {
      btn.disabled = false;
      btn.textContent = isProm ? "🤝 Enregistrer promesse" : "✓ Enregistrer commande";
    }
  }
}

async function createManualOrder(data) {
  const isProm = data.type === "promesse";
  const now = new Date();
  const nowStr = now.toLocaleDateString("fr-FR") + " " + now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  const creator = myName || (cred && cred.nom) || (role === "sales" ? "Yasmine" : "Direction");
  const tempRow = 100000 + Math.floor(Math.random() * 800000);

  let fullNote = data.note ? data.note.trim() : "";
  if (data.nom) fullNote = (`[Client: ${data.nom}] ` + fullNote).trim();

  let parsedDateRelance = null;
  if (isProm && data.dateRelance) {
    parsedDateRelance = parseDate(data.dateRelance) || new Date(data.dateRelance + "T12:00:00");
  }

  const optimisticOrder = {
    row: tempRow,
    date: now,
    produit: data.produit,
    qte: data.qte,
    prix: data.prix,
    zone: data.zone || "Ouagadougou",
    lieu: data.lieu || "",
    tel: data.tel,
    jour: isProm ? "À convenir" : "Aujourd'hui",
    statut: isProm ? "Promesse" : "Confirmée",
    note: fullNote,
    relances: [],
    toks: [],
    derniereRelance: null,
    session: "MANUEL-" + Date.now(),
    etape: isProm ? "Promesse d'achat" : "Commande manuelle",
    livreur: "",
    paiement: "",
    livreeLe: null,
    modifiePar: creator + " · " + nowStr,
    payeLe: null,
    payePar: "",
    remisLe: null,
    source: data.source,
    type: data.type,
    dateRelance: parsedDateRelance,
    dateRelanceRaw: data.dateRelance || "",
    creePar: creator,
    nom: data.nom
  };

  orders.unshift(optimisticOrder);
  if (role === "ceo") {
    journal.unshift([fmtTime(now), creator, "Nouvelle " + (isProm ? "promesse" : "commande") + " (" + data.source + ")", tempRow, data.tel, data.produit + " · " + (data.nom || data.lieu)]);
  }

  if (isProm) {
    if (tab === "orders") {
      ordersMode = "all";
      store("ws_omode", "all");
      filter = "promesses";
    }
  }

  closeOrderModal();
  render();
  toast(isProm ? "Promesse enregistrée ✓" : "Commande confirmée enregistrée ✓");

  try {
    const res = await api("addOrder", {
      nom: data.nom,
      tel: data.tel,
      produit: data.produit,
      qte: data.qte,
      prix: data.prix,
      zone: data.zone,
      lieu: data.lieu,
      source: data.source,
      type: data.type,
      dateRelance: data.dateRelance,
      jour: optimisticOrder.jour,
      note: data.note
    });
    if (res && res.row) {
      optimisticOrder.row = res.row;
    } else {
      throw new Error("Le script Google n'a pas confirmé la ligne (pense à déployer Code.gs dans Apps Script)");
    }
  } catch (err) {
    console.error("Erreur addOrder:", err);
    banner("⚠️ La " + (isProm ? "promesse" : "commande") + " a été ajoutée dans l'app, mais n'a pas pu être enregistrée dans Google Sheets : " + esc(err.message));
  }
}

function prefillOrderForClient(cleanTel) {
  const cs = clients();
  const c = cs.find(x => x.cleanTel === cleanTel || x.tel === cleanTel);
  if (!c) return;
  closeOrderModal();
  openOrderModal();
  setTimeout(() => {
    const nomIn = document.getElementById("moNom");
    const telIn = document.getElementById("moTel");
    const lieuIn = document.getElementById("moLieu");
    if (nomIn && c.nom) nomIn.value = c.nom;
    if (telIn) {
      let t = c.tel || "";
      if (t.startsWith("+226")) t = t.slice(4).trim();
      else if (t.startsWith("226") && t.length > 8) t = t.slice(3).trim();
      telIn.value = t;
    }
    if (lieuIn && c.lieu) lieuIn.value = c.lieu;
  }, 120);
}

/* ---------- Superviseur WhatsApp ----------

   Les relances liées aux commandes (J+1, veille, fidélisation…) restent gérées par « Ma journée ». */
/* SV-ENGINE-START */
const SV_MIN = 60000, SV_H = 3600000, SV_D = 86400000;
const SV_PROMISE = [/\bdemain\b/i, /apr[eè]s[- ]demain/i, /plus tard/i, /je (vais|vai) (voir|r[ée]fl[ée]chir|vous (rappeler|[ée]crire|revenir))/i, /je (vous |te )?reviens/i, /je (vous |te )?rappelle/i, /fin du mois/i, /quand j'?aurai/i, /la semaine prochaine/i, /ce (soir|week[- ]?end)/i, /\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/i];
const SV_INTEREST = [/\bprix\b/i, /combien/i, /[cç]a co[uû]te/i, /\btarif/i, /livraison/i, /disponible/i, /je (veux|voudrais|prends|commande)/i, /command/i, /comment (on|je) (fait|fais|utilise)/i, /\bint[ée]ress/i, /\bc'?est quoi\b/i];
const SV_ACK = /^(ok+|okay|d'?accord|dac+|merci( beaucoup| bien)?|bien re[cç]u|👍|🙏|👌|ok merci|super|cool|ça marche|ca marche)[\s!.🙏👍]*$/i;
const SV_ACTIVE = /^(nouv|confirm|en livr|reprog|injoig|échec|echec|promesse)/i;
const svKey = t => String(t || "").replace(/\D/g, "").slice(-8);
function svFirst(n) { n = String(n || "").trim(); return !n || /^[+\d]/.test(n) || /^client/i.test(n) ? "" : n.split(/\s+/)[0]; }
function svHello(n) { const f = svFirst(n); return f ? "Bonjour " + f : "Bonjour"; }
function svSince(ms) { const m = ms / SV_MIN; if (m < 60) return Math.max(1, Math.round(m)) + " min"; const h = m / 60; if (h < 24) return Math.round(h) + " h"; const d = Math.round(h / 24); return d + " jour" + (d > 1 ? "s" : ""); }
function svPromiseDue(text, at) {
  const t = String(text || "").toLowerCase(), b = at.getTime();
  if (/apr[eè]s[- ]demain/.test(t)) return new Date(b + 2 * SV_D);
  if (/\bdemain\b/.test(t)) return new Date(b + SV_D);
  if (/ce soir/.test(t)) return new Date(b + 6 * SV_H);
  if (/semaine prochaine/.test(t)) return new Date(b + 7 * SV_D);
  if (/fin du mois/.test(t)) return new Date(b + 5 * SV_D);
  return new Date(b + SV_D);
}
// c = { tel, nom, msgs:[{at:Date, out:bool, text}], etat, until:Date|null } ; ords = lignes du Sheet pour ce numéro
function svEvaluate(c, ords, now) {
  now = now || new Date();
  if (c.etat === "perso") return null;
  if (c.until && c.until > now) return null;
  const msgs = c.msgs; if (!msgs.length) return null;
  const last = msgs[msgs.length - 1];
  const lastIn = [...msgs].reverse().find(m => !m.out);
  const hasOut = msgs.some(m => m.out);
  const live = (ords || []).filter(o => !/^annul/i.test(o.statut || ""));
  const active = live.some(o => SV_ACTIVE.test(o.statut || "") || o.type === "promesse");
  const nom = c.nom || "";
  const mk = (type, prio, titre, raison, ms, texte) => ({ tel: c.tel, nom, type, prio, titre, raison, ms, texte, lastIn: lastIn ? lastIn.text : "", inSheet: live.length > 0 });

  // 1. Le client attend une réponse
  if (!last.out) {
    const w = now - last.at;
    if (!SV_ACK.test(String(last.text || "").trim()) && w >= 15 * SV_MIN && w <= 7 * SV_D) {
      if (!hasOut) return mk("jamais", "urgent", "Jamais répondu", `A écrit il y a ${svSince(w)}, n'a reçu aucune réponse.`, w, `${svHello(nom)} 😊 merci pour votre message ! Je suis là pour vous aider. Qu'est-ce qui vous intéresse ?`);
      return mk("attente", w >= 2 * SV_H ? "urgent" : "haute", "Attend une réponse", `Attend une réponse depuis ${svSince(w)}.`, w, `${svHello(nom)}, désolée pour l'attente 🙏 Je reviens vers vous tout de suite.`);
    }
  }
  if (active) return null; // une commande ou une promesse existe : « Ma journée » s'en occupe

  // 2. Promesse dite sur WhatsApp, pas notée dans l'app
  const lastOrderAt = live.reduce((t, o) => Math.max(t, o.date ? o.date.getTime() : 0), 0);
  const prom = [...msgs].reverse().find(m => !m.out && SV_PROMISE.some(p => p.test(m.text || "")));

    const due = svPromiseDue(prom.text, prom.at), age = now - prom.at;
    const relancee = msgs.some(m => m.out && m.at >= due);
    if (now >= due && !relancee && age <= 10 * SV_D) return mk("promesse", "haute", "Promesse à relancer", `Avait dit : « ${String(prom.text).slice(0, 70)} » il y a ${svSince(age)}.`, age, `${svHello(nom)} 😊 comme convenu je reviens vers vous. On programme votre livraison pour aujourd'hui ?`);
  }

  // 3. Intéressé, pas de commande, ne répond plus
  if (last.out) {
    const s = now - last.at;
    const interest = msgs.find(m => !m.out && SV_INTEREST.some(p => p.test(m.text || "")));
    const orderedAfter = interest && live.some(o => o.date && o.date >= interest.at);
    if (interest && !orderedAfter && s >= 6 * SV_H && s <= 7 * SV_D) return mk("interesse", "haute", "Intéressé, pas commandé", `A demandé le prix ou la livraison, puis ne répond plus depuis ${svSince(s)}.`, s, `${svHello(nom)} 😊 je reviens vers vous pour le produit. Il en reste encore quelques-uns, je vous en réserve un ? La livraison est à 1 000 F partout à Ouaga.`);
    const recentDelivery = live.some(o => /^livr/i.test(o.statut || "") && o.livreeLe && now - o.livreeLe < 3 * SV_D);
    if (lastIn && !recentDelivery && s >= SV_D && s <= 7 * SV_D) return mk("silence", "normale", "Ne répond plus", `Dernier message envoyé il y a ${svSince(s)}, sans réponse.`, s, `${svHello(nom)}, j'espère que vous allez bien 😊 Avez-vous eu le temps de réfléchir ? Je reste disponible pour vos questions.`);
  }
  return null;
}
// data = réponse de waData ; allOrders = commandes de l'app
function svBuild(data, allOrders, now) {
  now = now || new Date();
  const byTel = {};
  (data.msgs || []).forEach(r => {
    const tel = String(r[1] || ""), at = new Date(r[0]); if (!tel || isNaN(at)) return;
    const c = byTel[tel] || (byTel[tel] = { tel, nom: "", msgs: [], etat: "", until: null });
    if (r[2] && r[3] === "IN") c.nom = r[2];
    c.msgs.push({ at, out: r[3] === "OUT", text: r[4] || "" });
  });
  const suivi = {}; (data.suivi || []).forEach(s => { suivi[svKey(s[0])] = { etat: s[1], until: s[2] ? new Date(s[2]) : null }; });
  const ordsBy = {}; (allOrders || []).forEach(o => { const k = svKey(o.tel); if (k.length === 8) (ordsBy[k] = ordsBy[k] || []).push(o); });
  const rank = { urgent: 0, haute: 1, normale: 2 };
  return Object.values(byTel).map(c => {
    c.msgs.sort((a, b) => a.at - b.at);
    const k = svKey(c.tel), s = suivi[k]; if (s) { c.etat = s.etat; c.until = s.until && !isNaN(s.until) ? s.until : null; }
    const ords = ordsBy[k] || [];
    if (!c.nom) { const o = ords.find(x => x.nom); if (o) c.nom = o.nom; }
    const a = svEvaluate(c, ords, now);
    if (a) { a.msgs = c.msgs; a.orders = ords; }
    return a;
  }).filter(Boolean).sort((a, b) => rank[a.prio] - rank[b.prio] || b.ms - a.ms);
}
/* SV-ENGINE-END */

  view.querySelectorAll('[data-act="status"]').forEach(s => s.onchange = () => { const o = findO(s); if (o) setStatut(o, s.value); });
  view.querySelectorAll('[data-act="driver"]').forEach(s => s.onchange = () => { const o = findO(s); if (o) setLivreur(o, s.value); });
  view.querySelectorAll("[data-done]").forEach(a => a.addEventListener("click", () => { const o = findO(a); if (!o) return; const t = taskFor(o); setTimeout(() => doneTask(o, t), 500); }));
  view.querySelectorAll('[data-act="skip"]').forEach(b => b.onclick = () => { const o = findO(b); if (o) doneTask(o, taskFor(o)); });
  view.querySelectorAll('[data-act="paid"]').forEach(b => b.onclick = () => { panel = { row: +b.closest("[data-row]").dataset.row, kind: "paid" }; render(); });
  view.querySelectorAll("[data-paid]").forEach(b => b.onclick = () => { const o = findO(b); if (o) markPaid(o, b.dataset.paid); });
  view.querySelectorAll('[data-act="deliverpaid"]').forEach(b => b.onclick = () => { const o = findO(b); if (o) deliverPaid(o); });
  view.querySelectorAll("[data-remise]").forEach(b => b.onclick = () => validateRemise(+b.dataset.remise, false));
  view.querySelectorAll("[data-remise-refus]").forEach(b => b.onclick = () => validateRemise(+b.dataset.remiseRefus, true));
  const rb = document.getElementById("remiseBtn"); if (rb) rb.onclick = () => { rb.disabled = true; rb.textContent = "Envoi…"; declareRemise(); };
  view.querySelectorAll('[data-act="confirm"]').forEach(b => b.onclick = () => { const o = findO(b); if (o) setStatut(o, "Confirmée"); });
  view.querySelectorAll('[data-act="ai"]').forEach(b => b.onclick = () => { const o = findO(b); if (o) aiMessage(o, b); });
  view.querySelectorAll('[data-act="go"]').forEach(b => b.onclick = () => { const o = findO(b); if (o) startRun(o); });
  ["pay", "fail", "later"].forEach(k => view.querySelectorAll(`[data-act="${k}"]`).forEach(b => b.onclick = () => { panel = { row: +b.closest("[data-row]").dataset.row, kind: k }; render(); }));
  view.querySelectorAll('[data-act="close"]').forEach(b => b.onclick = () => { panel = null; render(); });
  view.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => { const o = findO(b); if (o) delivered(o, b.dataset.pay); });
  view.querySelectorAll("[data-fail]").forEach(b => b.onclick = () => { const o = findO(b); if (o) failed(o, b.dataset.fail); });
  view.querySelectorAll("[data-later]").forEach(b => b.onclick = () => { const o = findO(b); if (o) reschedule(o, new Date(+b.dataset.later)); });
  view.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const label = b.textContent;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copié ✓"; } catch (e) { b.textContent = b.dataset.copy; }
    setTimeout(() => { b.textContent = label; }, 1500);
  });
  view.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
  view.querySelectorAll("[data-rev]").forEach(b => b.onclick = () => { const v = b.dataset.rev; if (v === "end") { reviewStep = -1; store("ws_review", dayKey()); } else reviewStep = +v; window.scrollTo(0, 0); render(); });
  view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { setRole("ceo", b.dataset.go); });
  view.querySelectorAll("[data-step-go]").forEach(b => b.onclick = () => { salesStep = Math.min(+b.dataset.stepGo, SALES_STEPS.length); if (salesStep >= SALES_STEPS.length) store("ws_dayDone", dayKey()); window.scrollTo(0, 0); render(); });
  view.querySelectorAll("[data-task]").forEach(b => b.onclick = () => taskDone(b.dataset.task, "matin", "", "Statuts notés ✓"));
  view.querySelectorAll("[data-contact]").forEach(b => b.onclick = () => taskDone("contact", b.dataset.contact, "", "Contact noté ✓"));
  view.querySelectorAll("[data-libre]").forEach(b => b.onclick = () => taskDone("libre", b.dataset.libre, "", "Tâche faite ✓"));
  view.querySelectorAll("[data-cr]").forEach(b => b.onclick = () => { const h = b.dataset.cr; window.open("https://wa.me/?text=" + encodeURIComponent(crText(h)), "_blank"); setTimeout(() => taskDone("cr", h, "", "Compte-rendu de " + h + " h noté ✓"), 600); });
  view.querySelectorAll("[data-todo]").forEach(b => b.onclick = () => {
    const k = b.dataset.todo;
    const bk = salesBuckets();
    if (k === "promesse" && (!bk.promesse || !bk.promesse.length)) {
      ordersMode = "all";
      filter = "promesses";
      store("ws_omode", "all");
    } else {
      ordersMode = "todo";
      jumpGroup = k;
    }
    tab = "orders";
    store("ws_tab", tab + "|" + dayKey());
    render();
    const el = document.getElementById("grp-" + jumpGroup);
    if (el) el.scrollIntoView({ behavior: "smooth" });
    else window.scrollTo(0, 0);
  });
  view.querySelectorAll("[data-addtask]").forEach(fm => fm.onsubmit = e => { e.preventDefault(); const i = fm.querySelector("input"), v = i.value.trim(); if (!v) return; i.value = ""; taskAdd(fm.dataset.addtask, v); });
  view.querySelectorAll("[data-feed]").forEach(b => b.onclick = () => { showFeed = !showFeed; render(); });
  view.querySelectorAll("[data-scroll]").forEach(b => b.onclick = () => { const el = document.getElementById(b.dataset.scroll); if (el) el.scrollIntoView({ behavior: "smooth" }); });
  view.querySelectorAll("[data-tabgo]").forEach(b => b.onclick = () => {
    tab = b.dataset.tabgo;
    if (b.dataset.filter) {
      filter = b.dataset.filter;
      ordersMode = "all";
      store("ws_omode", "all");
    }
    store("ws_tab", tab + "|" + dayKey());
    window.scrollTo(0, 0);
    render();
  });
  view.querySelectorAll("[data-omode]").forEach(b => b.onclick = () => { ordersMode = b.dataset.omode; store("ws_omode", ordersMode); window.scrollTo(0, 0); render(); });
  view.querySelectorAll("[data-alert]").forEach(b => b.onclick = () => {
    const a = alerts()[+b.dataset.alert]; if (!a) return;
    if (a.tab) { tab = a.tab; window.scrollTo(0, 0); render(); return; }
    if (a.anchor) { const el = document.getElementById(a.anchor); if (el) el.scrollIntoView({ behavior: "smooth" }); return; }
    if (a.go) { salesStep = a.go[2]; setRole(a.go[0], a.go[1]); } else { filter = a.f; tab = "orders"; window.scrollTo(0, 0); render(); }
  });
  const q = document.getElementById("q");
  if (q) q.oninput = () => { query = q.value; const pos = q.selectionStart; render(); const q2 = document.getElementById("q"); q2.focus(); q2.setSelectionRange(pos, pos); };
  view.querySelectorAll("[data-stock]").forEach(b => b.onclick = () => { stockPanel = { produit: b.closest("[data-prod]").dataset.prod, type: b.dataset.stock }; render(); const i = view.querySelector('[data-stockform] input'); if (i) i.focus(); });
  view.querySelectorAll("[data-stockclose]").forEach(b => b.onclick = () => { stockPanel = null; render(); });
  view.querySelectorAll("[data-stockform]").forEach(f => f.onsubmit = e => { e.preventDefault(); const q = Math.round(+f.q.value); if (!(q >= 0)) return; stockMove(f.closest("[data-prod]").dataset.prod, f.dataset.stockform, q, f.n.value.trim()); });
  const pf = document.getElementById("prodForm");
  if (pf) pf.onsubmit = async e => { e.preventDefault(); const nom = document.getElementById("pNom").value.trim(); if (!nom) return;
    try { await api("stockProduct", { produit: nom, seuil: +document.getElementById("pSeuil").value || 0, achat: +document.getElementById("pAchat").value || 0, vente: +document.getElementById("pVente").value || 0 }); toast(nom + " enregistré"); pf.reset(); load(true); }
    catch (err) { banner("Pas enregistré : " + esc(err.message)); } };
  view.querySelectorAll("[data-member]").forEach(b => b.onclick = () => { const m = team.find(x => x.nom === b.dataset.member); if (m) { m.actif = b.dataset.actif === "1"; render(); setMember(m, { actif: m.actif }, m.nom + (m.actif ? " réactivé" : " désactivé")); } });
  const lo = document.getElementById("out"); if (lo) lo.onclick = () => logout("");
  const ms = document.getElementById("meSel"); if (ms) ms.onchange = () => { me = ms.value; store("ws_me", me); render(); };
  const f = document.getElementById("addForm");
  if (f) f.onsubmit = e => { e.preventDefault(); addMember(document.getElementById("mNom").value.trim(), document.getElementById("mRole").value, document.getElementById("mTel").value.replace(/[^0-9+ ]/g, "").trim(), document.getElementById("mPin").value.replace(/\D/g, "")); f.reset(); };
  const bb = document.getElementById("bilanBtn"); if (bb) bb.onclick = makeBilan;
  const send = document.getElementById("send"); if (send) send.onclick = () => askAI(document.getElementById("askBox").value);
  const ta = document.getElementById("askBox"); if (ta) ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askAI(ta.value); } };
  view.querySelectorAll("[data-sugg]").forEach(b => b.onclick = () => askAI(b.dataset.sugg));
}
function setRole(r, t) {
  role = r; tab = t || ROLES[r][0][0]; query = ""; panel = null; filter = "all";
  window.scrollTo(0, 0); render();
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setRole(b.dataset.role));

/* ---------- IA ---------- */
function dataForAI() {
  const rows = orders.slice(-300).map(o => [o.date ? o.date.toLocaleString("fr-FR") : "", o.produit, o.qte, o.prix, o.zone, o.lieu, o.tel, o.jour, o.statut, o.relances.map(s => "J+" + s).join(" "), o.note, o.etape, o.livreur, o.paiement, o.livreeLe ? o.livreeLe.toLocaleString("fr-FR") : ""].join(" | "));
  const fu = funnel();
  return "Date | Produit | Qté | Prix F | Zone | Quartier/Ville | Téléphone | Jour livraison | Statut | Relances faites | Note | Étape atteinte | Livreur | Paiement | Livrée le\n" + rows.join("\n")
    + `\n\nTunnel aujourd'hui : ${fu.steps.map(s => s.l + " " + s.n).join(", ")}.`
    + `\nÉquipe : ${team.map(t => t.nom + " (" + t.role + ")").join(", ") || "pas encore renseignée"}.`
    + `\nStock : ${stockStats().map(x => x.produit + " : " + x.stock + " en stock, " + x.reserve + " réservés, " + x.sold7 + " vendus en 7 jours").join(" ; ") || "non renseigné"}.`;
}
const RULES = () => `Tu es l'assistant de gestion de WillShop, une boutique en ligne à Ouagadougou, Burkina Faso (Kit Minceur, Green Mask Stick…). Tu parles à ${role === "sales" ? "un commercial de WillShop" : role === "driver" ? "un livreur de WillShop" : "Wilfried, le patron"}.
Réponds en français simple et direct, phrases courtes, chiffres précis en francs CFA (F). Pas de jargon. Si une info n'est pas dans les données, dis-le.
Date et heure actuelles : ${new Date().toLocaleString("fr-FR")}.
Statuts : Prospect = a laissé son numéro dans le tunnel sans finir (l'étape atteinte dit où il s'est arrêté) ; Nouvelle = commande à confirmer par appel ; Confirmée ; En livraison ; Reprogrammée ; Injoignable ; Échec = livraison ratée (motif dans la note) ; Livrée = vendu et encaissé (mode de paiement et date dans les colonnes) ; Annulée.
Relances prévues à J+1, J+3, J+7, J+14 pour les prospects, nouvelles, injoignables et échecs.
Données :
${dataForAI()}`;
let bilanCtl = null;
async function makeBilan() {
  if (!sample) return;
  const box = document.getElementById("bilanBox"), btn = document.getElementById("bilanBtn");
  btn.disabled = true; box.innerHTML = `<div class="note">Je prépare ton bilan…</div>`;
  bilanCtl = new AbortController();
  try {
    const { text } = await sample(RULES() + `\n\nFais le bilan du jour en 6 lignes maximum, avec des tirets : 1) encaissé et livrées du jour, 2) commandes et prospects reçus, 3) où le tunnel perd le plus de monde, 4) qui appeler en priorité (numéros), 5) problèmes de livraison, 6) une action concrète pour demain.`, {
      signal: bilanCtl.signal, cache: { gcTime: 600000 },
      onText: ({ text }) => { const b = document.getElementById("bilanBox"); if (b) b.innerHTML = `<div class="note">${esc(text)}</div>`; }
    });
    bilan = text;
  } catch (e) {
    bilan = e.text || "";
    if (e.code === "not_granted" || e.code === "sampling_disabled") sample = null;
    banner(e.code === "rate_limited" ? "Trop de demandes à l'assistant. Réessaie dans quelques minutes." : e.code === "not_granted" ? "L'assistant n'a pas été autorisé pour cette page." : e.code === "cancelled" ? "" : "Le bilan n'a pas pu être préparé. Réessaie.", "info");
  }
  render();
}
async function aiMessage(o, btn) {
  if (!sample) return;
  btn.disabled = true; btn.textContent = "J'écris…";
  const ctx = `Client : ${o.tel}. Produit : ${o.produit} à ${F(o.prix)}. Zone : ${o.zone}. Quartier/ville : ${o.lieu || "pas donné"}. Jour de livraison choisi : ${o.jour || "pas choisi"}. Statut : ${o.statut}. Étape atteinte dans le tunnel : ${o.etape || "?"}. Relances déjà faites : ${o.relances.map(s => "J+" + s).join(", ") || "aucune"}. Note : ${o.note || "aucune"}. Commande reçue le ${o.date ? o.date.toLocaleString("fr-FR") : "?"}.`;
  try {
    const { text } = await sample(`Tu écris un message WhatsApp pour WillShop (Ouagadougou) à envoyer à ce client. Tutoiement chaleureux, français simple d'Afrique de l'Ouest, 2 à 3 phrases maximum, 1 émoji au plus, finir par une question qui appelle une réponse simple. Adapte au statut (confirmer une commande, relancer un prospect, rattraper un échec de livraison…). Ne promets aucune réduction. Réponds uniquement avec le message.\n\n${ctx}`, { cache: false, modelTier: "quick" });
    aiMsg[o.row] = text.trim().replace(/^["«]\s*|\s*["»]$/g, "");
  } catch (e) {
    if (e.code === "not_granted" || e.code === "sampling_disabled") sample = null;
    toast(e.code === "rate_limited" ? "Trop de demandes, réessaie plus tard" : "Message IA indisponible");
  }
  render();
}
let aiCtl = null, busy = false;
async function askAI(q) {
  q = String(q || "").trim(); if (!q || busy || !sample) return;
  busy = true; chat.push({ role: "user", content: q }); chat = chat.slice(-12); render();
  const box = document.getElementById("chat");
  const bubble = document.createElement("div"); bubble.className = "msg ai"; bubble.textContent = "Je réfléchis…"; box.appendChild(bubble);
  bubble.scrollIntoView({ block: "end" });
  aiCtl = new AbortController();
  try {
    const { text } = await sample([{ role: "user", content: RULES() }, { role: "assistant", content: "D'accord, j'ai les données." }, ...chat], { cache: false, signal: aiCtl.signal, onText: ({ text }) => { bubble.textContent = text; } });
    chat.push({ role: "assistant", content: text });
  } catch (e) {
    chat.push({ role: "assistant", content: e.text || (e.code === "rate_limited" ? "Trop de questions d'un coup. Réessaie dans quelques minutes." : e.code === "not_granted" ? "L'assistant n'a pas été autorisé pour cette page." : "Je n'ai pas pu répondre. Réessaie.") });
    if (e.code === "not_granted" || e.code === "sampling_disabled") sample = null;
  }
  busy = false; render();
  const c = document.getElementById("chat"); if (c && c.lastElementChild) c.lastElementChild.scrollIntoView({ block: "end" });
}

/* ---------- Invitation ---------- */
const APP_URL = "https://willshop-app.vercel.app";
function invite(m) {
  return `Bonjour ${m.nom} 👋\nVoici l'application WillShop pour ton travail : ${APP_URL}\n\n1. Ouvre le lien dans Chrome.\n2. Touche le menu ⋮ puis « Installer l'application » (ou « Ajouter à l'écran d'accueil »).\n3. Ouvre WillShop, choisis ton nom « ${m.nom} » et tape le code PIN que je te donne.\n\nTon espace : ${/livr/i.test(m.role) ? "Livreur" : /direct/i.test(m.role) ? "Direction" : "Commercial"}.`;
}

/* ---------- IA (fonction Vercel /api/chat, clé Anthropic gardée côté serveur) ---------- */
function makeSample() {
  const f = async (input, opts = {}) => {
    const messages = typeof input === "string" ? [{ role: "user", content: input }] : input;
    const r = await fetch("api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cred, messages, quick: opts.modelTier === "quick" }), signal: opts.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || "Erreur"); e.code = r.status === 429 ? "rate_limited" : r.status === 503 ? "not_granted" : "error"; throw e; }
    if (opts.onText) opts.onText({ text: j.text, delta: j.text });
    return { text: j.text, truncated: false };
  };
  return f;
}
fetch("api/chat").then(r => r.json()).then(j => { if (j && j.ready) { sample = makeSample(); render(); } }).catch(() => {});

function applyTheme(t) {
  document.documentElement.dataset.theme = t; store("ws_theme", t);
  document.getElementById("tc").setAttribute("content", t === "dark" ? "#14100F" : "#FFFFFF");
  const b = document.getElementById("themeBtn"); b.innerHTML = t === "dark" ? SUN : MOON;
  b.title = t === "dark" ? "Passer en mode clair" : "Passer en mode sombre";
}
applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
document.getElementById("themeBtn").onclick = () => { applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); toast(document.documentElement.dataset.theme === "dark" ? "Mode sombre" : "Mode clair"); };

/* ---------- Démarrage ---------- */
(function () {
  const n = store("ws_name"), p = store("ws_pin");
  let prof = null; try { prof = JSON.parse(store("ws_profile") || "null"); } catch (e) {}
  if (n && p && prof && prof.role) {
    // Session gardée : on ouvre tout de suite avec les dernières données, puis on vérifie en arrière-plan
    cred = { nom: n, pin: p };
    try { const c = JSON.parse(store("ws_cache") || "null"); if (c) applyData(c); } catch (e) {}
    start(prof);
    api("login").catch(e => { if (!e.net && /PIN|essais/i.test(e.message)) logout("Ton code a changé. Reconnecte-toi."); });
  } else if (n && p) {
    cred = { nom: n, pin: p }; renderLogin(""); document.getElementById("lb").textContent = "Connexion…";
    api("login").then(r => { store("ws_profile", JSON.stringify({ nom: r.nom, role: r.role })); start(r); })
      .catch(e => { if (!e.net && /PIN|essais/i.test(e.message)) logout("Ton code a changé. Reconnecte-toi."); else { cred = null; renderLogin("Pas de connexion internet. Réessaie dans un instant."); } });
  } else renderLogin("");
})();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
