<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" id="tc">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ws_theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta name="description" content="WillShop : commandes, relances, livraisons et pilotage.">
<script>
// Lien « ?simple » : pas d'installation, juste un raccourci qui ouvre l'app dans Chrome (vieux téléphones Android)
if (!/[?&]simple/.test(location.search)) { var l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l); }
</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WillShop">
<title>WillShop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : app téléphone à une colonne. En-tête collant avec le choix d'espace (Direction / Commercial / Livreur), barre d'onglets en bas ; colonne centrée de 760px sur ordinateur. Palette WillShop : crème, bordeaux, or, noir. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F6F3EE; --ink:#1F1917; --mut:#6B625B; --faint:#A0958C; --line:#ECE6DC;
  --bx:#800020; --bx-fill:#800020; --bx-soft:#F5E6E9; --on-bx:#FFF8EC; --hero:#800020; --hero-mut:#E9C9CF;
  --gold:#9A7220; --gold-fill:#D4A843; --gold-soft:#FDF5E2;
  --ok:#2E7D4F; --ok-soft:#E5F1E9; --bad:#B3261E; --bad-soft:#FBE8E6; --info:#3F5C7A; --info-soft:#E8EEF4;
  --shadow:0 4px 16px rgba(31,25,23,.06);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14100F; --surface:#1D1715; --sunk:#251E1B; --ink:#F3ECE4; --mut:#ACA096; --faint:#7D726A; --line:#342A26;
  --bx:#E89AA8; --bx-fill:#9C2640; --bx-soft:#3A1B22; --on-bx:#FFF8EC; --hero:#4E1222; --hero-mut:#D9AEB7;
  --gold:#E2BC62; --gold-fill:#D4A843; --gold-soft:#2C2416;
  --ok:#74C595; --ok-soft:#172A1F; --bad:#F2908A; --bad-soft:#3A1C1A; --info:#9DB8D6; --info-soft:#1B2530;
  --shadow:0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14100F; --surface:#1D1715; --sunk:#251E1B; --ink:#F3ECE4; --mut:#ACA096; --faint:#7D726A; --line:#342A26;
  --bx:#E89AA8; --bx-fill:#9C2640; --bx-soft:#3A1B22; --on-bx:#FFF8EC; --hero:#4E1222; --hero-mut:#D9AEB7;
  --gold:#E2BC62; --gold-fill:#D4A843; --gold-soft:#2C2416;
  --ok:#74C595; --ok-soft:#172A1F; --bad:#F2908A; --bad-soft:#3A1C1A; --info:#9DB8D6; --info-soft:#1B2530;
  --shadow:0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.brand{font:800 22px/1 var(--serif);letter-spacing:-.01em;color:var(--bx)}
.brand small{font:700 10px/1 var(--sans);letter-spacing:.14em;color:var(--gold);margin-left:4px;vertical-align:3px}
.sync{margin-left:auto;font-size:12px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--mut);font:600 13px var(--sans);padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--bx);box-shadow:var(--shadow)}
:is(button,a,select,input,textarea):focus-visible{outline:2px solid var(--gold-fill);outline-offset:2px}
h1{font:700 26px/1.15 var(--serif);margin:18px 0 2px;text-wrap:balance}
h2{font:700 19px/1.25 var(--serif);margin:26px 0 10px;text-wrap:balance;display:flex;align-items:baseline;gap:8px}
h2 .count{font:600 13px var(--sans);color:var(--mut)}
.sub{color:var(--mut);font-size:13.5px;margin:0}
.eyebrow{font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.num{font-variant-numeric:tabular-nums}
/* Carte héro */
.hero{background:var(--hero);color:var(--on-bx);border-radius:20px;padding:18px 18px 16px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:var(--gold-fill)}
.hero .big{font:800 36px/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .row2{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--hero-mut);font-size:13.5px}
.hero .row2 b{color:var(--on-bx);font-variant-numeric:tabular-nums}
/* Tuiles */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi b{font:700 26px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--faint)}
/* Points d'attention */
.alerts{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:500 14px var(--sans);width:100%;text-align:left;cursor:pointer}
.alert:first-child{border-top:0}
.alert .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
.alert.hot .dot{background:var(--bad)} .alert.warm .dot{background:var(--gold-fill)}
.alert .n{margin-left:auto;font:700 16px var(--serif);font-variant-numeric:tabular-nums}
.alert .chev{color:var(--faint)}
.calm{padding:14px;color:var(--mut);font-size:14px}
/* Tunnel */
.funnel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px}
.fstep{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 4.5em;align-items:center;gap:10px;font-size:13px}
.ftrack{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.ftrack span{display:block;height:100%;background:var(--gold-fill);border-radius:6px}
.fstep:last-child .ftrack span{background:var(--bx-fill)}
.fstep b{text-align:right;font-variant-numeric:tabular-nums}
.fstep b i{font-style:normal;color:var(--faint);font-weight:500}
/* Trésorerie */
.cash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cash div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.cash span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.cash b{display:block;font:700 17px/1.3 var(--serif);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cash small{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
/* Barres 7 jours */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;padding:18px 14px 26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%;background-origin:content-box}
.bar{background:var(--gold-fill);border-radius:6px 6px 2px 2px;position:relative;min-height:3px;opacity:.75}
.bar.today{background:var(--bx-fill);opacity:1}
.bar i{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--mut)}
.bar em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
/* Listes et cartes commandes */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.c-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.c-top>div{min-width:0}
.who{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.place{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.amt{font:700 18px/1.2 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;margin-top:6px}
.s-pro{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-fill)}
.s-new{background:var(--bx-soft);color:var(--bx)}
.s-conf{background:var(--gold-soft);color:var(--gold)}
.s-road{background:var(--info-soft);color:var(--info)}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-bad{background:var(--bad-soft);color:var(--bad)}
.s-mut{background:var(--sunk);color:var(--mut)}
.msg-box{background:var(--sunk);border-radius:12px;padding:9px 11px;font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg-box .eyebrow{display:block;margin-bottom:4px;font-size:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--sans);cursor:pointer;text-decoration:none}
.btn svg{width:17px;height:17px;flex:none}
.btn.pri{background:var(--bx-fill);border-color:var(--bx-fill);color:var(--on-bx)}
.btn.gold{background:var(--gold-fill);border-color:var(--gold-fill);color:#1F1917}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.small{min-height:36px;padding:0 11px;font-size:13px}
.btn.ghost{background:none}
.btn.wide{flex:1 1 0;min-width:0}
.btn[disabled]{opacity:.5;cursor:default}
select.sel{min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--sans);padding:0 8px;max-width:100%}
.panel{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.panel .opts{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:4px 0 12px;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 13px;font:600 13px var(--sans);cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .c{color:var(--bg);opacity:.7}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mut)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;white-space:pre-wrap;line-height:1.6}
.banner{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.banner.err{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--gold-soft);color:var(--ink)}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:15px var(--sans);background:var(--surface);color:var(--ink);margin-bottom:6px}
.field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:15px var(--sans);background:var(--surface);color:var(--ink)}
/* Routine commerciale */
.steps{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
.stp{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--mut);border-radius:12px;padding:8px 12px;font:600 12.5px var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.stp b{font:700 17px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.stp[aria-current="step"]{border-color:var(--bx-fill);box-shadow:inset 0 0 0 1px var(--bx-fill);color:var(--bx)}
.stp.done b{color:var(--ok)}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:12px}
.progress span{display:block;height:100%;background:var(--gold-fill);transition:width .3s}
.step-head{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.next{margin-top:14px;display:flex;justify-content:flex-end}
/* Livreur */
.me{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 14px}
.me label{font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
.me select{flex:1;min-width:0}
.drive .place{font-size:17px}
.collect{display:flex;justify-content:space-between;align-items:center;background:var(--gold-soft);border-radius:12px;padding:8px 12px}
.collect span{font-size:12.5px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.collect b{font:800 20px var(--serif);font-variant-numeric:tabular-nums}
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.contact .btn{padding:0 6px;font-size:12.5px;gap:4px}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-actions .btn{min-height:48px}
/* Équipe */
.team-row{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--bx-soft);color:var(--bx);display:grid;place-items:center;font:700 15px var(--serif);flex:none}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:600px){.form{grid-template-columns:1.3fr 1fr 1fr 1fr auto}}
/* Assistant */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--bx-fill);color:var(--on-bx);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.composer{display:flex;gap:8px;margin-top:12px}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:15px var(--sans);background:var(--surface);color:var(--ink);min-height:46px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* Rappel et revue du matin */
.remind{margin-top:14px;background:var(--gold-soft);border:1px solid var(--gold-fill);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.remind b{font:700 16px var(--serif)}
.remind ul{margin:0;padding-left:18px;font-size:13.5px}
.review{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.dots i.on{background:var(--gold-fill)}
.review .q{font:700 15px var(--sans);color:var(--mut)}
.review .big{font:800 44px/1 var(--serif);color:var(--bx);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.review .facts{display:flex;flex-direction:column;gap:8px}
.fact{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.fact:first-child{border-top:0}
.fact b{font:700 16px var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.review .say{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.review .nav{display:flex;gap:8px;justify-content:space-between;align-items:center}
[hidden]{display:none!important}
/* Connexion */
html{padding-top:env(safe-area-inset-top,0px)}
.login{max-width:380px;margin:9vh auto 0;display:flex;flex-direction:column;gap:12px}
.login-logo{display:block;margin:0 auto;border-radius:50%;box-shadow:0 10px 30px rgba(128,0,32,.25)}
.pin{letter-spacing:.5em;text-align:center;font:700 24px var(--sans)}
.field{min-height:48px;font-size:16px}
/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;background:none;border:0;color:var(--faint);font:600 11px var(--sans);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--bx)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--gold-fill);border-radius:0 0 2px 2px}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bx-fill);color:var(--on-bx);font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:8;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.kpi,.hero{animation:up .22s ease both}@keyframes up{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr" hidden>
    <div class="top">
      <img src="icons/favicon-32.png" alt="" width="28" height="28" style="border-radius:50%">
      <div class="brand">WillShop</div>
      <div class="sync" id="sync" aria-live="polite">Connexion…</div>
      <button class="icon-btn" id="themeBtn" title="Mode clair ou sombre" aria-label="Changer le mode clair ou sombre"></button>
      <button class="icon-btn" id="refresh" title="Actualiser" aria-label="Actualiser">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
    <div class="seg" role="group" aria-label="Espace" id="seg" hidden>
      <button data-role="ceo" aria-pressed="true">Direction</button>
      <button data-role="sales" aria-pressed="false">Commercial</button>
      <button data-role="driver" aria-pressed="false">Livreur</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections" id="nav" hidden><div class="in" role="tablist" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Réglages ---------- */
const SHEET_ID = "1pTd-mhmjUVUYX1tDb37XChKd23ATgKYhuW9rpLq2Flo";
const SERVER = "Google Sheets";
const RANGE = "Commandes!A2:Q";

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const F = n => (Number(n) || 0).toLocaleString("fr-FR").replace(/[  ]/g, " ") + " F";
const DAY = 86400000;
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
function parseDate(s) {
  const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!m) { const d = new Date(s); return isNaN(d) ? null : d; }
  return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
}
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const today = () => startOfDay(new Date());
const sameDay = (a, b) => a && b && startOfDay(a).getTime() === startOfDay(b).getTime();
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / DAY);
const fmtDate = d => d ? d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) + " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
const nowStamp = () => new Date().toLocaleString("fr-FR").replace(",", "");
function waNumber(t) {
  let d = String(t || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.length === 8) d = "226" + d;
  return d;
}
const waLink = (tel, text) => "https://api.whatsapp.com/send?phone=" + waNumber(tel) + (text ? "&text=" + encodeURIComponent(text) : "");
const telLink = t => "tel:+" + waNumber(t);
const mapLink = o => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent((o.lieu || "") + ", " + (/ouaga/i.test(o.zone) ? "Ouagadougou" : "Burkina Faso"));
const is = (o, re) => re.test(o.statut || "");
const isProspect = o => is(o, /^prosp/i);
const isClosed = o => is(o, /^(livr|annul)/i);
const isToDeliver = o => is(o, /^(confirm|en livr|reprog)/i);
const isProblem = o => is(o, /^(injoig|échec|echec)/i);
const canRelance = o => isProspect(o) || is(o, /^(nouv|injoig|échec|echec)/i);
function statusClass(st) {
  if (/^prosp/i.test(st)) return "s-pro";
  if (/^nouv/i.test(st)) return "s-new";
  if (/^confirm/i.test(st)) return "s-conf";
  if (/^(en livr|reprog)/i.test(st)) return "s-road";
  if (/^livr/i.test(st)) return "s-ok";
  if (/^(annul|échec|echec)/i.test(st)) return "s-bad";
  return "s-mut";
}
const tokList = k => String(k || "").split(/[,;]+/).map(x => x.trim()).filter(Boolean);
const relOf = toks => toks.map(t => /^J\+(\d+)/i.exec(t)).filter(Boolean).map(m => +m[1]);
function rowFrom(v, i) {
  return {
    row: i + 2, date: parseDate(v[0]),
    produit: v[1] || "", qte: Number(v[2]) || 1, prix: Number(String(v[3]).replace(/\D/g, "")) || 0,
    zone: v[4] || "", lieu: v[5] || "", tel: String(v[6] || "").replace(/^'/, ""), jour: v[7] || "",
    statut: v[8] || "Nouvelle", note: v[9] || "",
    toks: tokList(v[10]), relances: relOf(tokList(v[10])),
    derniere: v[11] || "", sid: v[12] || "", etape: v[13] || "",
    livreur: v[14] || "", paiement: v[15] || "", livreeLe: parseDate(v[16])
  };
}
// Date de livraison prévue à partir du jour choisi dans le tunnel
function deliveryDate(o) {
  if (!o.date) return null;
  const base = startOfDay(o.date), j = String(o.jour || "").toLowerCase();
  const m = j.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
  if (m) return new Date(+(m[3] || base.getFullYear()), +m[2] - 1, +m[1]);
  if (!j || /aujourd/.test(j)) return base;
  if (/demain/.test(j)) return new Date(base.getTime() + DAY);
  const idx = JOURS.findIndex(d => j.startsWith(d));
  if (idx < 0) return base;
  return new Date(base.getTime() + ((idx - base.getDay() + 7) % 7) * DAY);
}
function dueStep(o, now = new Date()) {
  if (!canRelance(o) || !o.date) return null;
  const age = daysBetween(o.date, now), done = new Set(o.relances);
  let due = null;
  for (const s of STEPS) if (age >= s && !done.has(s)) due = s;
  return due;
}
const fill = (t, o) => t.replace("{produit}", o.produit || "ta commande").replace("{prix}", F(o.prix)).replace("{jour}", (o.jour || "aujourd'hui").toLowerCase()).replace("{lieu}", o.lieu || "ton quartier");

/* ---------- Serveur (Google Apps Script, branché au Google Sheet) ---------- */
async function api(action, p) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, cred, p: p || {} }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "Erreur");
  return j.data;
}
let loading = false;
async function load(quiet) {
  if (!cred || loading) return;
  loading = true;
  if (!quiet) document.getElementById("sync").textContent = "Actualisation…";
  try {
    const d = await api("data");
    orders = d.rows.map(x => rowFrom(x.v, x.row - 2)).filter(o => o.produit || o.tel);
    drivers = d.drivers || [];
    if (d.visits) { visits = d.visits.map(v => ({ date: parseDate(v[0]), produit: v[1] || "", step: v[3] || "Arrivée" })); visitsLoaded = true; }
    if (d.team) { team = d.team; teamLoaded = true; }
    loaded = true; lastSync = new Date();
    document.getElementById("sync").textContent = myName + " · " + lastSync.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    banner(""); render();
  } catch (e) {
    if (/PIN|essais/i.test(e.message)) { logout("Ton code a changé. Reconnecte-toi."); }
    else { banner("Pas de connexion pour le moment. Les dernières données restent affichées."); document.getElementById("sync").textContent = "Hors ligne"; }
  } finally { loading = false; }
}
document.getElementById("refresh").onclick = () => load();

// Applique un changement tout de suite à l'écran, puis l'enregistre ; annule si ça échoue
async function change(o, local, patch, okText) {
  const prev = { ...o }; Object.assign(o, local); panel = null; render();
  try { await api("update", { row: o.row, patch }); if (okText) toast(okText); }
  catch (e) { Object.assign(o, prev); render(); banner("Pas enregistré : " + esc(e.message)); }
}

function reschedule(o, d) {

function doneTask(o, t) {
  if (!t || !t.tok) return;
  const toks = o.toks.filter(x => x.toLowerCase() !== t.tok.toLowerCase()).concat([t.tok]);

}

/* ---------- Calculs ---------- */
const livreurs = () => drivers.slice();
function stats() {
  const now = new Date(), t0 = today();
  const real = orders.filter(o => !isProspect(o));
  const tOrders = real.filter(o => sameDay(o.date, t0));
  const deliveredToday = orders.filter(o => is(o, /^livr/i) && sameDay(o.livreeLe, t0));
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(t0.getTime() - i * DAY);
    days.push({ d, n: real.filter(o => sameDay(o.date, d)).length, today: i === 0 });
  }
  const cash = mode => {
    const all = orders.filter(o => is(o, /^livr/i) && o.paiement === mode);
    return { today: all.filter(o => sameDay(o.livreeLe, t0)).reduce((s, o) => s + o.prix, 0), week: all.filter(o => o.livreeLe && daysBetween(o.livreeLe, now) < 7).reduce((s, o) => s + o.prix, 0) };
  };
  const delivered = real.filter(o => is(o, /^livr/i));
  return {
    real, tOrders, todayValue: tOrders.reduce((s, o) => s + o.prix, 0),
    collected: deliveredToday.reduce((s, o) => s + o.prix, 0), deliveredToday: deliveredToday.length,
    prospectsToday: orders.filter(o => isProspect(o) && sameDay(o.date, t0)).length,
    toCall: orders.filter(o => is(o, /^nouv/i)).length,
    onRoad: orders.filter(o => is(o, /^en livr/i)).length,
    rate: real.length ? Math.round(delivered.length / real.length * 100) : 0,
    days, cash: Object.fromEntries(PAIEMENTS.map(m => [m, cash(m)])),
    due: orders.map(o => ({ o, step: dueStep(o, now) })).filter(x => x.step)
  };
}
function alerts() {
  const now = Date.now(), t1 = today().getTime() + DAY;
  const late = orders.filter(o => is(o, /^nouv/i) && o.date && now - o.date.getTime() > 2 * 3600000);
  const noDriver = orders.filter(o => isToDeliver(o) && !o.livreur && (deliveryDate(o) || 0) <= t1);
  const fails = orders.filter(o => is(o, /^(échec|echec)/i));
  const unreach = orders.filter(o => is(o, /^injoig/i));
  const due = stats().due;
  return [
    { n: late.length, t: "Nouvelles commandes pas appelées depuis plus de 2 h", lvl: "hot", f: "nouv" },
    { n: noDriver.length, t: "Livraisons d'aujourd'hui ou demain sans livreur", lvl: "hot", f: "nodriver" },
    { n: fails.length, t: "Échecs de livraison à reprogrammer", lvl: "warm", f: "pb" },
    { n: unreach.length, t: "Clients injoignables", lvl: "warm", f: "pb" },
    { n: due.length, t: "Relances à faire aujourd'hui", lvl: "", go: ["sales", "day", 2] }
  ].filter(a => a.n);
}
function funnel(day = today()) {
  const t0 = startOfDay(day).getTime();
  const list = visits.filter(v => v.date && startOfDay(v.date).getTime() === t0);
  const reach = s => list.filter(v => STEPS_ORDER.indexOf(v.step) >= STEPS_ORDER.indexOf(s)).length;
  return { total: list.length, steps: FUNNEL.map(([k, l]) => ({ l, n: k === "Arrivée" ? list.length : reach(k) })), questions: list.filter(v => v.step === "Question").length };
}
function clients() {
  const map = new Map();
  for (const o of orders) {
    const k = waNumber(o.tel) || ("x" + o.row);

const SALES_STEPS = [

function salesBuckets() {

/* ---------- Commercial ---------- */
function renderDay() {
  const b = salesBuckets();
  const total = SALES_STEPS.reduce((n, s) => n + b[s.k].length, 0);
  const cur = SALES_STEPS[salesStep];
  const done = salesStep >= SALES_STEPS.length;
  const left = done ? 0 : SALES_STEPS.slice(salesStep).reduce((n, s) => n + b[s.k].length, 0);
  const pct = total ? Math.round((1 - left / total) * 100) : 100;
  const fg = forgotten(), h = new Date().getHours(), nx = h + (h % 2 ? 1 : 2);
  return `<h1>Ma journée</h1><p class="sub">${total ? total + " client" + (total > 1 ? "s" : "") + " à traiter, étape par étape." : "Rien à traiter pour le moment."}</p>
    ${fg.length ? `<section class="remind" aria-label="Rappel"><span class="eyebrow">Rappel de ${h} h</span><b>Ces clients attendent encore</b><ul>${fg.map(x => `<li>${esc(x)}</li>`).join("")}</ul><span class="meta">Prochain point à ${nx % 24} h.</span></section>` : ""}
    <div class="steps" role="list">${SALES_STEPS.map((s, i) => `<button class="stp ${b[s.k].length ? "" : "done"}" role="listitem" data-step-go="${i}" ${i === salesStep ? 'aria-current="step"' : ""}>${s.t}<b>${b[s.k].length || "✓"}</b></button>`).join("")}</div>
    <div class="progress" aria-hidden="true"><span style="width:${pct}%"></span></div>
    ${done ? `<div class="step-head"><span class="eyebrow">Fin de routine</span><h2 style="margin:4px 0">Bravo, ta routine est faite 👏</h2><p class="sub">Les compteurs se mettent à jour à chaque nouvelle commande. Reviens dans quelques heures.</p></div>
      <div class="next"><button class="btn" data-step-go="0">Recommencer</button></div>`
    : `<div class="step-head"><span class="eyebrow">Étape ${salesStep + 1} sur ${SALES_STEPS.length}</span><h2 style="margin:4px 0">${cur.t} <span class="count">${b[cur.k].length}</span></h2><p class="sub">${cur.d}</p></div>
      <div class="list" style="margin-top:12px">${b[cur.k].length ? b[cur.k].map(x => orderCard(x.o, { task: x.t })).join("") : empty("Rien dans cette étape. 👍")}</div>
      <div class="next"><button class="btn pri" data-step-go="${salesStep + 1}">${salesStep + 1 < SALES_STEPS.length ? "Étape suivante · " + SALES_STEPS[salesStep + 1].t : "Terminer"} →</button></div>`}`;
}

function meSelect() {

}
function renderRuns() {

function renderHistory() {
  const list = driverOrders().filter(o => is(o, /^(livr|échec|echec)/i)).sort((a, b) => (b.livreeLe || b.date || 0) - (a.livreeLe || a.date || 0)).slice(0, 60);

}

/* ---------- Rendu principal ---------- */
function renderTabs() {
  const due = loaded ? salesBuckets() : null;
  const badge = { day: due ? Object.values(due).reduce((n, l) => n + l.length, 0) : 0, runs: loaded ? driverOrders().filter(o => isToDeliver(o) && (deliveryDate(o) || 0) < today().getTime() + DAY).length : 0 };
  document.getElementById("tabs").innerHTML = ROLES[role].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${l}${badge[k] ? `<span class="badge">${badge[k]}</span>` : ""}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; query = ""; panel = null; window.scrollTo(0, 0); render(); });

}
function render() {
  renderTabs();
  if (!cred) return renderLogin("");
  if (false) { view.innerHTML = `<h1>Connexion</h1>${empty("Cette app lit tes commandes dans Google Sheets. Ouvre-la dans Claude pour la connecter.")}`; return; }

  view.innerHTML = (R[tab] || R[ROLES[role][0][0]])() + `<p class="sub" style="text-align:center;margin-top:30px"><button class="btn small ghost" id="out">Se déconnecter</button></p>`;

const findO = el => orders.find(x => x.row === +el.closest("[data-row]").dataset.row);
function bind() {
  view.querySelectorAll('[data-act="status"]').forEach(s => s.onchange = () => { const o = findO(s); if (o) setStatut(o, s.value); });
  view.querySelectorAll('[data-act="driver"]').forEach(s => s.onchange = () => { const o = findO(s); if (o) setLivreur(o, s.value); });
  view.querySelectorAll("[data-done]").forEach(a => a.addEventListener("click", () => { const o = findO(a); if (!o) return; const t = taskFor(o); setTimeout(() => doneTask(o, t), 500); }));
  view.querySelectorAll('[data-act="skip"]').forEach(b => b.onclick = () => { const o = findO(b); if (o) doneTask(o, taskFor(o)); });
  view.querySelectorAll('[data-act="confirm"]').forEach(b => b.onclick = () => { const o = findO(b); if (o) setStatut(o, "Confirmée"); });
  view.querySelectorAll('[data-act="ai"]').forEach(b => b.onclick = () => { const o = findO(b); if (o) aiMessage(o, b); });
  view.querySelectorAll('[data-act="go"]').forEach(b => b.onclick = () => { const o = findO(b); if (o) startRun(o); });
  ["pay", "fail", "later"].forEach(k => view.querySelectorAll(`[data-act="${k}"]`).forEach(b => b.onclick = () => { panel = { row: +b.closest("[data-row]").dataset.row, kind: k }; render(); }));
  view.querySelectorAll('[data-act="close"]').forEach(b => b.onclick = () => { panel = null; render(); });
  view.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => { const o = findO(b); if (o) delivered(o, b.dataset.pay); });
  view.querySelectorAll("[data-fail]").forEach(b => b.onclick = () => { const o = findO(b); if (o) failed(o, b.dataset.fail); });
  view.querySelectorAll("[data-later]").forEach(b => b.onclick = () => { const o = findO(b); if (o) reschedule(o, new Date(+b.dataset.later)); });
  view.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const label = b.textContent;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copié ✓"; } catch (e) { b.textContent = b.dataset.copy; }
    setTimeout(() => { b.textContent = label; }, 1500);
  });
  view.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
  view.querySelectorAll("[data-rev]").forEach(b => b.onclick = () => { const v = b.dataset.rev; if (v === "end") { reviewStep = -1; store("ws_review", dayKey()); } else reviewStep = +v; window.scrollTo(0, 0); render(); });
  view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { setRole("ceo", b.dataset.go); });
  view.querySelectorAll("[data-step-go]").forEach(b => b.onclick = () => { salesStep = Math.min(+b.dataset.stepGo, SALES_STEPS.length); window.scrollTo(0, 0); render(); });
  view.querySelectorAll("[data-alert]").forEach(b => b.onclick = () => {
    const a = alerts()[+b.dataset.alert]; if (!a) return;
    if (a.go) { salesStep = a.go[2]; setRole(a.go[0], a.go[1]); } else { filter = a.f; tab = "orders"; window.scrollTo(0, 0); render(); }
  });
  const q = document.getElementById("q");
  if (q) q.oninput = () => { query = q.value; const pos = q.selectionStart; render(); const q2 = document.getElementById("q"); q2.focus(); q2.setSelectionRange(pos, pos); };
  view.querySelectorAll("[data-member]").forEach(b => b.onclick = () => { const m = team.find(x => x.nom === b.dataset.member); if (m) { m.actif = b.dataset.actif === "1"; render(); setMember(m, { actif: m.actif }, m.nom + (m.actif ? " réactivé" : " désactivé")); } });
  const lo = document.getElementById("out"); if (lo) lo.onclick = () => logout("");
  const ms = document.getElementById("meSel"); if (ms) ms.onchange = () => { me = ms.value; store("ws_me", me); render(); };
  const f = document.getElementById("addForm");
  if (f) f.onsubmit = e => { e.preventDefault(); addMember(document.getElementById("mNom").value.trim(), document.getElementById("mRole").value, document.getElementById("mTel").value.replace(/[^0-9+ ]/g, "").trim(), document.getElementById("mPin").value.replace(/\D/g, "")); f.reset(); };
  const bb = document.getElementById("bilanBtn"); if (bb) bb.onclick = makeBilan;

  view.querySelectorAll("[data-sugg]").forEach(b => b.onclick = () => askAI(b.dataset.sugg));
}

const RULES = () => `Tu es l'assistant de gestion de WillShop, une boutique en ligne à Ouagadougou, Burkina Faso (Kit Minceur, Green Mask Stick…). Tu parles à ${role === "sales" ? "un commercial de WillShop" : role === "driver" ? "un livreur de WillShop" : "Wilfried, le patron"}.

let bilanCtl = null;

async function aiMessage(o, btn) {

let aiCtl = null, busy = false;

  busy = true; chat.push({ role: "user", content: q }); chat = chat.slice(-12); render();
  const box = document.getElementById("chat");
  const bubble = document.createElement("div"); bubble.className = "msg ai"; bubble.textContent = "Je réfléchis…"; box.appendChild(bubble);
  bubble.scrollIntoView({ block: "end" });
  aiCtl = new AbortController();
  try {
    const { text } = await sample([{ role: "user", content: RULES() }, { role: "assistant", content: "D'accord, j'ai les données." }, ...chat], { cache: false, signal: aiCtl.signal, onText: ({ text }) => { bubble.textContent = text; } });
    chat.push({ role: "assistant", content: text });
  } catch (e) {
    chat.push({ role: "assistant", content: e.text || (e.code === "rate_limited" ? "Trop de questions d'un coup. Réessaie dans quelques minutes." : e.code === "not_granted" ? "L'assistant n'a pas été autorisé pour cette page." : "Je n'ai pas pu répondre. Réessaie.") });
    if (e.code === "not_granted" || e.code === "sampling_disabled") sample = null;
  }
  busy = false; render();
  const c = document.getElementById("chat"); if (c && c.lastElementChild) c.lastElementChild.scrollIntoView({ block: "end" });
}

}

const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

function applyTheme(t) {
  document.documentElement.dataset.theme = t; store("ws_theme", t);
  document.getElementById("tc").setAttribute("content", t === "dark" ? "#14100F" : "#FFFFFF");
  const b = document.getElementById("themeBtn"); b.innerHTML = t === "dark" ? SUN : MOON;
  b.title = t === "dark" ? "Passer en mode clair" : "Passer en mode sombre";
}
applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
document.getElementById("themeBtn").onclick = () => { applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); toast(document.documentElement.dataset.theme === "dark" ? "Mode sombre" : "Mode clair"); };

  else renderLogin("");
})();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
