<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" id="tc">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("aca_theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta name="description" content="Will Academy : prospects, relances WhatsApp, élèves et chiffres.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Will Academy">
<title>Will Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* App téléphone une colonne : en-tête collant, 3 onglets en bas (Accueil, Relances, Contacts), fiche contact en panneau du bas.
   Palette Will Academy (logo) : vert foncé #0B4A36, vert vif #22C32A, blanc. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F6F3EE; --ink:#1F1917; --mut:#6B625B; --faint:#A0958C; --line:#ECE6DC;
  --bx:#0B4A36; --bx-fill:#0B4A36; --bx-soft:#E3F1EA; --on-bx:#FFFFFF;
  --gold:#16881F; --gold-fill:#22C32A; --gold-soft:#E6F8E5;
  --ok:#2E7D4F; --ok-soft:#E5F1E9; --bad:#B3261E; --bad-soft:#FBE8E6; --info:#3F5C7A; --info-soft:#E8EEF4; --warn:#C46A12; --warn-soft:#FCEEDD;
  --wa:#1F8F4E;
  --shadow:0 4px 16px rgba(31,25,23,.06);
  --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14100F; --surface:#1D1715; --sunk:#251E1B; --ink:#F3ECE4; --mut:#ACA096; --faint:#7D726A; --line:#342A26;
  --bx:#7FD9A6; --bx-fill:#13694D; --bx-soft:#12291F; --gold:#5EE26A; --gold-fill:#22C32A; --gold-soft:#14281A;
  --ok:#74C595; --ok-soft:#172A1F; --bad:#F2908A; --bad-soft:#3A1C1A; --info:#9DB8D6; --info-soft:#1B2530; --warn:#F0A35A; --warn-soft:#33220F;
  --wa:#2FB066; --shadow:0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14100F; --surface:#1D1715; --sunk:#251E1B; --ink:#F3ECE4; --mut:#ACA096; --faint:#7D726A; --line:#342A26;
  --bx:#7FD9A6; --bx-fill:#13694D; --bx-soft:#12291F; --gold:#5EE26A; --gold-fill:#22C32A; --gold-soft:#14281A;
  --ok:#74C595; --ok-soft:#172A1F; --bad:#F2908A; --bad-soft:#3A1C1A; --info:#9DB8D6; --info-soft:#1B2530; --warn:#F0A35A; --warn-soft:#33220F;
  --wa:#2FB066; --shadow:0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.brand{font:800 21px/1 var(--sans);letter-spacing:-.02em;color:var(--bx);text-transform:uppercase}
.brand small{font:800 12px/1 var(--sans);letter-spacing:.06em;color:var(--gold-fill);margin-left:2px}
.sync{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}
:is(button,a,input,textarea,select):focus-visible{outline:2px solid var(--gold-fill);outline-offset:2px}
h1{font:700 25px/1.15 var(--serif);margin:18px 0 2px}
h2{font:700 18px/1.25 var(--serif);margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h2 .count{font:600 13px var(--sans);color:var(--mut)}
.sub{color:var(--mut);font-size:13.5px;margin:0}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.banner:empty{display:none}
/* Chiffres */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font:700 22px/1.2 var(--sans);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .h{font-size:12px;color:var(--faint);margin-top:2px}
.kpi.hero{background:var(--bx-fill);border-color:var(--bx-fill);color:var(--on-bx);grid-column:span 2}
.kpi.hero .l,.kpi.hero .h{color:#BFE3CF}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-fill);border-radius:99px}
.alert{color:var(--bad)!important}
.good{color:var(--ok)!important}
/* Entonnoir */
.funnel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.fl{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;font-size:13px;padding:4px 0}
.fl .t{height:22px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fl .t i{display:block;height:100%;background:var(--bx-fill);border-radius:6px;min-width:2px}
.fl:last-child .t i{background:var(--ok)}
.fl b{text-align:right;font-variant-numeric:tabular-nums}
.fl span{color:var(--mut)}
.tip{background:var(--gold-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:10px}
.tip b{color:var(--gold)}
/* Listes */
.seg{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--mut);font:600 13px var(--sans);padding:7px 12px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg button em{font-style:normal;opacity:.7;margin-left:4px}
.search{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:12px;padding:11px 12px;font:15px var(--sans)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--sans);background:var(--bx-soft);color:var(--bx);flex:none}
.item .m{flex:1;min-width:0}
.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font:700 11px/1 var(--sans);padding:5px 8px;border-radius:99px;white-space:nowrap}
.c-Visiteur{background:var(--sunk);color:var(--mut)}
.c-Prospect{background:var(--info-soft);color:var(--info)}
.c-Veut{background:var(--warn-soft);color:var(--warn)}
.c-Acompte{background:var(--gold-soft);color:var(--gold)}
.c-Payé{background:var(--ok-soft);color:var(--ok)}
.c-Perdu{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--mut);text-align:center;padding:28px 12px;background:var(--sunk);border-radius:16px;font-size:14px}
/* Cartes de relance */
.rel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rel .top{display:flex;align-items:center;gap:10px}
.rel .who{flex:1;min-width:0}
.rel .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .who small{color:var(--mut);font-size:12.5px}
.msg{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;color:var(--ink)}
.warnline{font-size:12.5px;color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--sans);padding:11px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:44px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;flex:1}
.btn.pri{background:var(--bx-fill);border-color:var(--bx-fill);color:var(--on-bx)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;pointer-events:none}
/* Onglets du bas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;color:var(--mut);font:600 11.5px var(--sans);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--bx)}
nav.tabs .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;font:700 10px/16px var(--sans);min-width:16px;padding:0 4px;border-radius:99px}
/* Panneau du bas */
.scrim{position:fixed;inset:0;background:rgba(20,16,15,.45);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:8px max(16px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin:12px 0}
.kv span{color:var(--mut)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13px;color:var(--mut);font-weight:600}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:12px;padding:11px 12px;font:15px var(--sans)}
.field textarea{min-height:70px;resize:vertical}
.steps{display:flex;gap:4px;margin-top:8px}
.steps button{flex:1;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--mut);border-radius:8px;font:700 13px var(--sans);cursor:pointer}
.steps button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hist{font-size:12.5px;color:var(--mut);margin-top:6px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:6;width:54px;height:54px;border-radius:18px;border:0;background:var(--bx-fill);color:var(--on-bx);box-shadow:0 8px 20px rgba(11,74,54,.3);display:grid;place-items:center;cursor:pointer}
.fab svg{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
/* Connexion */
.login{max-width:360px;margin:12vh auto 0;text-align:center;padding:0 16px}
.login .logo{width:72px;height:72px;border-radius:20px;margin:0 auto 14px;display:block}
.login input{width:100%;text-align:center;font:700 26px var(--sans);letter-spacing:.4em;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:14px;padding:14px;margin-top:18px}
.login .btn{width:100%;margin-top:12px}
.login .err{color:var(--bad);font-size:14px;min-height:22px;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <img class="logo" src="icons/logo-240.jpg" alt="Will Academy" style="width:140px;height:140px;border-radius:24px">
  <p class="sub" style="margin-top:8px">Entre ton code PIN</p>
  <form id="lf"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="Code PIN">
  <button class="btn pri" type="submit" id="lbtn">Ouvrir</button></form>
  <p class="err" id="lerr"></p>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <img src="icons/icon-192.png" alt="" style="width:34px;height:34px;border-radius:10px"><div class="brand">Will <small>Academy</small></div>
    <div class="sync" id="sync"></div>
    <button class="icon-btn" id="refresh" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="icon-btn" id="theme" aria-label="Changer le thème"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>
  <p class="banner" id="banner"></p>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Ajouter un contact" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs" id="nav" hidden><div class="in" role="tablist">
  <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Accueil</button>
  <button role="tab" data-tab="rel" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20l1.3-5A8.5 8.5 0 1 1 21 11.5z"/></svg>Relances<span class="badge" id="badge" hidden></span></button>
  <button role="tab" data-tab="contacts" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 3.5a4 4 0 0 1 0 9M22 21a7 7 0 0 0-4-6.3"/></svg>Contacts</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Réglages ---------- */
var API = "https://script.google.com/macros/s/AKfycbxIaukPzsovSA39TKZa9FsETNUr4nGKl7N0KAHO2qWSqP1bmPygGyc98NEeLXJ06JEV/exec";
var STEPS = ["Arrivée", "Intéressé", "Objectif", "Extrait lancé", "Extrait vu", "Offre vue", "Question", "Numéro donné", "Commande"];
var FUNNEL = [["Visiteurs", 0], ["Intéressés", 1], ["Offre vue", 5], ["Numéro laissé", 7], ["Clic « Payer »", 8]];
var WAI = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.2z"/></svg>';

/* ---------- État ---------- */
var PIN = "", D = null, tab = "home", filter = "chauds", q = "", lastSync = null, busy = false;
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function fmt(n) { return Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " F"; }
function toast(t) { var e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove("on"); }, 2200); }
function day0(d) { d = new Date(d); d.setHours(0, 0, 0, 0); return d; }
function daysSince(d) { return d ? Math.floor((day0(new Date()) - day0(d)) / 864e5) : 0; }
function isToday(d) { return d && daysSince(d) === 0 && !isNaN(new Date(d)); }
function when(d) {
  if (!d) return ""; var n = daysSince(d), t = new Date(d);
  if (n === 0) return "aujourd'hui " + t.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  if (n === 1) return "hier"; if (n < 7) return "il y a " + n + " j";
  return t.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}
function prenom(p) { var n = String(p.nom || "").trim().split(/\s+/)[0] || ""; return n ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : ""; }
function initials(p) { var n = String(p.nom || "?").trim(); return (n.charAt(0) || "?").toUpperCase(); }
function waNum(tel) { var d = String(tel || "").replace(/\D/g, ""); if (d.length === 8) d = "226" + d; return d; }
function hasTel(p) { return String(p.tel || "").replace(/\D/g, "").length >= 8; }
function stepIdx(p) { return p.statut === "Payé" || p.statut === "Acompte" ? STEPS.length : STEPS.indexOf(p.etape); }
function chip(s) { s = s || "Visiteur"; return '<span class="chip c-' + esc(s.split(" ")[0]) + '">' + esc(s) + "</span>"; }

/* ---------- Serveur ---------- */
async function api(action, p) {
  var r, j;
  for (var i = 0; i < 2; i++) {
    try { r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ app: 1, action: action, pin: PIN, p: p || {} }) }); break; }
    catch (e) { if (i) { var er = new Error("Pas de connexion"); er.net = true; throw er; } await new Promise(function (ok) { setTimeout(ok, 1500); }); }
  }
  try { j = await r.json(); } catch (e) { var er2 = new Error("Pas de connexion"); er2.net = true; throw er2; }
  if (!j.ok) throw new Error(j.error || "Erreur");
  return j.data;
}
async function load(quiet) {
  if (busy) return; busy = true;
  if (!quiet) $("sync").textContent = "Actualisation…";
  try {
    D = await api("data"); lastSync = new Date();
    ls("aca_cache", JSON.stringify(D));
    $("banner").textContent = ""; render();
  } catch (e) {
    if (!e.net && /PIN|essais/i.test(e.message)) return logout(e.message);
    $("banner").textContent = "Pas de connexion. Les dernières données restent affichées.";
  } finally { busy = false; syncLabel(); }
}
function syncLabel() { $("sync").textContent = lastSync ? "à jour " + lastSync.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : ""; }

/* ---------- Calculs ---------- */
function stats() {
  var P = D.prospects, pr = D.params || {}, s = { vis: P.length, tel: 0, pay: 0, ventes: 0, payes: 0, enc: 0, today: 0, todayTel: 0, perdus: 0 };
  P.forEach(function (p) {
    if (hasTel(p)) s.tel++;
    if (p.statut === "Veut payer" || p.statut === "Payé" || p.statut === "Acompte") s.pay++;
    if (p.statut === "Payé" || p.statut === "Acompte") s.ventes++;
    if (p.statut === "Payé") s.payes++;
    if (p.statut === "Perdu") s.perdus++;
    s.enc += Number(p.montant) || 0;
    if (isToday(p.date)) { s.today++; if (hasTel(p)) s.todayTel++; }
  });
  s.pub = D.pub || 0; s.cpv = s.ventes ? s.pub / s.ventes : 0;
  s.marge = s.enc - s.pub - s.payes * (pr.bonus || 0);
  s.obj = pr.objectif || 30; s.conv = s.tel ? s.ventes / s.tel : 0;
  return s;
}
function seqFor(p) {
  var pour = p.statut === "Payé" ? "Élève" : (/^(Visiteur|Prospect|Veut payer)$/.test(p.statut || "Visiteur") ? "Prospect" : "");
  if (!pour) return null;
  return D.sequence.filter(function (m) { return m.pour.toLowerCase() === pour.toLowerCase(); }).sort(function (a, b) { return a.jour - b.jour; });
}
// Prochain message de la séquence et s'il est dû aujourd'hui
function nextMsg(p) {
  if (!hasTel(p)) return null;
  var seq = seqFor(p); if (!seq || !seq.length) return null;
  var k = Number(p.relances) || 0; if (k >= seq.length) return { done: true };
  var base = p.statut === "Payé" ? (p.datePaiement || p.maj || p.date) : p.date;
  var m = seq[k], due = daysSince(base) >= m.jour && !isToday(p.derniereRelance);
  return { m: m, k: k, total: seq.length, due: due, dans: m.jour - daysSince(base), base: base };
}
function fill(txt, p) {
  var c = D.config || {}, v = { prenom: prenom(p), lien: c["Lien aperçu gratuit"] || "", acces: c["Lien d'accès formation"] || "", groupe: c["Lien groupe WhatsApp élèves"] || "",
    orange: c["Numéro Orange Money"] || "", moov: c["Numéro Moov Money"] || "" };
  var missing = [];
  var out = String(txt).replace(/\{(\w+)\}/g, function (all, k) { if (k in v) { if (!v[k]) missing.push(k); return v[k]; } return all; });
  out = out.replace(/^(\s*),\s*/, "$1").replace(/ +([,!?.])/g, "$1").replace(/(Salut|Bienvenue|Dernier message|Alors) +([,!🎉🙂👋])/g, "$1$2");
  return { text: out, missing: missing };
}
function waLink(p, text) { return "https://wa.me/" + waNum(p.tel) + (text ? "?text=" + encodeURIComponent(text) : ""); }
function dueList() {
  var out = [];
  D.prospects.forEach(function (p) { var n = nextMsg(p); if (n && n.due) out.push({ p: p, n: n }); });
  var rank = { "Veut payer": 0, "Payé": 1, "Prospect": 2, "Visiteur": 3 };
  return out.sort(function (a, b) { return (rank[a.p.statut] - rank[b.p.statut]) || (new Date(b.p.date) - new Date(a.p.date)); });
}

/* ---------- Écrans ---------- */
function render() {
  if (!D) return;
  var due = dueList().length;
  $("badge").hidden = !due; $("badge").textContent = due;
  document.querySelectorAll("nav.tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
  $("fab").hidden = tab !== "contacts";
  $("view").innerHTML = tab === "home" ? viewHome() : tab === "rel" ? viewRel() : viewContacts();
  if (tab === "contacts") { var s = $("q"); if (s) { s.value = q; s.oninput = function () { q = s.value; var y = window.scrollY; $("lst").innerHTML = contactItems(); window.scrollTo(0, y); }; } }
}

function viewHome() {
  var s = stats(), pr = D.params || {}, pct = Math.min(100, Math.round(s.ventes / s.obj * 100)), due = dueList();
  var cpvCls = s.cpv && pr.coutMax && s.cpv > pr.coutMax ? "alert" : (s.cpv ? "good" : "");
  var h = '<h1>Bonjour Wilfried</h1><p class="sub">' + s.today + " visiteur" + (s.today > 1 ? "s" : "") + " aujourd'hui · " + s.todayTel + " numéro" + (s.todayTel > 1 ? "s" : "") + " laissé" + (s.todayTel > 1 ? "s" : "") + "</p>";
  h += '<div class="kpis">' +
    '<div class="kpi hero"><div class="l">Objectif du mois</div><div class="v">' + s.ventes + " / " + s.obj + ' ventes</div><div class="h">' + fmt(s.enc) + " encaissés · marge nette " + fmt(s.marge) + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
    kpi("Visiteurs", s.vis, "dans le tunnel") + kpi("Numéros", s.tel, s.vis ? Math.round(s.tel / s.vis * 100) + " % des visiteurs" : "") +
    kpi("Clic « Payer »", s.pay, "intéressés chauds") + kpi("Ventes", s.ventes, s.tel ? Math.round(s.conv * 100) + " % des numéros" : "") +
    kpi("Dépense pub", fmt(s.pub), "saisie dans le Sheet") + kpi("Coût par vente", s.cpv ? fmt(s.cpv) : "—", "max " + fmt(pr.coutMax || 3000), cpvCls) +
    "</div>";
  if (due.length) h += '<div class="tip"><b>' + due.length + " relance" + (due.length > 1 ? "s" : "") + "</b> à faire aujourd'hui. " + '<a href="#" onclick="go(\'rel\');return false" style="color:var(--bx);font-weight:700">Les envoyer →</a></div>';
  h += "<h2>Entonnoir</h2>" + funnel();
  var b = blocNow(); if (b) h += "<h2>Budget pub · " + esc(b.bloc) + '</h2><div class="kpis" style="margin-top:0">' + kpi("Dépensé", fmt(b.pub), dShort(b.du) + " → " + dShort(b.au)) + kpi("Encaissé", fmt(b.encaisse), b.ventes + " vente" + (b.ventes > 1 ? "s" : "")) + kpi("À réinjecter", fmt(b.reinjecter), Math.round((pr.reinjection || .6) * 100) + " % de l'encaissé") + kpi("Budget / jour", b.parJour ? fmt(b.parJour) : "—", "bloc suivant") + "</div>" + advice(b, pr);
  return h;
}
function kpi(l, v, h, cls) { return '<div class="kpi"><div class="l">' + l + '</div><div class="v ' + (cls || "") + '">' + v + '</div><div class="h">' + (h || "") + "</div></div>"; }
function dShort(d) { return d ? new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : ""; }
function funnel() {
  var P = D.prospects, max = P.length || 1, h = '<div class="funnel">';
  FUNNEL.forEach(function (f) {
    var n = P.filter(function (p) { return f[1] === 7 ? hasTel(p) : stepIdx(p) >= f[1]; }).length;
    h += '<div class="fl"><span>' + f[0] + '</span><div class="t"><i style="width:' + (n / max * 100) + '%"></i></div><b>' + n + "</b></div>";
  });
  var paid = P.filter(function (p) { return p.statut === "Payé" || p.statut === "Acompte"; }).length;
  h += '<div class="fl"><span>Payé</span><div class="t"><i style="width:' + (paid / max * 100) + '%"></i></div><b>' + paid + "</b></div></div>";
  return h;
}
function blocNow() {
  var t = day0(new Date()), bs = D.blocs || [];
  for (var i = 0; i < bs.length; i++) if (bs[i].du && day0(bs[i].du) <= t && t <= day0(bs[i].au)) return bs[i];
  return null;
}
function advice(b, pr) {
  var t = "";
  if (!b.pub) t = "Pense à saisir ta dépense pub du bloc dans le Sheet (onglet Budget pub).";
  else if (!b.ventes) t = "Pas encore de vente sur ce bloc. Si tu as des numéros, ce sont les relances qui manquent, pas la pub.";
  else if (b.pub / b.ventes > (pr.coutMax || 3000)) t = "Coût par vente au-dessus de " + fmt(pr.coutMax || 3000) + " : coupe la créa la plus faible.";
  else t = "Bon rythme : réinjecte " + fmt(b.reinjecter) + " et garde " + fmt(b.epargner) + ".";
  return '<div class="tip">' + t + "</div>";
}

function viewRel() {
  var due = dueList(), h = "<h1>Relances du jour</h1><p class=\"sub\">Touche « Envoyer », WhatsApp s'ouvre avec le message prêt. Appuie sur Envoyer dans WhatsApp, c'est noté ici.</p>";
  if (!due.length) {
    var soon = D.prospects.map(function (p) { return { p: p, n: nextMsg(p) }; }).filter(function (x) { return x.n && !x.n.done && !x.n.due; }).length;
    return h + '<div class="empty" style="margin-top:16px">Rien à envoyer pour l\'instant 👌' + (soon ? "<br>" + soon + " relance" + (soon > 1 ? "s" : "") + " prévue" + (soon > 1 ? "s" : "") + " les prochains jours." : "") + "</div>";
  }
  h += '<div class="list">' + due.map(function (x) { return relCard(x.p, x.n); }).join("") + "</div>";
  return h;
}
function relCard(p, n) {
  var f = fill(n.m.message, p), sid = esc(p.sid);
  return '<div class="rel"><div class="top"><div class="av">' + esc(initials(p)) + '</div><div class="who"><b>' + esc(p.nom || p.tel) + '</b><small>' + esc(p.tel) + " · " + esc(n.m.titre) + " (" + (n.k + 1) + "/" + n.total + ")</small></div>" + chip(p.statut) + "</div>" +
    '<div class="msg">' + esc(f.text) + "</div>" +
    (f.missing.length ? '<div class="warnline">⚠️ Lien manquant ({' + f.missing.join("}, {") + "}) : ajoute-le dans l'onglet Config du Sheet.</div>" : "") +
    '<div class="row"><a class="btn wa" href="' + esc(waLink(p, f.text)) + '" target="_blank" rel="noopener" onclick="sent(\'' + sid + '\')">' + WAI + 'Envoyer</a>' +
    '<button class="btn" onclick="skip(\'' + sid + '\')">Passer</button><button class="btn" onclick="openP(\'' + sid + '\')">Fiche</button></div></div>';
}

var FILTERS = [["chauds", "Chauds", function (p) { return p.statut === "Veut payer"; }], ["prospects", "Prospects", function (p) { return hasTel(p) && /^(Visiteur|Prospect)$/.test(p.statut || "Visiteur"); }],
  ["eleves", "Élèves", function (p) { return p.statut === "Payé" || p.statut === "Acompte"; }], ["perdus", "Perdus", function (p) { return p.statut === "Perdu"; }],
  ["tous", "Tous avec numéro", function (p) { return hasTel(p); }], ["visiteurs", "Sans numéro", function (p) { return !hasTel(p); }]];
function viewContacts() {
  var h = "<h1>Contacts</h1>";
  h += '<div class="seg" role="group">' + FILTERS.map(function (f) { var c = D.prospects.filter(f[2]).length; return '<button aria-pressed="' + (filter === f[0]) + '" onclick="setF(\'' + f[0] + '\')">' + f[1] + "<em>" + c + "</em></button>"; }).join("") + "</div>";
  h += '<input class="search" id="q" type="search" placeholder="Chercher un nom ou un numéro" autocomplete="off">';
  return h + '<div class="list" id="lst">' + contactItems() + "</div>";
}
function contactItems() {
  var f = FILTERS.filter(function (x) { return x[0] === filter; })[0][2], qq = q.trim().toLowerCase(), qd = qq.replace(/\D/g, "");
  var L = D.prospects.filter(f).filter(function (p) { return !qq || String(p.nom).toLowerCase().indexOf(qq) >= 0 || (qd && String(p.tel).replace(/\D/g, "").indexOf(qd) >= 0); })
    .sort(function (a, b) { return new Date(b.maj || b.date) - new Date(a.maj || a.date); });
  if (!L.length) return '<div class="empty">Personne ici pour le moment.</div>';
  return L.slice(0, 300).map(function (p) {
    var n = nextMsg(p), extra = p.statut === "Payé" ? " · vidéo " + (Number(p.progression) || 0) + "/8" : (n && !n.done ? (n.due ? " · relance à faire" : " · relance dans " + n.dans + " j") : "");
    return '<button class="item" onclick="openP(\'' + esc(p.sid) + '\')"><div class="av">' + esc(initials(p)) + '</div><div class="m"><div class="n">' + esc(p.nom || p.tel || "Visiteur anonyme") + '</div><div class="d">' +
      esc([p.tel, p.etape, when(p.date)].filter(Boolean).join(" · ")) + esc(extra) + "</div></div>" + chip(p.statut) + "</button>";
  }).join("");
}

/* ---------- Fiche contact ---------- */
function find(sid) { return D.prospects.filter(function (p) { return p.sid === sid; })[0]; }
function openSheet(html) { $("sheetIn").innerHTML = html; $("scrim").classList.add("on"); $("sheet").classList.add("on"); }
function closeSheet() { $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); }
function openP(sid) {
  var p = find(sid); if (!p) return;
  var n = nextMsg(p), pr = D.params || {}, s = esc(sid), paid = p.statut === "Payé";
  var h = '<div style="display:flex;align-items:center;gap:12px"><div class="av" style="width:48px;height:48px;font-size:18px">' + esc(initials(p)) + '</div><div style="flex:1;min-width:0"><div style="font:700 20px var(--serif)">' + esc(p.nom || "Sans nom") + "</div>" + chip(p.statut) + "</div></div>";
  h += '<div class="kv"><span>WhatsApp</span><b>' + esc(p.tel || "—") + "</b><span>Pays</span><b>" + esc(p.pays || "—") + "</b><span>Choix</span><b>" + esc(p.objectif || "—") + "</b><span>Étape</span><b>" + esc(p.etape || "—") + "</b><span>Arrivé</span><b>" + esc(when(p.date)) + "</b>" +
    (p.montant ? "<span>Payé</span><b>" + fmt(p.montant) + " · " + esc(when(p.datePaiement)) + "</b>" : "") + "<span>Relances</span><b>" + (Number(p.relances) || 0) + (p.derniereRelance ? " · dernière " + esc(when(p.derniereRelance)) : "") + "</b></div>";
  if (hasTel(p)) {
    if (n && !n.done) { var f = fill(n.m.message, p); h += '<div class="field">Prochain message : ' + esc(n.m.titre) + (n.due ? "" : " (dans " + n.dans + " j)") + '</div><div class="msg" style="margin-top:6px">' + esc(f.text) + '</div><div class="row" style="margin-top:8px"><a class="btn wa" href="' + esc(waLink(p, f.text)) + '" target="_blank" rel="noopener" onclick="sent(\'' + s + '\')">' + WAI + "Envoyer ce message</a></div>"; }
    else h += '<div class="row" style="margin-top:4px"><a class="btn wa" href="' + esc(waLink(p, "")) + '" target="_blank" rel="noopener">' + WAI + "Ouvrir la discussion</a></div>";
  }
  h += '<h2 style="margin-top:20px">Statut</h2><div class="row">';
  if (!paid) h += '<button class="btn ok" onclick="askPay(\'' + s + '\')">Paiement reçu</button>';
  if (p.statut !== "Acompte" && !paid) h += '<button class="btn" onclick="setS(\'' + s + '\',\'Acompte\',' + Math.round((pr.prix || 7500) / 2) + ')">Acompte</button>';
  if (p.statut !== "Perdu") h += '<button class="btn" onclick="setS(\'' + s + '\',\'Perdu\')">Perdu</button>';
  if (/Perdu|Payé|Acompte/.test(p.statut)) h += '<button class="btn ghost" onclick="setS(\'' + s + '\',\'Prospect\',0)">Remettre en prospect</button>';
  h += "</div>";
  if (paid || p.statut === "Acompte") {
    h += '<h2 style="margin-top:20px">Élève</h2><div class="row"><button class="btn ' + (p.acces === "Oui" ? "ok" : "pri") + '" onclick="upd(\'' + s + '\',{acces:' + (p.acces !== "Oui") + '})">' + (p.acces === "Oui" ? "✓ Accès donné" : "Marquer l'accès donné") + "</button></div>";
    var pg = Number(p.progression) || 0; h += '<div class="field">Progression : vidéo ' + pg + ' sur 8</div><div class="steps">';
    for (var i = 1; i <= 8; i++) h += '<button class="' + (i <= pg ? "on" : "") + '" onclick="upd(\'' + s + '\',{progression:' + (i === pg ? i - 1 : i) + '})" aria-label="Vidéo ' + i + '">' + i + "</button>";
    h += "</div>";
  }
  h += '<label class="field">Nom<input id="enom" value="' + esc(p.nom) + '"></label><label class="field">Note<textarea id="enote" placeholder="Ce qu\'il a dit, ce qui le bloque…">' + esc(p.note) + '</textarea></label>' +
    '<div class="row" style="margin-top:10px"><button class="btn pri" onclick="saveNote(\'' + s + '\')">Enregistrer</button><button class="btn ghost" onclick="closeSheet()">Fermer</button></div>';
  openSheet(h);
}
function askPay(sid) {
  var p = find(sid), pr = D.params || {};
  openSheet('<div style="font:700 20px var(--serif)">Paiement de ' + esc(p.nom || p.tel) + '</div><label class="field">Montant reçu (F)<input id="mt" type="number" inputmode="numeric" value="' + (pr.prix || 7500) + '"></label>' +
    '<p class="sub" style="margin-top:8px">Ses relances passent en mode « élève » (bienvenue, suivi, suite).</p><div class="row" style="margin-top:12px"><button class="btn ok" onclick="setS(\'' + esc(sid) + '\',\'Payé\',+$(\'mt\').value)">Valider le paiement</button><button class="btn ghost" onclick="openP(\'' + esc(sid) + '\')">Annuler</button></div>');
}
function setS(sid, st, montant) { var f = { statut: st }; if (montant !== undefined) f.montant = montant; upd(sid, f, st === "Payé" ? "Paiement enregistré 🎉" : "Statut : " + st); }
function saveNote(sid) { upd(sid, { note: $("enote").value, nom: $("enom").value }, "Enregistré"); }

// Mise à jour : on change l'écran tout de suite, puis on envoie au Sheet
async function upd(sid, fields, msg, relance) {
  var p = find(sid); if (!p) return;
  var before = JSON.stringify(p), now = new Date().toISOString();
  if (fields.statut === "Payé" && p.statut !== "Payé") { p.relances = 0; p.derniereRelance = ""; if (!p.datePaiement) p.datePaiement = now; }
  if (fields.statut === "Acompte" && !p.datePaiement) p.datePaiement = now;
  for (var k in fields) p[k] = k === "acces" ? (fields[k] ? "Oui" : "") : fields[k];
  if (relance) { p.relances = (Number(p.relances) || 0) + 1; p.derniereRelance = now; }
  p.maj = now;
  if ($("sheet").classList.contains("on") && !relance) openP(sid);
  render(); if (msg) toast(msg);
  try { await api("update", { sid: sid, fields: fields, relance: !!relance }); ls("aca_cache", JSON.stringify(D)); }
  catch (e) { var o = JSON.parse(before); for (var j in o) p[j] = o[j]; render(); toast(e.net ? "Pas de connexion : rien n'a été enregistré" : e.message); }
}
function sent(sid) { setTimeout(function () { upd(sid, {}, "Relance notée ✓", true); if ($("sheet").classList.contains("on")) closeSheet(); }, 300); }
function skip(sid) { upd(sid, {}, "Relance passée", true); }

function addForm() {
  openSheet('<div style="font:700 20px var(--serif)">Nouveau contact</div><p class="sub">Pour quelqu\'un qui t\'écrit directement sur WhatsApp.</p>' +
    '<label class="field">Prénom<input id="an" autocomplete="off"></label><label class="field">Numéro WhatsApp<input id="at" type="tel" inputmode="tel" placeholder="70 00 00 00"></label>' +
    '<label class="field">Note<textarea id="ao"></textarea></label><div class="row" style="margin-top:12px"><button class="btn pri" id="ab" onclick="addC()">Ajouter</button><button class="btn ghost" onclick="closeSheet()">Annuler</button></div>');
}
async function addC() {
  var n = $("an").value.trim(), t = $("at").value.trim();
  if (!n || t.replace(/\D/g, "").length < 8) return toast("Mets un prénom et un numéro valide");
  $("ab").disabled = true;
  try { await api("add", { nom: n, tel: t, note: $("ao").value }); closeSheet(); toast("Contact ajouté"); filter = "prospects"; await load(true); }
  catch (e) { $("ab").disabled = false; toast(e.net ? "Pas de connexion" : e.message); }
}

/* ---------- Navigation, connexion ---------- */
function go(t) { tab = t; closeSheet(); render(); window.scrollTo(0, 0); }
function setF(f) { filter = f; render(); }
document.querySelectorAll("nav.tabs button").forEach(function (b) { b.onclick = function () { go(b.dataset.tab); }; });
$("scrim").onclick = closeSheet;
$("fab").onclick = addForm;
$("refresh").onclick = function () { load(); };
$("theme").onclick = function () { var r = document.documentElement, t = r.dataset.theme === "dark" ? "light" : "dark"; r.dataset.theme = t; ls("aca_theme", t); tc(); };
function tc() { $("tc").content = document.documentElement.dataset.theme === "dark" ? "#14100F" : "#FFFFFF"; } tc();
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", function () { if (!document.hidden && PIN) load(true); });
setInterval(function () { if (!document.hidden && PIN) load(true); }, 60000);

function showApp() { $("login").hidden = true; $("app").hidden = false; $("nav").hidden = false; }
function logout(msg) { PIN = ""; ls("aca_pin", null); D = null; $("app").hidden = true; $("nav").hidden = true; $("fab").hidden = true; $("login").hidden = false; $("lerr").textContent = msg || ""; $("pin").value = ""; }
$("lf").onsubmit = async function (e) {
  e.preventDefault(); PIN = $("pin").value.trim(); if (!PIN) return;
  $("lbtn").disabled = true; $("lerr").textContent = "";
  try { D = await api("data"); lastSync = new Date(); ls("aca_pin", PIN); ls("aca_cache", JSON.stringify(D)); showApp(); render(); syncLabel(); }
  catch (er) { PIN = ""; $("lerr").textContent = er.net ? "Pas de connexion. Réessaie." : er.message; }
  finally { $("lbtn").disabled = false; }
};
(function boot() {
  PIN = ls("aca_pin") || "";
  if (!PIN) { $("login").hidden = false; return; }
  try { D = JSON.parse(ls("aca_cache") || "null"); } catch (e) {}
  showApp(); if (D) render(); load();
})();
if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {}); });
</script>
