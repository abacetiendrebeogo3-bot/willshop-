<script>
(function () {
  /* ===================== RÉGLAGES ===================== */
  var CFG = {
    prix: 7500, prixBarre: 15000, wa: "22672019524",
    sheet: "https://script.google.com/macros/s/AKfycbxIaukPzsovSA39TKZa9FsETNUr4nGKl7N0KAHO2qWSqP1bmPygGyc98NEeLXJ06JEV/exec",
    /* Une vidéo de Sadia par niveau (lien .mp4). Vide = sa photo animée + le texte. */
    videos: {
      hello: "https://d1yei2z3i6k35z.cloudfront.net/1170093/6ad1fe571e78b8.72595249_sadia_teaser.mp4",
      objectif: "", niveau: "", cadeau: "", offre: "", bravo: ""
    },
    lecon1: "https://d1yei2z3i6k35z.cloudfront.net/1170093/6ad02dce51de09.43882998_Video1_Bienvenue.mp4",
    presentation: "https://d1yei2z3i6k35z.cloudfront.net/1170093/6ad1fbf46cafc4.52218401_Formation_presentation_720.mp4"
  };
  var PORTRAIT = "__PORTRAIT__", P_TEASER = "__P_TEASER__", P_PRES = "__P_PRES__", P_L1 = "__P_L1__";
  var PROD = "Formation Vidéos IA", NLV = 7;
  var LIVE = /systeme\.io$/.test(location.hostname) && !/[?&]test/.test(location.search);
  /* ==================================================== */

  var root = document.getElementById("wa-game"); if (!root) return;
  document.body.classList.add("wag-on");
  var stage = document.getElementById("wag-stage"), dock = document.getElementById("wag-dock");
  var S = {}, SID;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  SID = store("wag_sid"); if (!SID) { SID = "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); store("wag_sid", SID); }
  try { S = JSON.parse(store("wag_s") || "{}") || {}; } catch (e) { S = {}; }
  S.xp = S.xp || 0;
  function save() { store("wag_s", JSON.stringify(S)); }

  /* ---------- Suivi ---------- */
  function send(o) {
    if (!LIVE) return;
    try {
      o.sid = SID; o.produit = PROD; o.zone = o.zone || S.pays || ""; o.lieu = o.lieu || S.but || "";
      if (S.nom && !o.nom) o.nom = S.nom; if (S.tel && !o.tel) o.tel = S.tel;
      var d = JSON.stringify(o);
      if (!(navigator.sendBeacon && navigator.sendBeacon(CFG.sheet, d))) fetch(CFG.sheet, { method: "POST", mode: "no-cors", body: d, keepalive: true });
    } catch (e) {}
  }
  function step(s) { send({ type: "visit", step: s }); }
  function px(ev, data, custom) { if (!LIVE) return; try { if (window.fbq) window.fbq(custom ? "trackCustom" : "track", ev, data || {}); } catch (e) {} }

  /* ---------- Outils ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " F"; }
  var PLAY = '<svg viewBox="0 0 24 24" fill="#06301F"><path d="M8 5v14l11-7z"/></svg>';
  var WAI = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.2z"/></svg>';

  function hud(lv) {
    document.getElementById("wag-lvl").textContent = lv > NLV ? "Parcours terminé 🏆" : "Niveau " + lv + " / " + NLV;
    var h = ""; for (var i = 1; i <= NLV; i++) h += '<i class="' + (i < lv ? "on" : i === lv ? "now" : "") + '"></i>';
    document.getElementById("wag-dots").innerHTML = h;
    document.getElementById("wag-xp").textContent = "⭐ " + S.xp + " XP";
  }
  function addXp(n) {
    var from = S.xp, to = S.xp + n, el = document.getElementById("wag-xp"), t0 = performance.now();
    S.xp = to; save(); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
    (function tick(t) { var k = Math.min(1, (t - t0) / 700); el.textContent = "⭐ " + Math.round(from + (to - from) * k) + " XP"; if (k < 1) requestAnimationFrame(tick); })(t0);
  }

  /* Média de la scène : vidéo de Sadia si elle existe, sinon sa photo animée */
  function media(src, poster, mode) {
    stage.innerHTML = ""; stage.classList.remove("nosay");
    if (!src) { stage.innerHTML = '<img class="media" src="' + (poster || PORTRAIT) + '" alt="Sadia"><div class="shade"></div>'; return; }
    var v = document.createElement("video");
    v.className = "media"; v.playsInline = true; v.setAttribute("playsinline", ""); v.src = src; if (poster) v.poster = poster;
    stage.appendChild(v); stage.insertAdjacentHTML("beforeend", '<div class="shade"></div>');
    if (mode === "tap") {
      v.preload = "metadata";
      var b = document.createElement("button"); b.type = "button"; b.className = "play"; b.setAttribute("aria-label", "Lire la vidéo"); b.innerHTML = "<span>" + PLAY + "</span>";
      b.onclick = function () { b.remove(); var s = stage.querySelector(".say"); if (s) s.style.display = "none"; v.controls = true; v.play().catch(function () {}); media.onPlay && media.onPlay(); };
      stage.appendChild(b);
    } else {
      v.muted = true; v.loop = true; v.preload = "auto";
      var c = navigator.connection || {};
      if (!(c.saveData || /2g/.test(c.effectiveType || ""))) v.play().catch(function () {});
      var s = document.createElement("button"); s.type = "button"; s.className = "snd"; s.textContent = "🔊 Son";
      s.onclick = function () { v.muted = !v.muted; if (!v.muted) { v.loop = false; v.currentTime = 0; v.play().catch(function () {}); } s.textContent = v.muted ? "🔊 Son" : "🔇"; };
      stage.appendChild(s);
    }
    return v;
  }
  /* Un seul message de Sadia, avec un court « en train d'écrire » */
  function say(html, done) {
    var old = stage.querySelector(".say"); if (old) old.remove();
    var d = document.createElement("div"); d.className = "say";
    d.innerHTML = '<div class="who"><i></i>Sadia</div><div class="typing"><i></i><i></i><i></i></div>';
    stage.appendChild(d);
    setTimeout(function () { d.innerHTML = '<div class="who"><i></i>Sadia</div>' + html; done && done(); }, 650);
  }
  function panel(html) { var p = document.createElement("div"); p.className = "panel"; p.innerHTML = html; stage.appendChild(p); return p; }
  function ask(opts, cb, layout) {
    dock.innerHTML = "";
    var wrap = dock;
    if (layout === "two") { wrap = document.createElement("div"); wrap.className = "row2"; dock.appendChild(wrap); }
    opts.forEach(function (o, i) {
      var b = document.createElement("button"); b.type = "button";
      b.className = "opt " + (o.c !== undefined ? o.c : (i === 0 ? "main" : ""));
      b.style.animationDelay = (i * .07) + "s"; b.textContent = o.t || o;
      b.onclick = function () { dock.innerHTML = ""; cb(i); };
      wrap.appendChild(b);
    });
  }

  /* Célébration entre deux niveaux : « Bravo ! +XP » + confettis */
  function bravo(emoji, title, xp, sub, next) {
    var c = document.createElement("div"); c.className = "cele";
    c.innerHTML = '<div class="box"><div class="e">' + emoji + "</div><b>" + title + "</b>" + (xp ? "<span>+" + xp + " XP</span>" : "") + (sub ? "<small>" + sub + "</small>" : "") + "</div>";
    stage.appendChild(c); if (xp) addXp(xp); confetti();
    setTimeout(function () { c.remove(); next && next(); }, 1500);
  }
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cv = document.createElement("canvas"), r = stage.getBoundingClientRect(), ctx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = r.width * dpr; cv.height = r.height * dpr; stage.appendChild(cv); ctx.scale(dpr, dpr);
    var cols = ["#22C32A", "#FFC83D", "#FFFFFF", "#7BE883", "#E8434B"], P = [];
    for (var i = 0; i < 70; i++) P.push({ x: r.width / 2, y: r.height * .45, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, s: 4 + Math.random() * 5, c: cols[i % cols.length], a: Math.random() * 6 });
    var t0 = performance.now();
    (function f(t) {
      ctx.clearRect(0, 0, r.width, r.height);
      P.forEach(function (p) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (t - t0 < 1400) requestAnimationFrame(f); else cv.remove();
    })(t0);
  }

  /* ===================== NIVEAUX ===================== */
  function n1() {
    hud(1); step("Arrivée"); media(CFG.videos.hello, P_TEASER);
    say("Salut 👋 Moi c'est Sadia, une <b>IA</b>. Tu veux apprendre à créer des vidéos comme moi ?", function () {
      ask(["Oui, je veux ! 🔥", { t: "Tu es vraiment une IA ? 🤔", c: "soft" }], function (i) {
        if (i === 1) return say("Oui, 100 % IA, créée sur un téléphone. Et tu peux apprendre à le faire 😉", function () { ask(["Ok, c'est parti ! 🔥"], gagne1); });
        gagne1();
      });
    });
  }
  function gagne1() { step("Intéressé"); px("TunnelDemarre", {}, true); bravo("🎉", "Bienvenue dans le jeu !", 20, "Va au bout : un cadeau t'attend 🎁", n2); }

  function n2() {
    hud(2); media(CFG.videos.objectif);
    say("Tu veux faire quoi avec les vidéos IA ?", function () {
      ask(["💰 Gagner de l'argent", { t: "📦 Faire la pub de mes produits", c: "" }, { t: "📱 Créer du contenu", c: "" }], function (i) {
        S.but = ["Revenu", "Pub produits", "Contenu"][i]; save(); step("Objectif");
        bravo(["💰", "📦", "📱"][i], "Bon choix !", 20, ["Un seul spot vendu à une boutique et ta formation est remboursée.", "Fini de payer un tournage : tu crées tes pubs toi-même.", "Tu publies tous les jours sans jamais te filmer."][i], n3);
      });
    });
  }

  function n3() {
    hud(3); media(CFG.videos.niveau);
    say("Tu as déjà utilisé l'IA ?", function () {
      ask(["Jamais", "Un peu"], function (i) {
        S.niveau = i ? "Un peu" : "Débutant"; save();
        bravo(i ? "💪" : "🚀", i ? "Tu vas aller vite !" : "Parfait !", 20, i ? "" : "La formation part de zéro, sur ton téléphone.", n4);
      }, "two");
    });
  }

  var PAYS = [["🇧🇫", "Burkina", "226", [8]], ["🇨🇮", "Côte d'Ivoire", "225", [10]], ["🇸🇳", "Sénégal", "221", [9]], ["🇧🇯", "Bénin", "229", [8, 10]], ["🇹🇬", "Togo", "228", [8]], ["🇲🇱", "Mali", "223", [8]], ["🇳🇪", "Niger", "227", [8]], ["🌍", "Autre", "", [7, 8, 9, 10, 11, 12, 13]]];
  function form(label, after) {
    var opts = PAYS.map(function (p, i) { return '<option value="' + i + '">' + p[0] + " " + (p[2] ? "+" + p[2] : p[1]) + "</option>"; }).join("");
    dock.innerHTML = '<form class="form" novalidate><input name="nom" placeholder="Ton prénom" autocomplete="given-name" value="' + esc(S.nom || "") + '">' +
      '<div class="tel"><select name="pays" aria-label="Pays">' + opts + '</select><input name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ton WhatsApp"></div>' +
      '<div class="note bad">Vérifie ton prénom et ton numéro 👆</div><button class="cta" type="submit">' + label + '</button><div class="note">🔒 Ton numéro reste privé</div></form>';
    var f = dock.querySelector("form");
    f.onsubmit = function (e) {
      e.preventDefault();
      var nom = f.nom.value.trim(), p = PAYS[+f.pays.value], d = f.tel.value.replace(/\D/g, "");
      if (p[2] && d.indexOf(p[2]) === 0 && p[3].indexOf(d.length) < 0) d = d.slice(p[2].length);
      var okN = /[a-zA-ZÀ-ÿ]{2,}/.test(nom), okT = p[3].indexOf(d.length) >= 0 && !/^(\d)\1+$/.test(d);
      f.nom.classList.toggle("err", !okN); f.tel.classList.toggle("err", !okT); f.querySelector(".bad").style.display = okN && okT ? "none" : "block";
      if (!okN || !okT) return;
      S.nom = nom.charAt(0).toUpperCase() + nom.slice(1); S.pays = p[1]; S.tel = (p[2] ? "+" + p[2] + " " : "") + d.replace(/(\d{2})(?=\d)/g, "$1 "); save();
      send({ type: "lead", step: "Numéro donné", nom: S.nom, tel: S.tel, prix: CFG.prix });
      px("Lead", { content_name: PROD, value: CFG.prix, currency: "XOF" });
      dock.innerHTML = ""; after();
    };
  }

  function n4() {
    hud(4); media(CFG.videos.cadeau);
    panel('<div class="trophy">🎁</div><div class="tag">Cadeau débloqué</div><b style="font-size:20px">Leçon 1 offerte</b>').style.justifyContent = "flex-start";
    say("Tu as débloqué un cadeau 🎁 Mets ton prénom et ton WhatsApp pour l'ouvrir.", function () {
      form("Ouvrir mon cadeau 🎁", function () { bravo("🎁", "Cadeau ouvert, " + esc(S.nom) + " !", 50, "", n5); });
    });
  }

  function n5() {
    hud(5);
    media.onPlay = function () { step("Extrait lancé"); px("LeconGratuite", {}, true); media.onPlay = null; };
    var v = media(CFG.lecon1, P_L1, "tap");
    var half = false; v.addEventListener("timeupdate", function () { if (!half && v.duration && v.currentTime / v.duration > .5) { half = true; step("Extrait vu"); } });
    say("Voici ta leçon 1 👇 Regarde-la, puis passe au niveau suivant.", function () {
      ask(["J'ai regardé ✓", { t: "Je la regarde plus tard", c: "soft" }], function (i) {
        v.pause(); bravo(i ? "👍" : "🔥", i ? "Ok, on continue !" : "Bravo, tu as fini ta 1re leçon !", 30, "", n6);
      });
    });
  }

  function n6() {
    hud(6);
    var v = media(CFG.presentation, P_PRES, "tap");
    say("Voici comment se passe la formation, en 1 minute 👇", function () {
      ask(["Compris ✓", { t: "Voir les 8 leçons", c: "soft" }], function choix(i) {
        v.pause();
        if (i === 1) {
          var p = panel("<b style=\"font-size:18px\">Les 8 leçons</b><ol>" + ["Bienvenue", "Les outils (ChatGPT, Google Flow, Claude)", "Écrire un script qui vend", "Créer ton personnage", "Le faire bouger et parler", "Le montage", "Gagner de l'argent", "La suite"]
            .map(function (l, k) { return '<li class="' + (k ? "lock" : "") + '"><span>' + (k ? "🔒" : "✓") + "</span>" + l + "</li>"; }).join("") + "</ol>");
          stage.classList.add("nosay");
          return ask(["Compris ✓"], function () { p.remove(); stage.classList.remove("nosay"); choix(0); });
        }
        bravo("🧠", "Tu sais tout !", 20, "Plus qu'un niveau 🏆", n7);
      });
    });
  }

  function n7() {
    hud(7); step("Offre vue"); px("OffreVue", {}, true); media(CFG.videos.offre);
    stage.classList.add("nosay");
    panel('<div class="line">Dernier niveau 🏆 Prends ta place !</div><div class="tag">Prix de lancement</div><div class="big">' + fmt(CFG.prix) + "</div><s>" + fmt(CFG.prixBarre) + "</s>" +
      "<ul><li>🎬 8 leçons + 1 exercice par leçon</li><li>✨ Gemini Pro offert (Google Flow)</li><li>💬 Groupe d'entraide WhatsApp</li><li>♾️ Accès à vie, sur ton téléphone</li></ul>");
    setTimeout(offreBoutons, 500);
  }
  function offreBoutons() {
    ask(["Je prends ma place 🏆", { t: "J'ai une question", c: "soft" }, { t: "J'hésite", c: "soft" }], function (i) {
      if (i === 0) return prendre();
      if (i === 1) return faq();
      hesite();
    });
  }

  var FAQ = [["Il faut un ordinateur ?", "Non, ton téléphone suffit 📱"], ["Google Flow est payant ?", "Gemini Pro est offert avec la formation, donc Google Flow aussi ✨"],
    ["Je ne suis pas au Burkina", "Pas de souci : c'est en ligne, tu paies par Mobile Money depuis ton pays 🌍"], ["Combien de temps ?", "8 leçons courtes, à ton rythme, accès à vie ♾️"]];
  function clearPanel() { stage.querySelectorAll(".panel").forEach(function (x) { x.remove(); }); stage.classList.remove("nosay"); }
  function faq() {
    step("Question"); clearPanel();
    say("Choisis ta question 👇", function () {
      ask(FAQ.map(function (q) { return { t: q[0], c: "" }; }).concat([{ t: "Écrire à Wilfried", c: "soft" }]), function (i) {
        if (i === FAQ.length) return waQ();
        say(FAQ[i][1], function () { ask(["Je prends ma place 🏆", { t: "Autre question", c: "soft" }], function (j) { j ? faq() : prendre(); }); });
      });
    });
  }
  function hesite() {
    step("Question"); clearPanel();
    say("Qu'est-ce qui te bloque ?", function () {
      ask([{ t: "Le prix", c: "" }, { t: "Le temps", c: "" }, { t: "Peur que ce soit dur", c: "" }], function (i) {
        S.frein = ["Prix", "Temps", "Difficulté"][i]; save();
        say(["7 500 F, c'est moins qu'un seul spot vendu. Et Gemini Pro est offert 😉", "Les leçons sont courtes, tu avances à ton rythme ⏱️", "Tout est montré pas à pas, et on t'aide dans le groupe WhatsApp 🤝"][i], function () {
          ask(["Ok, je prends ma place 🏆", { t: "Écrire à Wilfried", c: "soft" }], function (j) { j ? waQ() : prendre(); });
        });
      }, "");
    });
  }
  function waQ() {
    var url = "https://wa.me/" + CFG.wa + "?text=" + encodeURIComponent("Bonjour Wilfried, j'ai une question sur la formation vidéos IA" + (S.nom ? " (" + S.nom + ")" : "") + " : ");
    dock.innerHTML = '<a class="cta wa" href="' + url + '" target="_blank" rel="noopener">' + WAI + 'Écrire sur WhatsApp</a><button type="button" class="opt soft" id="wag-back">Revenir à l\'offre</button>';
    document.getElementById("wag-back").onclick = function () { n7(); };
  }

  function prendre() {
    if (!S.tel) { clearPanel(); say("Ton prénom et ton WhatsApp pour recevoir ton accès 👇"); return form("Valider ma place 🏆", fin); }
    fin();
  }
  /* Fin du jeu : trophée + paiement sur WhatsApp */
  function fin() {
    hud(NLV + 1); media(CFG.videos.bravo);
    bravo("🏆", "Niveau final atteint !", 40, "", function () {
      panel('<div class="trophy">🏆</div><b style="font-size:22px">Bravo ' + esc(S.nom) + " !</b><div class=\"badge\">Futur créateur IA · ⭐ " + S.xp + " XP</div>" +
        '<div style="font-size:14.5px;color:#DCEFE4;max-width:300px">Dernière étape : paie ' + fmt(CFG.prix) + " par Orange Money ou Moov, et reçois ton accès tout de suite.</div>");
      var t = "Bonjour Wilfried 👋 J'ai fini le parcours (" + S.xp + " XP) et je veux ma place pour la Formation Vidéos IA (" + fmt(CFG.prix) + "). Je m'appelle " + S.nom + (S.pays ? ", je suis au " + S.pays : "") +
        ". Mon objectif : " + ({ "Revenu": "gagner de l'argent", "Pub produits": "faire la pub de mes produits", "Contenu": "créer du contenu" }[S.but] || "apprendre les vidéos IA") + ". Comment je paie ?";
      dock.innerHTML = '<a class="cta wa" id="wag-pay" href="https://wa.me/' + CFG.wa + "?text=" + encodeURIComponent(t) + '" target="_blank" rel="noopener">' + WAI + "Payer " + fmt(CFG.prix) + ' sur WhatsApp</a><div class="note">WhatsApp s\'ouvre avec ton message prêt : appuie sur Envoyer.</div>';
      document.getElementById("wag-pay").onclick = function () {
        send({ type: "order", nom: S.nom, tel: S.tel, prix: CFG.prix });
        px("InitiateCheckout", { value: CFG.prix, currency: "XOF", num_items: 1, content_name: PROD });
        S.fini = true; save();
      };
    });
  }

  /* Quelqu'un qui revient : il reprend au bon niveau */
  function retour() {
    hud(S.fini ? NLV + 1 : 7); step("Arrivée"); media(CFG.videos.hello, P_TEASER);
    say("Re-bonjour " + esc(S.nom) + " 👋 Tu as " + S.xp + " XP. On termine le jeu ?", function () {
      ask(["Continuer 🏆", { t: "Revoir ma leçon gratuite", c: "soft" }], function (i) { i ? n5() : (S.fini ? fin() : n7()); });
    });
  }

  if (S.nom && S.tel) retour(); else { S.xp = 0; save(); n1(); }
})();
</script>
