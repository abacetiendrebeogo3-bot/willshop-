<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
#drb,#zoom{--bg:#F6F4EE;--ink:#13221A;--mut:#56655B;--green:#1C6B37;--soft:#E7F1E9;--line:#E3E0D7;--gold:#C9A227;--red:#B42335}
#drb *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body.drb-on{margin:0;height:100%;background:#E8E5DC;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}
#drb .app{max-width:440px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#drb header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:relative}
#drb header .who b{display:block;font-size:16px}
#drb header .who span{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
#drb .dot{width:8px;height:8px;border-radius:50%;background:#2DB55D;display:inline-block}
#drb .prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--green);transition:width .6s cubic-bezier(.2,.8,.2,1)}
#drb #chat{flex:1;overflow-y:auto;padding:18px 14px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
#drb .intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 0 10px}
#drb .intro b{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800}
#drb .intro span{font-size:13px;color:var(--mut)}
#drb .row{display:flex;align-items:flex-end;gap:8px;animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
#drb .row.me{justify-content:flex-end}
#drb .bub{max-width:78%;padding:11px 14px;border-radius:18px;font-size:16px;line-height:1.4;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
#drb .me .bub{background:var(--green);color:#fff;border:0;border-radius:18px;border-bottom-right-radius:6px}
#drb .av{flex:none;width:34px;height:34px}
#drb .typing{display:flex;gap:4px;padding:14px 16px}
#drb .typing i{width:7px;height:7px;border-radius:50%;background:#9AA59D;animation:blink 1s infinite}
#drb .typing i:nth-child(2){animation-delay:.15s}#drb .typing i:nth-child(3){animation-delay:.3s}
#drb .pcard{padding:0;overflow:hidden;width:78%}
#drb .pcard img{width:100%;height:170px;object-fit:cover;object-position:center 55%;display:block}
#drb .pcard div{padding:10px 14px}
#drb .price{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:var(--red)}
#drb #dock{padding:12px 14px 16px;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;min-height:20px}
#drb .opt{flex:1 1 40%;min-height:54px;border:1.5px solid var(--green);background:#fff;color:var(--green);border-radius:14px;font:700 16px 'DM Sans',sans-serif;cursor:pointer;padding:8px 12px;animation:rise .35s cubic-bezier(.2,.8,.2,1) both;transition:background .15s,transform .1s}
#drb .opt:hover{background:var(--soft)}#drb .opt:active{transform:scale(.97)}
#drb .opt.main{background:var(--green);color:#fff}
#drb .days .opt{flex:1 1 22%;font-size:14px;min-height:50px}
#drb .form{width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .4s both}
#drb .fld{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:500 16px 'DM Sans',sans-serif;background:#FBFAF7;color:var(--ink);outline:none}
#drb .fld:focus{border-color:var(--green);background:#fff}
#drb .qty{display:flex;gap:10px}
#drb .qbtn{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--ink);position:relative}
#drb .qbtn.sel{border-color:var(--green);background:var(--soft)}
#drb .qbtn b{display:block;font-size:14px}#drb .qbtn em{font-style:normal;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px}
#drb .tag{position:absolute;top:-9px;right:8px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
#drb .cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--green);color:#fff;font:700 17px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;animation:pulse 2.4s infinite}
#drb .small{font-size:11.5px;line-height:1.4;color:#7C877F;text-align:center;margin:0}
#drb .trust{display:flex;justify-content:center;gap:12px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(28,107,55,.4)}70%{box-shadow:0 0 0 12px rgba(28,107,55,0)}100%{box-shadow:0 0 0 0 rgba(28,107,55,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#drb .bob{animation:bob 3s ease-in-out infinite}
#drb .proof{padding:8px;width:84%;max-width:84%;display:flex;flex-direction:column;gap:6px}
#drb .proof img{width:100%;display:block;border-radius:10px;cursor:zoom-in}
#drb .proof .cap{font-size:12.5px;color:var(--mut);padding:2px 4px}
#drb .opt.ask{flex-basis:100%;background:transparent;border:1.5px dashed #B9C3BB;color:var(--mut);min-height:46px;font-size:15px}
#drb #dock.faq{gap:8px}#drb #dock.faq .opt{flex:1 1 44%;min-height:46px;font-size:13.5px;line-height:1.2;padding:6px 10px}
#drb #dock.faq .opt.ask{text-align:center}
#drb .qlink{background:none;border:0;color:var(--green);font:700 14px 'DM Sans',sans-serif;text-decoration:underline;cursor:pointer;padding:6px}
#zoom{position:fixed;inset:0;background:rgba(10,18,13,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;cursor:zoom-out}
#zoom img{max-width:100%;max-height:90vh;border-radius:12px}
#drb .mo{opacity:0;transform-origin:60px 67px}
#drb .talk .mo{opacity:1;animation:talk .17s ease-in-out infinite alternate}
#drb .talk .ms{opacity:0}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
#drb .snd{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
#drb .snd.on{background:var(--soft);border-color:var(--green);color:var(--green)}
#drb .hint{position:absolute;right:12px;top:100%;margin-top:8px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;padding:7px 11px;border-radius:10px;z-index:5;animation:rise .4s .8s both,bob 2s 1.2s ease-in-out infinite}
#drb .hint::before{content:"";position:absolute;right:16px;top:-5px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
#drb #dock{padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:72%;overflow-y:auto}
#drb header{padding-top:calc(12px + env(safe-area-inset-top))}
#drb .go{display:flex;flex-direction:column;gap:8px;width:100%}
#drb .go .cta{gap:10px}
#drb .go p{margin:0;text-align:center;font-size:13px;color:var(--mut)}
@media (max-width:360px){
#drb .bub{font-size:15px;max-width:84%}
#drb .pcard{width:84%}#drb .pcard img{height:140px}
#drb .opt{font-size:15px;min-height:50px}
#drb .days .opt{font-size:13px;padding:6px}
#drb .qbtn em{font-size:17px}
#drb .cta{font-size:16px}
}
@media (max-height:700px){
#drb .intro svg{width:84px;height:84px}
#drb .intro b{font-size:19px}
#drb .pcard img{height:130px}
}
@media (min-width:600px){
#drb{align-items:center}
#drb .app{height:min(880px,94vh);width:420px;border-radius:30px;box-shadow:0 30px 80px rgba(19,34,26,.18)}
}
#drb .eyes{transform-origin:60px 52px;animation:wink 4s infinite}
#drb{text-align:left}
#drb.on{position:fixed;inset:0;z-index:2147483000;background:#E8E5DC;display:flex;justify-content:center;font-family:'DM Sans',system-ui,sans-serif;color:#13221A}
#drb .app{width:100%}
body.drb-on{overflow:hidden}
#zoom{z-index:2147483001}
#drb .note{font-size:13.5px;line-height:1.5;color:var(--mut);background:var(--soft);border-radius:12px;padding:10px 12px}
</style>

var v = speechSynthesis.getVoices().filter(function (x) { return /^fr/i.test(x.lang); });

}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

if (!SOUND.on || !SOUND.ctx) return;
var c = SOUND.ctx, t = c.currentTime;
freqs.forEach(function (f, i) {
var o = c.createOscillator(), g = c.createGain();
o.type = "sine"; o.frequency.value = f;
g.gain.setValueAtTime(0.0001, t + i * dur);
g.gain.exponentialRampToValueAtTime(vol || 0.12, t + i * dur + 0.015);
g.gain.exponentialRampToValueAtTime(0.0001, t + (i + 1) * dur);
o.connect(g); g.connect(c.destination); o.start(t + i * dur); o.stop(t + (i + 1) * dur + 0.02);
});
}
function popSound() {}
function winSound() {}
function talk(on, row) {
document.getElementById("hav").classList.toggle("talk", on);
var intro = document.querySelector(".intro svg"); if (intro) intro.classList.toggle("talk", on);
if (row) { var a = row.querySelector(".av"); if (a) a.classList.toggle("talk", on); }
}
function speak(html, row, done) { return done();
var text = html.replace(/<[^>]+>/g, "").replace(/Dr /g, "Docteur ").replace(/(\d) (\d{3}) F\b/g, "$1$2 francs").replace(/…/g, "").replace(/ – /g, " à ");
SOUND.last = html;
if (!SOUND.on || !SOUND.unlocked || !("speechSynthesis" in window)) return done();
var finished = false;
function end() { if (finished) return; finished = true; talk(false, row); done(); }
var u = new SpeechSynthesisUtterance(text);
u.lang = "fr-FR"; if (SOUND.voice) u.voice = SOUND.voice;
u.pitch = 1.7; u.rate = 1.05;
u.onstart = function () { talk(true, row); };
u.onend = end; u.onerror = end;
speechSynthesis.cancel();
speechSynthesis.speak(u);
setTimeout(end, Math.min(9000, 1200 + text.length * 80));
}
var SPK_ON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
var SPK_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
function updSnd() {
var b = document.getElementById("snd");
var on = SOUND.on && SOUND.unlocked;
b.innerHTML = on ? SPK_ON : SPK_OFF;
b.classList.toggle("on", on);
b.setAttribute("aria-label", on ? "Couper le son" : "Activer le son");
}
function toggleSound() {
if (!SOUND.unlocked) { SOUND.on = true; unlock(); if (SOUND.last) speak(SOUND.last, null, function () {}); return; }
SOUND.on = !SOUND.on;
if (!SOUND.on && "speechSynthesis" in window) { speechSynthesis.cancel(); talk(false); }
updSnd();
}

var S = {};
var chat = document.getElementById("chat"), dock = document.getElementById("dock");

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function scroll() { [30, 400].forEach(function (ms) { setTimeout(function () { chat.scrollTop = chat.scrollHeight; }, ms); }); }
function prog(p) { document.getElementById("prog").style.width = p + "%"; }
function add(html) { var d = document.createElement("div"); d.innerHTML = html; var n = d.firstChild; chat.appendChild(n); scroll(); return n; }

function bot(list, done) {
list = [].concat(list);
(function next() {
if (!list.length) return done && done();
var m = list.shift();
if (m.now) { add('<div class="row">' + AV + (m.card || '<div class="bub">' + m.t + '</div>') + '</div>'); return next(); }
var t = add('<div class="row">' + AV + '<div class="bub typing"><i></i><i></i><i></i></div></div>');
setTimeout(function () {
t.remove();
popSound();
if (m.card) { add('<div class="row">' + AV + m.card + "</div>"); return setTimeout(next, 400); }
var row = add('<div class="row">' + AV + '<div class="bub">' + m + "</div></div>");
speak(m, row, function () { setTimeout(next, 250); });
}, 500);
})();
}
function me(text) { add('<div class="row me"><div class="bub">' + esc(text) + "</div></div>"); }
function ask(opts, cb, cls) {
dock.className = cls || "";
dock.innerHTML = "";
opts.forEach(function (o, i) {
var b = document.createElement("button");
b.className = "opt" + (/question/i.test(o) ? " ask" : (i === 0 && opts.length <= 3 && !cls ? " main" : ""));
b.style.animationDelay = (i * 0.05) + "s";
b.textContent = o;
b.onclick = function () { dock.innerHTML = ""; me(o); setTimeout(function () { cb(o); }, 250); };
dock.appendChild(b);
});
scroll();
}

var CARD = { card: '<div class="bub pcard"><img src="' + IMG + '" alt="Green Mask Stick au thé vert"><div><b>Green Mask Stick · 2 flacons</b><br><span style="font-size:14px;color:#56655B">Masque au thé vert · pores, points noirs, sébum</span><br><span class="price">3 500 F</span> <span style="font-size:13px;color:#56655B">les 2</span></div></div>' };

var WA_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.2z"/></svg>';
function px(ev, data, custom) {
try {
var f = window.fbq || (window.parent && window.parent.fbq);
if (f) f(custom ? "trackCustom" : "track", ev, data || {});
} catch (e) {}
}
var S = { qty: 1 };
var PRIX = { ouaga: [3500], ville: [4500] };
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " F"; }
function total() { return PRIX[S.zone][S.qty - 1]; }

/* Étape 1 */
function start() {
S = { qty: 1 };
track("Arrivée");
px("ViewContent", { content_name: "Green Mask Stick x2", value: 3500, currency: "XOF" });
chat.innerHTML = ""; dock.innerHTML = ""; prog(10);
bot([{ now: 1, card: CARD.card }, { now: 1, t: "Tu veux une peau plus nette ? Le Green Mask Stick au thé vert, 2 flacons à 3 500 F." }], function () {
ask(["Oui, je le veux", "J’ai une question"], function (a) {
if (/question/.test(a)) return other();
px("TunnelDemarre", {}, true);
track("Veut le produit", { veut: "Oui" });
phoneStep();
});
});
}

var PROD = "Green Mask Stick x2";
var SID = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function send(obj) {
try {
obj.sid = SID; obj.produit = obj.produit || PROD;
var d = JSON.stringify(obj);
if (!(navigator.sendBeacon && navigator.sendBeacon(SHEET, d))) fetch(SHEET, { method: "POST", mode: "no-cors", body: d, keepalive: true });
} catch (e) {}
}
function track(step, data) {
send({ type: "visit", step: step, veut: (data && data.veut) || "", zone: S.zone ? (S.zone === "ouaga" ? "Ouaga" : "Autre ville") : "", jour: S.day || "" });
}
function phoneStep() {
prog(30);
bot(["Super ! Je te réserve tes 2 Green Mask Stick à 3 500 F. C’est quoi ton numéro WhatsApp ?"], function () {
dock.className = "";
dock.innerHTML = '<div class="form"><input class="fld" id="ftel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Ton numéro (ex : 70 12 34 56)" aria-label="Ton numéro WhatsApp"><button class="cta" id="telok" onclick="telOk()">Continuer</button><div class="note" style="text-align:center">Juste pour organiser ta livraison.</div></div>';
var t = document.getElementById("ftel");
t.addEventListener("keydown", function (e) { if (e.key === "Enter") telOk(); });
t.addEventListener("focus", function () { setTimeout(function () { t.scrollIntoView({ block: "center" }); }, 300); });
scroll();
});
}
function telOk() {
var t = document.getElementById("ftel");
var v = t.value.replace(/[^0-9+ ]/g, "").trim();
if (v.replace(/[^0-9]/g, "").length < 8) { t.style.borderColor = "#B42335"; t.value = ""; t.placeholder = "Écris ton numéro ici (8 chiffres)"; t.focus(); return; }

dock.innerHTML = "";
me(v);
send({ type: "lead", step: "Numéro donné", tel: v, prix: 3500 });
px("Lead", { content_name: PROD });
setTimeout(zone, 250);
}

/* Étape 2 */
function zone() {
prog(45);
bot(["Super ! Tu es où ?"], function () {
ask(["À Ouaga", "Autre ville"], function (a) {
S.zone = a === "À Ouaga" ? "ouaga" : "ville";
px("VilleChoisie", { zone: S.zone }, true);
track("Ville");
jour();
});
});
}

/* Jour */
function jour() {
prog(62);
var q = S.zone === "ouaga" ? "Tu veux être livré(e) aujourd’hui ?" : "Tu veux qu’on l’expédie aujourd’hui ?";
bot([q], function () {
ask(["Oui", "Non"], function (a) {
if (a === "Oui") { S.day = "Aujourd’hui"; track("Jour"); return offre(); }
bot(["Ok ! Quel jour tu préfères ?"], function () {
ask(["Demain", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"], function (d) { S.day = d; track("Jour"); offre(); }, "days");
});
});
});
}

/* Étape 3 */
function offre() {
prog(80);
var ouaga = S.zone === "ouaga";
var msg = ouaga
? "Parfait, on te livre à Ouaga " + S.day.toLowerCase() + ". Tu paies à la livraison."
: "Pas de souci, on t’expédie tes 2 flacons dans ta ville " + S.day.toLowerCase() + ". L’expédition coûte <b>1 000 F</b>, et le paiement se fait <b>avant l’envoi</b> par Mobile Money.";

track("Offre vue");
bot([msg], function () {

'<div class="qbtn sel" style="cursor:default"><b>2 flacons Green Mask Stick</b><em>' + fmt(total()) + '</em></div>' +
'<div class="note">' + (ouaga
? "✓ Livraison gratuite dans Ouaga<br>Quartier éloigné : +1 000 F, on te confirme sur WhatsApp<br>✓ Tu paies à la livraison"
: "Prix avec l’expédition (1 000 F) inclus<br>Paiement avant l’envoi par Mobile Money<br>On t’envoie le numéro sur WhatsApp") + '</div>' +
'<input class="fld" id="flieu" placeholder="' + (ouaga ? "Ton quartier (ex : Pissy, Tampouy)" : "Ta ville (ex : Bobo, Koudougou)") + '" aria-label="Quartier ou ville">' +
'<button class="cta" id="go" onclick="order()">' + WA_ICON + '<span id="gotxt">Commander · ' + fmt(total()) + '</span></button>' +
'</div>';

}
function waOrder() {
var j = S.day.toLowerCase();
var t = S.zone === "ouaga"
? "Bonjour WillShop, je veux le Green Mask Stick (2 flacons, " + fmt(total()) + "), livraison " + j + ". Je suis à Ouaga. Mon quartier : " + S.lieu + ". Mon numéro : " + S.tel
: "Bonjour WillShop, je veux le Green Mask Stick (2 flacons, " + fmt(total()) + " avec l’expédition), envoi " + j + ". Je suis à " + S.lieu + ". Mon numéro : " + S.tel;

function goWA(url) { try { window.top.location.href = url; } catch (e) { window.location.href = url; } }
var SHEET = "https://script.google.com/macros/s/AKfycbxIaukPzsovSA39TKZa9FsETNUr4nGKl7N0KAHO2qWSqP1bmPygGyc98NEeLXJ06JEV/exec";
function logSheet() {
try {
var d = JSON.stringify({ type: "order", sid: SID, produit: "Green Mask Stick x2", qte: S.qty, prix: total(), zone: S.zone === "ouaga" ? "Ouaga" : "Autre ville", lieu: S.lieu, tel: S.tel, jour: S.day });
if (!(navigator.sendBeacon && navigator.sendBeacon(SHEET, d))) fetch(SHEET, { method: "POST", mode: "no-cors", body: d, keepalive: true });
} catch (e) {}
}
function order() {
var lieu = document.getElementById("flieu");
S.lieu = lieu.value.trim();
if (!S.lieu) { lieu.style.borderColor = "#B42335"; lieu.focus(); return; }
logSheet();
var url = waOrder();
px("InitiateCheckout", { value: total(), currency: "XOF", num_items: 2 });
me("2 flacons · " + fmt(total()));
add('<div class="row">' + AV + '<div class="bub">Merci ! Ta commande est enregistrée. WhatsApp s’ouvre : appuie juste sur <b>Envoyer</b> pour la confirmer.</div></div>');
