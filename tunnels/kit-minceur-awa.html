function unlock() {
if (SOUND.unlocked) return;
SOUND.unlocked = true;
document.getElementById("hint").style.display = "none";
try { SOUND.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
if ("speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
updSnd();
}

function tone(freqs, dur, vol) {
if (!SOUND.on || !SOUND.ctx) return;
var c = SOUND.ctx, t = c.currentTime;
freqs.forEach(function (f, i) {
var o = c.createOscillator(), g = c.createGain();
o.type = "sine"; o.frequency.value = f;
g.gain.setValueAtTime(0.0001, t + i * dur);
g.gain.exponentialRampToValueAtTime(vol || 0.12, t + i * dur + 0.015);
g.gain.exponentialRampToValueAtTime(0.0001, t + (i + 1) * dur);
o.connect(g); g.connect(c.destination); o.start(t + i * dur); o.stop(t + (i + 1) * dur + 0.02);
});
}
function popSound() {}
function winSound() {}
function talk(on, row) {

var intro = document.querySelector(".intro svg"); if (intro) intro.classList.toggle("talk", on);
if (row) { var a = row.querySelector(".av"); if (a) a.classList.toggle("talk", on); }
}
function speak(html, row, done) { return done();
var text = html.replace(/<[^>]+>/g, "").replace(/Dr /g, "Docteur ").replace(/(\d) (\d{3}) F\b/g, "$1$2 francs").replace(/…/g, "").replace(/ – /g, " à ");
SOUND.last = html;
if (!SOUND.on || !SOUND.unlocked || !("speechSynthesis" in window)) return done();
var finished = false;
function end() { if (finished) return; finished = true; talk(false, row); done(); }
var u = new SpeechSynthesisUtterance(text);
u.lang = "fr-FR"; if (SOUND.voice) u.voice = SOUND.voice;
u.pitch = 1.7; u.rate = 1.05;
u.onstart = function () { talk(true, row); };
u.onend = end; u.onerror = end;
speechSynthesis.cancel();
speechSynthesis.speak(u);
setTimeout(end, Math.min(9000, 1200 + text.length * 80));
}
var SPK_ON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
var SPK_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
function updSnd() {
var b = document.getElementById("snd");
var on = SOUND.on && SOUND.unlocked;
b.innerHTML = on ? SPK_ON : SPK_OFF;
b.classList.toggle("on", on);
b.setAttribute("aria-label", on ? "Couper le son" : "Activer le son");
}
function toggleSound() {
if (!SOUND.unlocked) { SOUND.on = true; unlock(); if (SOUND.last) speak(SOUND.last, null, function () {}); return; }
SOUND.on = !SOUND.on;
if (!SOUND.on && "speechSynthesis" in window) { speechSynthesis.cancel(); talk(false); }
updSnd();
}

var S = {};
var chat = document.getElementById("chat"), dock = document.getElementById("dock");
try { new MutationObserver(function () { document.getElementById("drb").classList.toggle("compact", !!dock.querySelector(".form, .qty")); }).observe(dock, { childList: true, subtree: true }); } catch (e) {}

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function scroll() { [30, 400].forEach(function (ms) { setTimeout(function () { chat.scrollTop = chat.scrollHeight; }, ms); }); }
function prog(p) { document.getElementById("prog").style.width = p + "%"; }
// Format « appel vidéo » : les messages d'Awa deviennent des sous-titres, les cartes s'affichent au-dessus des réponses
function add(html) {
  var subt = document.getElementById("subt"), stage = document.getElementById("stage");
  var d = document.createElement("div"); d.innerHTML = html; var n = d.firstChild;
  if (/class="row me"/.test(html)) { stage.innerHTML = ""; return n; }
  var card = n.querySelector && n.querySelector(".pcard, .tcard, .gal, img.shot");
  if (card) { stage.innerHTML = ""; stage.appendChild(n); n.querySelectorAll(".av").forEach(function (a) { a.remove(); }); return n; }
  var b = n.querySelector && n.querySelector(".bub");
  if (b) { if (/typing/.test(b.className)) subt.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>'; else subt.innerHTML = b.innerHTML; }
  return n;
}
// Compte à rebours jusqu'à minuit (promo du jour)
(function cd() {
  var now = new Date(), end = new Date(now); end.setHours(24, 0, 0, 0);
  var t = Math.max(0, Math.floor((end - now) / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), x = t % 60;
  var el = document.getElementById("cd"); if (el) el.textContent = [h, m, x].map(function (n) { return (n < 10 ? "0" : "") + n; }).join(":");
  setTimeout(cd, 1000);
})();


function bot(list, done) {
list = [].concat(list);
(function next() {
if (!list.length) return done && done();
var m = list.shift();
if (m.now) { add('<div class="row">' + AV + (m.card || '<div class="bub">' + m.t + '</div>') + '</div>'); return next(); }
var t = add('<div class="row">' + AV + '<div class="bub typing"><i></i><i></i><i></i></div></div>');
setTimeout(function () {
t.remove();
popSound();
if (m.card) { add('<div class="row">' + AV + m.card + "</div>"); return setTimeout(next, 400); }
var row = add('<div class="row">' + AV + '<div class="bub">' + m + "</div></div>");
speak(m, row, function () { setTimeout(next, 250); });
}, 500);
})();
}
function me(text) { add('<div class="row me"><div class="bub">' + esc(text) + "</div></div>"); }
function ask(opts, cb, cls) {
dock.className = cls || "";
dock.innerHTML = "";
opts.forEach(function (o, i) {
var b = document.createElement("button");
b.className = "opt" + (/question/i.test(o) ? " ask" : (i === 0 && opts.length <= 3 && !cls ? " main" : ""));
b.style.animationDelay = (i * 0.05) + "s";
b.textContent = o;
b.onclick = function () { dock.innerHTML = ""; me(o); setTimeout(function () { cb(o); }, 250); };
dock.appendChild(b);
});
scroll();
}

var CARD = { card: '<div class="bub pcard"><img src="' + IMG + '" alt="Kit Fit Tea 28 jours et gélules Slim Fit"><div><b>Kit Minceur 28 jours</b><br><span style="font-size:14px;color:#56655B">Thé le matin + gélule matin et soir</span><br><s style="color:#9AA39C">8 000 F</s> <span class="price">6 500 F</span><br><span style="color:#56655B;font-size:13px">+ 1 000 F de livraison</span></div></div>' };

var WA_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.2z"/></svg>';
function px(ev, data, custom) {
try {
var f = window.fbq || (window.parent && window.parent.fbq);
if (f) f(custom ? "trackCustom" : "track", ev, data || {});
} catch (e) {}
}
var S = { qty: 1 };
var PRIX = { ouaga: [7500, 11000], ville: [7500, 11000] }; // produit + 1 000 F de livraison partout
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " F"; }
function total() { return PRIX[S.zone][S.qty - 1]; }

/* Étape 1 */
function start() {
S = { qty: 1 };
track("Arrivée");
px("ViewContent", { content_name: "Kit Minceur 28 jours", value: 6500, currency: "XOF" });
chat.innerHTML = ""; dock.innerHTML = ""; prog(10);
bot([{ now: 1, card: CARD.card }, { now: 1, t: "Tu veux le kit minceur ?" }], function () {
ask(["Oui, je le veux", "J’ai une question"], function (a) {
if (/question/.test(a)) return other();
px("TunnelDemarre", {}, true);
track("Veut le produit", { veut: "Oui" });
phoneStep();
});
});
}

var PROD = "Kit Minceur";
var SID = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function send(obj) {
try {
obj.sid = SID; obj.produit = obj.produit || PROD;
var d = JSON.stringify(obj);
if (!(navigator.sendBeacon && navigator.sendBeacon(SHEET, d))) fetch(SHEET, { method: "POST", mode: "no-cors", body: d, keepalive: true });
} catch (e) {}
}
function track(step, data) {
send({ type: "visit", step: step, veut: (data && data.veut) || "", zone: S.zone ? (S.zone === "ouaga" ? "Ouaga" : "Autre ville") : "", jour: S.day || "" });
}
function phoneStep() {
prog(30);
bot(["Super ! Je te réserve ton Kit Minceur à 6 500 F (+ 1 000 F de livraison). C’est quoi ton numéro WhatsApp ?"], function () {
dock.className = "";
dock.innerHTML = '<div class="form"><input class="fld" id="ftel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Ton numéro (ex : 70 12 34 56)" aria-label="Ton numéro WhatsApp"><button class="cta" id="telok" onclick="telOk()">Continuer</button><div class="note" style="text-align:center">Juste pour organiser ta livraison.</div></div>';
var t = document.getElementById("ftel");
t.addEventListener("keydown", function (e) { if (e.key === "Enter") telOk(); });
t.addEventListener("focus", function () { setTimeout(function () { t.scrollIntoView({ block: "center" }); }, 300); });
scroll();
});
}
function telOk() {
var t = document.getElementById("ftel");
var v = t.value.replace(/[^0-9+ ]/g, "").trim();
if (v.replace(/[^0-9]/g, "").length < 8) { t.style.borderColor = "#B42335"; t.value = ""; t.placeholder = "Écris ton numéro ici (8 chiffres)"; t.focus(); return; }
S.tel = v;
dock.innerHTML = "";
me(v);
send({ type: "lead", step: "Numéro donné", tel: v, prix: 7500 });
px("Lead", { content_name: PROD });
setTimeout(zone, 250);
}

/* Étape 2 */
function zone() {
prog(45);
bot(["Super ! Tu es où ?"], function () {
ask(["À Ouaga", "Autre ville"], function (a) {
S.zone = a === "À Ouaga" ? "ouaga" : "ville";
px("VilleChoisie", { zone: S.zone }, true);
track("Ville");
lieuStep();
});
});
}

/* Quartier ou ville, tout de suite */
function lieuStep() {
var ouaga = S.zone === "ouaga";
bot([ouaga ? "Tu es dans quel quartier de Ouaga ?" : "Tu es dans quelle ville ?"], function () {
dock.className = "";
dock.innerHTML = '<div class="form"><input class="fld" id="flieu" placeholder="' + (ouaga ? "Ton quartier (ex : Pissy, Tampouy)" : "Ta ville (ex : Bobo, Koudougou)") + '" aria-label="' + (ouaga ? "Ton quartier" : "Ta ville") + '"><button class="cta" id="lieuok">Continuer</button></div>';
var f = document.getElementById("flieu");
function ok() { var v = f.value.trim(); if (v.length < 2) { f.style.borderColor = "#B42335"; f.focus(); return; } S.lieu = v; dock.innerHTML = ""; me(v); track("Quartier"); setTimeout(jour, 250); }
document.getElementById("lieuok").onclick = ok;
f.addEventListener("keydown", function (e) { if (e.key === "Enter") ok(); });
scroll();
});
}

/* Jour */
function jour() {
prog(62);
var q = S.zone === "ouaga" ? "Tu veux être livré(e) aujourd’hui ?" : "Tu veux qu’on l’expédie aujourd’hui ?";
bot([q], function () {
ask(["Oui", "Non"], function (a) {
if (a === "Oui") { S.day = "Aujourd’hui"; track("Jour"); return offre(); }
bot(["Ok ! Quel jour tu préfères ?"], function () {
ask(["Demain", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"], function (d) { S.day = d; track("Jour"); offre(); }, "days");
});
});
});
}

/* Étape 3 */
function offre() {
prog(80);
var ouaga = S.zone === "ouaga";
var msg = ouaga
? "Parfait, on te livre à " + esc(S.lieu) + " " + S.day.toLowerCase() + ". La livraison coûte <b>1 000 F</b>, et tu paies à la livraison."
: "Pas de souci, on t’expédie le kit à " + esc(S.lieu) + " " + S.day.toLowerCase() + ". L’expédition coûte <b>1 000 F</b>, et le paiement se fait <b>avant l’envoi</b> par Mobile Money.";
px("OffreVue", { zone: S.zone }, true);
track("Offre vue");
bot([msg, "Combien de kits tu veux ?"], function () {
dock.className = "";
var p = PRIX[S.zone];
dock.innerHTML = '<div class="form">' +
'<div class="qty">' +
'<button class="qbtn sel" id="q1" onclick="setQty(1)"><b>1 kit</b><em>' + fmt(p[0] - 1000) + '</em><small>+ 1 000 F livraison</small></button>' +
'<button class="qbtn" id="q2" onclick="setQty(2)"><span class="tag">−3 000 F</span><b>2 kits</b><em>' + fmt(p[1] - 1000) + '</em><small>+ 1 000 F livraison</small></button>' +
'</div>' +
'<div class="note">' + (ouaga
? "✓ Tu paies à la livraison<br>⏳ Prix promo valable jusqu'à minuit"
: "Paiement avant l’envoi par Mobile Money<br>On t’envoie le numéro sur WhatsApp") + '</div>' +
'<div class="recu" id="recu">' + recu() + '</div>' +
'<button class="cta" id="go" onclick="order()">' + WA_ICON + '<span id="gotxt">Commander · ' + fmt(total()) + '</span></button>' +
'</div>';
scroll();
});
}
function setQty(n) {
S.qty = n;
document.getElementById("q1").className = "qbtn" + (n === 1 ? " sel" : "");
document.getElementById("q2").className = "qbtn" + (n === 2 ? " sel" : "");
document.getElementById("gotxt").textContent = "Commander · " + fmt(total());
document.getElementById("recu").innerHTML = recu();
}
function recu() {
var liv = 1000, prod = total() - liv;
return '<div><span>' + (S.qty > 1 ? S.qty + ' Kits Minceur' : '1 Kit Minceur') + '</span><span>' + fmt(prod) + '</span></div>' +
'<div><span>' + (S.zone === "ouaga" ? "Livraison à " : "Expédition à ") + esc(S.lieu) + '</span><span>+ ' + fmt(liv) + '</span></div>' +
'<div class="tot"><span>Total à payer</span><span>' + fmt(total()) + '</span></div>';
}
function waOrder() {
var j = S.day.toLowerCase();
var t = S.zone === "ouaga"
? "Bonjour WillShop, je veux " + S.qty + " Kit Minceur (" + fmt(total()) + " avec la livraison), livraison " + j + ". Je suis à Ouaga. Mon quartier : " + S.lieu + ". Mon numéro : " + S.tel
: "Bonjour WillShop, je veux " + S.qty + " Kit Minceur (" + fmt(total()) + " avec l’expédition), envoi " + j + ". Je suis à " + S.lieu + ". Mon numéro : " + S.tel;
return "https://api.whatsapp.com/send?phone=" + WA + "&text=" + encodeURIComponent(t);
}
function goWA(url) { try { window.top.location.href = url; } catch (e) { window.location.href = url; } }
var SHEET = "https://script.google.com/macros/s/AKfycbxIaukPzsovSA39TKZa9FsETNUr4nGKl7N0KAHO2qWSqP1bmPygGyc98NEeLXJ06JEV/exec";
function logSheet() {
try {
var d = JSON.stringify({ type: "order", sid: SID, produit: "Kit Minceur", qte: S.qty, prix: total(), zone: S.zone === "ouaga" ? "Ouaga" : "Autre ville", lieu: S.lieu, tel: S.tel, jour: S.day });
if (!(navigator.sendBeacon && navigator.sendBeacon(SHEET, d))) fetch(SHEET, { method: "POST", mode: "no-cors", body: d, keepalive: true });
} catch (e) {}
}
function order() {
if (!S.lieu) return lieuStep();
logSheet();
var url = waOrder();
px("InitiateCheckout", { value: total(), currency: "XOF", num_items: S.qty });
me(S.qty + " kit" + (S.qty > 1 ? "s" : "") + " · " + fmt(total()));
add('<div class="row">' + AV + '<div class="bub">Merci ! Ta commande est enregistrée. WhatsApp s’ouvre : appuie juste sur <b>Envoyer</b> pour la confirmer.</div></div>');
prog(100);
dock.innerHTML = '<div class="go"><a class="cta" href="' + url + '" target="_top" rel="noopener">' + WA_ICON + 'Ouvrir WhatsApp</a><p>WhatsApp ne s’est pas ouvert ? Touche le bouton vert.</p></div>';
scroll();
setTimeout(function () { goWA(url); }, 250);
}
function other() {
px("Contact");
track("Question", { veut: "Question" });
var url = "https://api.whatsapp.com/send?phone=" + WA + "&text=" + encodeURIComponent("Bonjour Awa, j’ai une question sur le Kit Minceur : ");
bot(["Écris-moi ta question sur WhatsApp, je te réponds vite."], function () {
dock.className = "";
dock.innerHTML = '<div class="go"><a class="cta" href="' + url + '" target="_top" rel="noopener">' + WA_ICON + 'Poser ma question</a><button class="qlink" onclick="start()">Revenir à la commande</button></div>';
scroll();
});
}

document.getElementById("drb").classList.add("on");document.body.classList.add("drb-on");
start();
</script>
