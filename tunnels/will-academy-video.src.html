(function () {

  /* ---------- Chat ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " F"; }
  function prog(p) { document.getElementById("wat-prog").style.width = p + "%"; }
  function down() { [20, 350, 900].forEach(function (ms) { setTimeout(function () { chat.scrollTop = chat.scrollHeight; }, ms); }); }
  var lastWho = "";
  function add(html, who) {
    var d = document.createElement("div");
    d.className = "row" + (who === "me" ? " me" : "") + (who !== "me" && lastWho === "bot" ? " cont" : "");
    d.innerHTML = (who === "me" ? "" : '<img class="av" src="' + AV + '" alt="">') + html;
    list.appendChild(d); lastWho = who === "me" ? "me" : "bot"; down(); return d;
  }
  function typing(done) {
    var t = add('<div class="bub typing"><i></i><i></i><i></i></div>', "bot");
    setTimeout(function () { t.remove(); lastWho = list.lastElementChild && list.lastElementChild.classList.contains("me") ? "me" : (list.lastElementChild ? "bot" : ""); done(); }, 600);
  }
  function text(html, done) { typing(function () { add('<div class="bub">' + html + "</div>", "bot"); setTimeout(function () { done && done(); }, 250); }); }

    });

  }
  var WAI = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.2z"/></svg>';
  var PLAY = '<svg viewBox="0 0 24 24" fill="#06301F"><path d="M8 5v14l11-7z"/></svg>';

  /* Sadia parle en vidéo. Avant le 1er clic : sans le son (règle des navigateurs). Après : avec le son, toute seule.
     opts.lesson = vidéo à lancer soi-même (leçon gratuite). done() est appelé à la fin de la vidéo (ou tout de suite si elle ne se lance pas). */
  function sadia(clip, done, opts) {
    opts = opts || {};
    typing(function () {
      var el = add('<div class="card"><div class="vid' + (clip.tall ? " tall" : "") + '"><video playsinline preload="auto" poster="' + clip.poster + '" src="' + clip.src + '"></video></div></div>', "bot");
      var v = el.querySelector("video"), box = el.querySelector(".vid"), finished = false;

        box.querySelector(".play").onclick = function () { this.remove(); v.controls = true; v.play().catch(function () {}); opts.onStart && opts.onStart(); };
        var half = false; v.addEventListener("timeupdate", function () { if (!half && v.duration && v.currentTime / v.duration > .5) { half = true; opts.onHalf && opts.onHalf(); } });

  function contactForm(label, after) {

      '<div class="msg">Vérifie ton prénom et ton numéro 👆</div><button class="cta" type="submit">' + label + '</button><div class="safe">🔒 Ton numéro reste privé. Pas de spam.</div></form></div>';
    var f = dock.querySelector("form"); down();
    f.onsubmit = function (e) {
      e.preventDefault(); unlocked = true;
      var nom = f.nom.value.trim(), p = PAYS[+f.pays.value], d = f.tel.value.replace(/\D/g, "");
      if (p[2] && d.indexOf(p[2]) === 0 && p[3].indexOf(d.length) < 0) d = d.slice(p[2].length);
      var okN = /[a-zA-ZÀ-ÿ]{2,}/.test(nom), okT = p[3].indexOf(d.length) >= 0 && !/^(\d)\1+$/.test(d);
      f.nom.classList.toggle("err", !okN); f.tel.classList.toggle("err", !okT); f.querySelector(".msg").style.display = okN && okT ? "none" : "block";
      if (!okN || !okT) return;
      S.nom = nom.charAt(0).toUpperCase() + nom.slice(1); S.pays = p[1]; S.tel = (p[2] ? "+" + p[2] + " " : "") + d.replace(/(\d{2})(?=\d)/g, "$1 "); save();
      send({ type: "lead", step: "Numéro donné", nom: S.nom, tel: S.tel, prix: CFG.prix });
      px("Lead", { content_name: PROD, value: CFG.prix, currency: "XOF" });
      clear(); me(S.nom + " · " + S.tel); setTimeout(after, 300);
    };
  }

  function plateforme() {
    prog(52);
    sadia2(CFG.plateforme, CFG.accompagnement, function () {
      card('<div class="pad"><h4>Ta formation</h4><div class="steps4">' +
        "<div><em>📱</em><span>Sur ton <b>téléphone</b>, quand tu veux</span></div><div><em>🎬</em><span><b>8 vidéos courtes</b>, pas à pas</span></div>" +
        "<div><em>✍️</em><span>Un <b>exercice</b> après chaque vidéo</span></div><div><em>♾️</em><span>Accès <b>à vie</b></span></div>" +
        "<div><em>💬</em><span>Le <b>groupe WhatsApp</b> pour t'aider</span></div><div><em>✨</em><span><b>Gemini Pro offert</b> (Google Flow)</span></div></div></div>", function () {
        ask(["Oui, montre-moi la leçon 🎁"], lecon);
      });
    });
  }

  function lecon() {
    prog(66);
    sadia(CFG.voilaLecon, function () {
      sadia(CFG.lecon1, function () {
        setTimeout(function () { ask(["J'ai regardé ✓", { t: "Je la regarde plus tard", c: "soft" }], offre); }, 900);
      }, { lesson: true, onStart: function () { step("Extrait lancé"); px("LeconGratuite", {}, true); }, onHalf: function () { step("Extrait vu"); } });
    });
  }

  function offre() {
    prog(82); step("Offre vue"); px("OffreVue", {}, true);
    sadia(CFG.offre, function () {
      card('<div class="pad"><span class="tag">Prix de lancement</span><div class="price"><b>' + fmt(CFG.prix) + "</b><s>" + fmt(CFG.prixBarre) + '</s></div><div class="bonus">' +
        "<div>🎬 8 vidéos + exercices</div><div>✨ Gemini Pro offert</div><div>💬 Groupe d'entraide WhatsApp</div><div>♾️ Accès à vie</div></div></div>", function () {
        ask([{ t: "Oui, je prends ma place ✅", c: "main" }, { t: "Je réfléchis", c: "soft" }], function (i) { i ? reflechit() : whatsapp(); });
      });
    });
  }

  function reflechit() {
    step("Question");
    text("Pas de souci 🙂 Pose ta question directement à Wilfried, il te répond sur WhatsApp 👇", function () {
      var url = "https://wa.me/" + CFG.wa + "?text=" + encodeURIComponent("Bonjour Wilfried, j'ai une question sur la formation vidéos IA" + (S.nom ? " (" + S.nom + ")" : "") + " : ");
      dock.innerHTML = '<div class="in"><a class="cta wa" href="' + url + '" target="_blank" rel="noopener">' + WAI + 'Poser ma question sur WhatsApp</a><button type="button" class="link" id="wat-back">Finalement, je prends ma place</button></div>';
      document.getElementById("wat-back").onclick = function () { clear(); me("Je prends ma place"); whatsapp(); }; down();
    });
  }

  function whatsapp() {
    prog(96);
    sadia(CFG.whatsapp, function () {
      var t = "Bonjour Wilfried 👋 Je veux ma place pour la Formation Vidéos IA (" + fmt(CFG.prix) + "). Je m'appelle " + S.nom + (S.pays ? ", je suis au " + S.pays : "") + ". Mon objectif : " +
        ({ "Revenu": "gagner de l'argent", "Pub produits": "faire la pub de mes produits", "Contenu": "créer du contenu" }[S.but] || "apprendre les vidéos IA") + ". Comment je paie ?";
      dock.innerHTML = '<div class="in"><a class="cta wa" id="wat-pay" href="https://wa.me/' + CFG.wa + "?text=" + encodeURIComponent(t) + '" target="_blank" rel="noopener">' + WAI + "Rejoindre Wilfried sur WhatsApp</a>" +
        '<div class="safe">Ton message est prêt : appuie sur <b>Envoyer</b>.<br>Paiement Orange Money ou Moov · tu es ajouté(e) à la formation et au groupe.</div></div>';
      document.getElementById("wat-pay").onclick = function () {
        send({ type: "order", nom: S.nom, tel: S.tel, prix: CFG.prix });
        px("InitiateCheckout", { value: CFG.prix, currency: "XOF", num_items: 1, content_name: PROD });
        S.fini = true; save();
      };
      down();
    });
  }

  /* Quelqu'un qui revient : pas de questions répétées */
  function retour() {
    prog(75); step("Arrivée");
    text("Re-bonjour " + esc(S.nom) + " 👋 Content(e) de te revoir ! On reprend ?", function () {
      ask([{ t: S.fini ? "Rejoindre Wilfried sur WhatsApp" : "Voir l'offre", c: "main" }, { t: "Revoir ma leçon gratuite", c: "" }], function (i) { i ? lecon() : (S.fini ? whatsapp() : offre()); });
    });
  }

  if (S.nom && S.tel) retour(); else start();
})();
</script>
