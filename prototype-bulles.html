<title>WillShop Bulles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : téléphone = bulles d'étapes en grille puis liste de cartes ; ordinateur (≥900px) = étapes en colonne à gauche, cartes à droite. Toucher une carte ouvre une feuille d'actions. Palette WillShop : bordeaux, or, crème. */
:root{
  --bg:#FBF8F4; --surface:#FFFFFF; --sunk:#F3EEE7; --ink:#1F1917; --mut:#6B625B; --faint:#A0958C; --line:#ECE6DC;
  --bx:#800020; --bx-soft:#F5E6E9; --on-bx:#FFF8EC; --gold:#9A7220; --gold-fill:#D4A843; --gold-soft:#FDF5E2;
  --red:#C0362C; --red-soft:#FBE8E6; --green:#2E7D4F; --green-soft:#E3F1E8; --orange:#C46A12; --orange-soft:#FCEEDD;
  --amber:#9A7220; --amber-soft:#FBF1D9; --blue:#3F5C7A; --blue-soft:#E6EDF4; --grey:#6B625B; --grey-soft:#EEEAE5;
  --shadow:0 2px 10px rgba(60,30,20,.07); --shadow-lg:0 18px 50px rgba(40,10,10,.22); --scrim:rgba(20,10,8,.45);
  --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14100F; --surface:#1F1816; --sunk:#29201D; --ink:#F3ECE4; --mut:#ACA096; --faint:#7D726A; --line:#362B27;
  --bx:#E89AA8; --bx-soft:#3A1B22; --on-bx:#2A0A12; --gold:#E2BC62; --gold-fill:#D4A843; --gold-soft:#2C2416;
  --red:#F2908A; --red-soft:#3A1C1A; --green:#74C595; --green-soft:#16291E; --orange:#F0A35A; --orange-soft:#33220F;
  --amber:#E2BC62; --amber-soft:#2E2512; --blue:#9DB8D6; --blue-soft:#1B2530; --grey:#B5AAA0; --grey-soft:#2A2421;
  --shadow:0 2px 10px rgba(0,0,0,.3); --shadow-lg:0 18px 50px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14100F; --surface:#1F1816; --sunk:#29201D; --ink:#F3ECE4; --mut:#ACA096; --faint:#7D726A; --line:#362B27;
  --bx:#E89AA8; --bx-soft:#3A1B22; --on-bx:#2A0A12; --gold:#E2BC62; --gold-fill:#D4A843; --gold-soft:#2C2416;
  --red:#F2908A; --red-soft:#3A1C1A; --green:#74C595; --green-soft:#16291E; --orange:#F0A35A; --orange-soft:#33220F;
  --amber:#E2BC62; --amber-soft:#2E2512; --blue:#9DB8D6; --blue-soft:#1B2530; --grey:#B5AAA0; --grey-soft:#2A2421;
  --shadow:0 2px 10px rgba(0,0,0,.3); --shadow-lg:0 18px 50px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:is(button,a):focus-visible{outline:2px solid var(--gold-fill);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 12px}
.brand{font:800 22px/1 var(--serif);color:var(--bx)}
.proto{font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);padding:6px 9px;border-radius:99px}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bx);color:var(--on-bx);font:700 14px var(--sans);flex:none}

.hello{display:flex;align-items:center;gap:16px;margin:8px 0 18px}
.hello h1{font:700 26px/1.15 var(--serif);margin:0;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--mut)}
.ring{width:64px;height:64px;flex:none;position:relative;margin-left:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--line)} .ring .pr{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 14px var(--sans);font-variant-numeric:tabular-nums}

.layout{display:grid;gap:22px}
@media (min-width:900px){.layout{grid-template-columns:320px minmax(0,1fr);align-items:start}.steps{position:sticky;top:76px;grid-template-columns:1fr!important}}

/* Bulles d'étapes */
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px) and (max-width:899px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{--c:var(--grey);--s:var(--grey-soft);text-align:left;border:1.5px solid transparent;background:var(--s);border-radius:20px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-height:76px;transition:transform .15s,border-color .2s,box-shadow .2s}
.step:active{transform:scale(.97)}
.step .ic{width:40px;height:40px;border-radius:13px;background:var(--surface);color:var(--c);display:grid;place-items:center}
.step .ic svg{width:21px;height:21px}
.step .l{font-weight:600;font-size:14px;line-height:1.2;min-width:0}
.step .n{font:700 24px/1 var(--sans);color:var(--c);font-variant-numeric:tabular-nums}
.step.zero{opacity:.55}
.step[aria-pressed="true"]{border-color:var(--c);background:var(--surface);box-shadow:var(--shadow)}
.step.bump .n{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.35)}}

/* Liste de cartes */
.ghead{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.ghead h2{font:700 21px/1.2 var(--serif);margin:0}
.ghead span{color:var(--mut);font-size:14px}
.ghint{color:var(--mut);margin:0 0 14px;font-size:14px}
.cards{display:grid;gap:10px}
@media (min-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{--c:var(--grey);width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;box-shadow:var(--shadow);transition:transform .15s,box-shadow .2s;animation:pop .35s both}
.card:hover{box-shadow:0 6px 18px rgba(60,30,20,.1)}
.card:active{transform:scale(.98)}
.card .pic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--s);color:var(--c);font:700 16px var(--sans)}
.card .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .d{color:var(--mut);font-size:13.5px;margin-top:1px}
.card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.card .r{text-align:right;display:grid;gap:6px;justify-items:end}
.card .p{font-weight:700;font-variant-numeric:tabular-nums}
.chev{color:var(--faint)}
.leave{animation:leave .45s forwards}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes leave{to{opacity:0;transform:translateX(60px) scale(.95);height:0;padding-block:0;margin:0;border-width:0}}
.tag{font:600 11.5px/1 var(--sans);padding:5px 8px;border-radius:99px;background:var(--sunk);color:var(--mut)}
.tag.vip{background:var(--gold-soft);color:var(--gold)} .tag.fid{background:var(--green-soft);color:var(--green)}
.tag.hes{background:var(--orange-soft);color:var(--orange)} .tag.stop{background:var(--red-soft);color:var(--red)}
.tag.new{background:var(--blue-soft);color:var(--blue)} .tag.vite{background:var(--bx-soft);color:var(--bx)}
.badge{font:700 11px/1 var(--sans);padding:5px 8px;border-radius:99px;background:var(--s);color:var(--c)}
.empty{border:1.5px dashed var(--line);border-radius:20px;padding:34px 18px;text-align:center;color:var(--mut)}
.empty b{display:block;font:700 19px var(--serif);color:var(--ink);margin-bottom:4px}

.g-red{--c:var(--red);--s:var(--red-soft)} .g-green{--c:var(--green);--s:var(--green-soft)} .g-orange{--c:var(--orange);--s:var(--orange-soft)}
.g-amber{--c:var(--amber);--s:var(--amber-soft)} .g-blue{--c:var(--blue);--s:var(--blue-soft)} .g-grey{--c:var(--grey);--s:var(--grey-soft)}

/* Feuille d'actions */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:50%;width:520px;border-radius:26px;transform:translate(-50%,58%) scale(.96);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .2s;padding:12px 24px 24px}
  .sheet.on{transform:translate(-50%,50%);opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;gap:12px;align-items:center}
.sh-top .pic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--s);color:var(--c);font:700 19px var(--sans);flex:none}
.sh-top h3{margin:0;font:700 22px/1.15 var(--serif)}
.sh-top p{margin:2px 0 0;color:var(--mut);font-size:14px}
.x{margin-left:auto;align-self:flex-start;border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.next{margin:16px 0 14px;border-radius:18px;background:var(--s);padding:14px;display:grid;gap:10px}
.next small{font:700 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.next .q{font-weight:600}
.big{border:0;border-radius:16px;padding:15px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:var(--surface);transition:transform .12s}
.big:active{transform:scale(.97)}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 4px 10px;display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);transition:transform .12s,background .15s;animation:pop .3s both}
.act:active{transform:scale(.94)}
.act .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.act .ic svg{width:21px;height:21px}
.a-wa .ic{background:var(--green-soft);color:var(--green)} .a-call .ic{background:var(--blue-soft);color:var(--blue)}
.a-info .ic{background:var(--sunk);color:var(--ink)} .a-tag .ic{background:var(--gold-soft);color:var(--gold)}
.a-drv .ic{background:var(--blue-soft);color:var(--blue)} .a-pay .ic{background:var(--green-soft);color:var(--green)}
.a-day .ic{background:var(--orange-soft);color:var(--orange)} .a-no .ic{background:var(--red-soft);color:var(--red)}
.sub{animation:pop .25s both}
.back{border:0;background:none;color:var(--bx);font-weight:600;padding:0;margin:14px 0 10px;display:flex;align-items:center;gap:4px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:14px;white-space:pre-wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;font-weight:600;text-align:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--surface)}
.facts{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fact{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact span{color:var(--mut)} .fact b{text-align:right;font-variant-numeric:tabular-nums}
.hist{margin-top:10px;display:grid;gap:8px}
.hist div{display:flex;justify-content:space-between;font-size:14px;padding:10px 14px;background:var(--sunk);border-radius:12px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:10px 15px;font-weight:600;transition:transform .12s}
.choice:active{transform:scale(.95)}
.choice[aria-pressed="true"]{border-color:var(--bx);background:var(--bx-soft);color:var(--bx)}
.phone{font-variant-numeric:tabular-nums;user-select:all}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.3s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav button{border:0;background:none;display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);padding:6px 18px;border-radius:14px}
nav button svg{width:22px;height:22px}
nav button[aria-current="true"]{color:var(--bx);background:var(--bx-soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="brand">WillShop</span><span class="proto">Prototype</span>
    <div class="me"><span>Yasmine</span><span class="av">Y</span></div>
  </header>
  <section class="hello">
    <div><h1 id="hi">Bonsoir Yasmine</h1><p id="hiSub">Exemple avec de fausses commandes.</p></div>
    <div class="ring" aria-label="Progression du jour"><svg viewBox="0 0 64 64"><circle class="tr" cx="32" cy="32" r="27"/><circle class="pr" id="ringPr" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg><b id="ringTxt">0/0</b></div>
  </section>
  <div class="layout">
    <div class="steps" id="steps"></div>
    <main id="list" aria-live="polite"></main>
  </div>
</div>

<nav>
  <button data-nav><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Ma journée</button>
  <button data-nav aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Commandes</button>
  <button data-nav><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.8-3.5 3.2-5 6-5s5.2 1.5 6 5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 15c1.6.6 2.6 2.2 3 5"/></svg>Clients</button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
const S = (p, w = 1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  call: S('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
  wa: S('<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/>', 1.6),
  info: S('<circle cx="12" cy="8" r="3.5"/><path d="M5 21c.8-4 3.6-6 7-6s6.2 2 7 6"/>'),
  tag: S('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/>'),
  drv: S('<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>'),
  pay: S('<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'),
  day: S('<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
  no: S('<circle cx="12" cy="12" r="9"/><path d="M8 8l8 8M16 8l-8 8"/>'),
  check: S('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2.4),
  bell: S('<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
  flame: S('<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.5 1 2.5 2 2.5-.5-3 0-5.5 1-8z"/>'),
  moon: S('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
  alert: S('<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'),
  x: S('<path d="M6 6l12 12M18 6L6 18"/>', 2.2),
  chev: S('<path d="M9 6l6 6-6 6"/>', 2.2),
  left: S('<path d="M15 6l-6 6 6 6"/>', 2.2)
};
const GROUPS = [
  { k: "call", c: "red", ic: "bell", t: "À confirmer", h: "Nouvelles commandes. Touche une bulle, puis « Confirmer »." },
  { k: "jour", c: "green", ic: "drv", t: "À livrer aujourd'hui", h: "Préviens le client que la livraison arrive." },
  { k: "relance", c: "orange", ic: "wa", t: "À relancer", h: "Le message est déjà écrit. Tu n'as qu'à l'envoyer." },
  { k: "hot", c: "amber", ic: "flame", t: "Prospects chauds", h: "Ils ont laissé leur numéro sans finir. Un petit message suffit." },
  { k: "veille", c: "blue", ic: "moon", t: "Livraisons de demain", h: "Rappelle-leur que c'est demain." },
  { k: "problem", c: "grey", ic: "alert", t: "Injoignables", h: "Propose un nouveau jour de livraison." }
];
const NEXT = {
  call: { q: "Appelle ou écris pour confirmer la commande.", b: "Commande confirmée" },
  jour: { q: "Préviens le client que le livreur arrive aujourd'hui.", b: "Client prévenu" },
  relance: { q: "Envoie la relance déjà écrite.", b: "Relance envoyée" },
  hot: { q: "Envoie un petit message pour finir la commande.", b: "Il veut commander" },
  veille: { q: "Rappelle-lui que la livraison est demain.", b: "Rappel envoyé" },
  problem: { q: "Propose-lui un nouveau jour.", b: "Nouveau jour choisi" }
};
const MSG = {
  call: "Bonjour 👋 c'est WillShop. Merci pour ta commande de {p} ({x}). On te livre {j} à {l}, c'est bien ça ?",
  jour: "Bonjour 👋 c'est WillShop. Ton {p} arrive aujourd'hui à {l}. Le livreur t'appelle avant de passer 🛵",
  relance: "Bonjour ! Nos clientes sont contentes de leur {p} 😊 Ta commande t'attend toujours. Tu veux qu'on passe aujourd'hui ?",
  hot: "Bonjour 👋 c'est WillShop. Tu as commencé à réserver ton {p} ({x}). Je te le garde ? Dis-moi ton quartier et le jour qui t'arrange 🙂",
  veille: "Bonsoir 🙂 Petit rappel : on te livre ton {p} demain à {l}. Garde ton téléphone allumé 🙏",
  problem: "Bonjour, on n'a pas pu te joindre pour ton {p}. Quel jour t'arrange pour la livraison ?"
};
const TAGS = [["vip", "VIP"], ["fid", "Fidèle"], ["new", "Nouveau client"], ["vite", "Pressé"], ["hes", "Hésitant"], ["stop", "Ne pas relancer"]];
const DRIVERS = ["Ali", "Moussa", "Issouf"];
const PAY = ["Espèces", "Orange Money", "Moov Money"];
const F = n => n.toLocaleString("fr-FR").replace(/ |\s/g, " ") + " F";
let id = 0;
const O = (g, l, p, x, j, tel, tags = [], extra = {}) => ({ id: ++id, g, l, p, x, j, tel, tags, done: false, buys: 0, spent: 0, ...extra });
const orders = [
  O("call", "Tanghin", "Kit Minceur", 7500, "aujourd'hui", "70 00 00 11", ["new"]),
  O("call", "Ouaga 2000", "Kit Maca", 12500, "demain", "76 00 00 24", ["vip"], { buys: 3, spent: 34500 }),
  O("call", "Pissy", "Kit Minceur × 2", 11000, "aujourd'hui", "65 00 00 37", ["vite"]),
  O("jour", "Gounghin", "Green Mask", 7500, "aujourd'hui", "71 00 00 42", ["fid"], { buys: 2, spent: 15000, drv: "Ali" }),
  O("jour", "Zogona", "Kit Minceur", 7500, "aujourd'hui", "74 00 00 58", []),
  O("relance", "Kossodo", "Kit Minceur", 7500, "à choisir", "72 00 00 63", ["hes"], { step: "J+3" }),
  O("relance", "Dassasgho", "Kit Maca", 12500, "à choisir", "60 00 00 79", [], { step: "J+1" }),
  O("relance", "Wemtenga", "Green Mask", 7500, "à choisir", "75 00 00 81", [], { step: "J+7" }),
  O("hot", "Karpala", "Kit Minceur", 7500, "à choisir", "66 00 00 92", ["new"], { stop: "Jour" }),
  O("hot", "Bobo-Dioulasso", "Kit Minceur", 7500, "à choisir", "77 00 00 04", [], { stop: "Ville" }),
  O("veille", "Cissin", "Kit Maca", 12500, "demain", "70 00 00 15", ["fid"], { buys: 4, spent: 47500, drv: "Moussa" }),
  O("veille", "Somgandé", "Green Mask", 7500, "demain", "64 00 00 26", []),
  O("problem", "Patte d'Oie", "Kit Minceur", 7500, "hier (raté)", "78 00 00 33", ["stop"])
];
const TOTAL = orders.length;
let cur = "call", open = null;
try { cur = localStorage.getItem("wsb_group") || "call"; } catch (e) {}
const $ = s => document.querySelector(s);
const grp = k => GROUPS.find(g => g.k === k);
const left = k => orders.filter(o => o.g === k && !o.done);
const initials = l => l.replace(/[^A-Za-zÀ-ÿ ]/g, " ").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const fill = (t, o) => t.replace("{p}", o.p).replace("{x}", F(o.x)).replace("{j}", o.j).replace("{l}", o.l);
const wa = o => "https://wa.me/226" + o.tel.replace(/\s/g, "") + "?text=" + encodeURIComponent(fill(MSG[o.g], o));
const tagHtml = o => o.tags.map(t => `<span class="tag ${t}">${TAGS.find(x => x[0] === t)[1]}</span>`).join("");

function renderSteps(bump) {
  $("#steps").innerHTML = GROUPS.map(g => {
    const n = left(g.k).length;
    return `<button class="step g-${g.c}${n ? "" : " zero"}${bump === g.k ? " bump" : ""}" data-g="${g.k}" aria-pressed="${cur === g.k}">
      <span class="ic">${IC[g.ic]}</span><span class="l">${g.t}</span><span class="n">${n}</span></button>`;
  }).join("");
  const done = orders.filter(o => o.done).length;
  $("#ringPr").style.strokeDashoffset = 169.6 * (1 - done / TOTAL);
  $("#ringTxt").textContent = done + "/" + TOTAL;
  const rest = TOTAL - done;
  $("#hiSub").textContent = rest ? rest + " client" + (rest > 1 ? "s" : "") + " à traiter. Exemple avec de fausses commandes." : "Tout est fait pour aujourd'hui. Bravo !";
}
function renderList() {
  const g = grp(cur), l = left(cur);
  $("#list").innerHTML = `<div class="ghead"><h2>${g.t}</h2><span>${l.length}</span></div><p class="ghint">${g.h}</p>
    <div class="cards">${l.length ? l.map((o, i) => `<button class="card g-${g.c}" data-o="${o.id}" style="animation-delay:${i * 45}ms">
      <span class="pic">${initials(o.l)}</span>
      <span style="min-width:0"><div class="t">${o.l}</div><div class="d">${o.p} · ${o.j}</div>${o.tags.length || o.step || o.stop ? `<div class="tags">${o.step ? `<span class="badge">${o.step}</span>` : ""}${o.stop ? `<span class="badge">Arrêté à : ${o.stop}</span>` : ""}${tagHtml(o)}</div>` : ""}</span>
      <span class="r"><span class="p">${F(o.x)}</span><span class="chev">${IC.chev}</span></span></button>`).join("")
    : `<div class="empty"><b>C'est fait</b>Plus rien dans cette étape. Choisis une autre bulle.</div>`}</div>`;
}
function render(bump) { renderSteps(bump); renderList(); }

function sheetMain(o) {
  const g = grp(o.g), n = NEXT[o.g];
  return `<div class="grab"></div>
  <div class="sh-top g-${g.c}"><span class="pic">${initials(o.l)}</span><div><h3>${o.l}</h3><p>${o.p} · <b>${F(o.x)}</b> · ${o.j}</p>${o.tags.length ? `<div class="tags" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${tagHtml(o)}</div>` : ""}</div>
    <button class="x" data-a="close" aria-label="Fermer">${IC.x}</button></div>
  <div class="next g-${g.c}"><small>Prochaine étape</small><div class="q">${n.q}</div><button class="big" data-a="done">${IC.check} ${n.b}</button></div>
  <div class="acts">
    <button class="act a-wa" data-a="wa"><span class="ic">${IC.wa}</span>Écrire</button>
    <button class="act a-call" data-a="call" style="animation-delay:30ms"><span class="ic">${IC.call}</span>Appeler</button>
    <button class="act a-info" data-a="info" style="animation-delay:60ms"><span class="ic">${IC.info}</span>Infos client</button>
    <button class="act a-tag" data-a="tag" style="animation-delay:90ms"><span class="ic">${IC.tag}</span>Tags</button>
    <button class="act a-drv" data-a="drv" style="animation-delay:120ms"><span class="ic">${IC.drv}</span>Livreur</button>
    <button class="act a-pay" data-a="pay" style="animation-delay:150ms"><span class="ic">${IC.pay}</span>Payé</button>
    <button class="act a-day" data-a="day" style="animation-delay:180ms"><span class="ic">${IC.day}</span>Autre jour</button>
    <button class="act a-no" data-a="cancel" style="animation-delay:210ms"><span class="ic">${IC.no}</span>Annuler</button>
  </div>`;
}
const backBtn = `<button class="back" data-a="main">${IC.left} Retour</button>`;
const SUBS = {
  wa: o => `${backBtn}<div class="sub"><div class="msg">${fill(MSG[o.g], o)}</div>
    <div class="row2"><button class="btn" data-a="copy">Copier le message</button><a class="btn pri" href="${wa(o)}" target="_blank" rel="noopener">Ouvrir WhatsApp</a></div></div>`,
  call: o => `${backBtn}<div class="sub facts"><div class="fact"><span>Numéro</span><b class="phone">${o.tel}</b></div></div>
    <div class="row2"><button class="btn" data-a="copytel">Copier le numéro</button><a class="btn pri" href="tel:+226${o.tel.replace(/\s/g, "")}">Appeler</a></div>`,
  info: o => `${backBtn}<div class="sub"><div class="facts">
    <div class="fact"><span>Téléphone</span><b class="phone">${o.tel}</b></div>
    <div class="fact"><span>Quartier</span><b>${o.l}</b></div>
    <div class="fact"><span>Commandes livrées</span><b>${o.buys}</b></div>
    <div class="fact"><span>Total dépensé</span><b>${F(o.spent)}</b></div>
    <div class="fact"><span>Livreur</span><b>${o.drv || "Pas encore choisi"}</b></div>
    <div class="fact"><span>Paiement</span><b>${o.paid || "Pas encore payé"}</b></div></div>
    ${o.buys ? `<div class="hist"><div><span>${o.p}</span><b>Livrée</b></div><div><span>Kit Maca</span><b>Livrée</b></div></div>` : `<p class="ghint" style="margin-top:12px">Première commande de ce client.</p>`}</div>`,
  tag: o => `${backBtn}<div class="sub"><p class="ghint">Touche pour ajouter ou enlever.</p><div class="choices">${TAGS.map(([k, l]) => `<button class="choice" data-tag="${k}" aria-pressed="${o.tags.includes(k)}">${l}</button>`).join("")}</div></div>`,
  drv: o => `${backBtn}<div class="sub"><p class="ghint">Qui livre ce client ?</p><div class="choices">${DRIVERS.map(d => `<button class="choice" data-drv="${d}" aria-pressed="${o.drv === d}">${d}</button>`).join("")}</div></div>`,
  pay: o => `${backBtn}<div class="sub"><p class="ghint">Le client a payé ${F(o.x)} comment ?</p><div class="choices">${PAY.map(d => `<button class="choice" data-pay="${d}" aria-pressed="${o.paid === d}">${d}</button>`).join("")}</div></div>`,
  day: o => `${backBtn}<div class="sub"><p class="ghint">Nouveau jour de livraison</p><div class="choices">${["Demain", "Après-demain", "Samedi", "Lundi"].map(d => `<button class="choice" data-day="${d}">${d}</button>`).join("")}</div></div>`,
  cancel: o => `${backBtn}<div class="sub"><p class="ghint">Annuler cette commande ? Elle sortira de la liste.</p><div class="row2"><button class="btn" data-a="main">Garder</button><button class="btn" style="background:var(--red);border-color:var(--red);color:var(--surface)" data-a="kill">Oui, annuler</button></div></div>`
};
function head(o) { const g = grp(o.g); return `<div class="grab"></div><div class="sh-top g-${g.c}"><span class="pic">${initials(o.l)}</span><div><h3>${o.l}</h3><p>${o.p} · <b>${F(o.x)}</b></p></div><button class="x" data-a="close" aria-label="Fermer">${IC.x}</button></div>`; }
function show(o, view = "main") {
  open = o;
  $("#sheet").innerHTML = view === "main" ? sheetMain(o) : head(o) + SUBS[view](o);
  const sc = $("#scrim"), sh = $("#sheet");
  if (sh.hidden) { sc.hidden = sh.hidden = false; requestAnimationFrame(() => { sc.classList.add("on"); sh.classList.add("on"); }); }
}
function close() {
  const sc = $("#scrim"), sh = $("#sheet"); open = null;
  sc.classList.remove("on"); sh.classList.remove("on");
  setTimeout(() => { if (!open) sc.hidden = sh.hidden = true; }, 320);
}
let tt;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2400); }
function finish(o, msg, moveTo) {
  close();
  const card = document.querySelector(`[data-o="${o.id}"]`);
  const apply = () => {
    if (moveTo) { o.g = moveTo; if (moveTo === "veille") o.j = "demain"; } else o.done = true;
    render(moveTo || cur); toast(msg);
  };
  if (card) { card.classList.add("leave"); setTimeout(apply, 380); } else apply();
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); toast("Copié"); } catch (e) { toast("Sélectionne le texte pour le copier"); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button,a"); if (!b) return;
  if (b.dataset.g) { cur = b.dataset.g; try { localStorage.setItem("wsb_group", cur); } catch (x) {} render(); if (innerWidth < 900) $("#list").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (b.dataset.o) { show(orders.find(o => o.id == b.dataset.o)); return; }
  if (b.hasAttribute("data-nav")) { toast("Prototype : seul l'écran Commandes est maquetté"); return; }
  const o = open; if (!o) return;
  const a = b.dataset.a;
  if (a === "close") return close();
  if (a === "main") return show(o);
  if (SUBS[a]) return show(o, a);
  if (a === "copy") return copy(fill(MSG[o.g], o));
  if (a === "copytel") return copy(o.tel);
  if (a === "kill") return finish(o, "Commande annulée");
  if (a === "done") {
    if (o.g === "call") return finish(o, o.j === "aujourd'hui" ? "Confirmée ✓ Elle passe dans « À livrer aujourd'hui »" : "Confirmée ✓ Elle passe dans « Livraisons de demain »", o.j === "aujourd'hui" ? "jour" : "veille");
    if (o.g === "hot") { o.tags = o.tags.filter(t => t !== "new"); return finish(o, "Super ✓ Le prospect passe dans « À confirmer »", "call"); }
    if (o.g === "problem") return show(o, "day");
    return finish(o, NEXT[o.g].b + " ✓");
  }
  if (b.dataset.tag) { const k = b.dataset.tag; o.tags = o.tags.includes(k) ? o.tags.filter(t => t !== k) : [...o.tags, k]; b.setAttribute("aria-pressed", o.tags.includes(k)); renderList(); return; }
  if (b.dataset.drv) { o.drv = b.dataset.drv; toast(o.drv + " livrera ce client"); show(o); return; }
  if (b.dataset.pay) { o.paid = b.dataset.pay; toast("Paiement noté : " + o.paid); show(o); return; }
  if (b.dataset.day) { o.j = b.dataset.day.toLowerCase(); return finish(o, "Reprogrammée pour " + o.j + " ✓", "veille"); }
});
$("#scrim").addEventListener("click", close);
document.addEventListener("keydown", e => { if (e.key === "Escape" && open) close(); });
const h = new Date().getHours();
$("#hi").textContent = (h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : "Bonsoir") + " Yasmine";
render();
</script>
